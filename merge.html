<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合成大杜勒 · 忘忘同人小游戏</title>
<meta name="description" content="合成大西瓜的玩法，素材是《忘却前夜》的头像：把小煤球丢进瓶子，两个同级头像相撞就合成下一级，一路合到杜勒赛因。四档难度，每局按分数换银芯。">
<meta name="theme-color" content="#0b0e15">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231f2430%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%224.5%22%2F%3E%0A%20%20%3Cline%20x1%3D%2237.5%22%20y1%3D%2236.5%22%20x2%3D%2249%22%20y2%3D%2248%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%224%22%20fill%3D%22%23e8b04b%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
<style>
/* 这一页不引用 css/style.css：那边 65KB 是给整站的，这里只要一个游戏壳。
   页面自带的样式 + 一个脚本请求就够跑起来（头像已经内联在脚本里）。 */
:root{
  --bg:#0a0d14; --panel:#121722; --panel2:#1a2130; --line:#28324a; --text:#e6e9f0;
  --dim:#8a93a8; --accent:#6ea8ff; --gold:#e3b341; --bad:#e8695f;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eef1f7; --panel:#fff; --panel2:#f4f6fb; --line:#d7dce8; --text:#1b2130;
    --dim:#667088; --accent:#2c6fdb; --gold:#9a6f00; --bad:#c8413a; }
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(760px 420px at 50% -10%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 70%);
  background-repeat:no-repeat;
}
.app{
  height:100dvh; max-width:560px; margin:0 auto;
  padding:max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}

/* ---------------------------------------------------------------- 顶栏 */
.hud{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.back{
  width:34px; height:34px; flex:0 0 34px; border-radius:10px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  text-decoration:none; font-size:15px; line-height:1;
}
.back:hover{border-color:var(--accent); color:var(--accent)}
.num{display:flex; flex-direction:column; line-height:1.15; min-width:52px}
.num b{font-size:19px; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.num span{font-size:10.5px; color:var(--dim); letter-spacing:.06em}
.num.dim b{font-size:15px; color:var(--dim); font-weight:600}
.next{
  margin-left:auto; display:flex; align-items:center; gap:7px;
  padding:3px 10px 3px 4px; border:1px solid var(--line); border-radius:999px;
  background:var(--panel);
}
.next img{width:26px; height:26px; border-radius:50%; background:var(--panel2); display:block}
.next span{font-size:10.5px; color:var(--dim); letter-spacing:.04em}
.ico{
  width:34px; height:34px; flex:0 0 34px; border-radius:10px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer;
  font:inherit; padding:0;
}
.ico:hover{border-color:var(--accent); color:var(--accent)}
.ico.off{color:var(--dim); opacity:.5}
.ico svg{width:17px; height:17px; display:block}

/* ---------------------------------------------------------------- 舞台 */
.stage{
  position:relative; flex:1 1 auto; min-height:0;
  display:flex; align-items:center; justify-content:center;
}
canvas#cv{
  display:block; border-radius:16px; touch-action:none; cursor:pointer;
  box-shadow:0 26px 60px -34px rgba(0,0,0,.95), 0 0 0 1px var(--line);
  background:#0d111b;
}
/* 载入占位：纯 HTML，脚本没到也有东西看 */
#boot{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; text-align:center;
  border-radius:16px; background:#0d111b; color:#8a93a8; font-size:13px;
}
#boot .ring{
  width:26px; height:26px; border-radius:50%;
  border:2px solid rgba(150,170,210,.22); border-top-color:#6ea8ff;
  animation:spin .9s linear infinite;
}
#bootText{margin:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------------------------------------------------------- 难度与随机 */
/* 四档难度只改投放池、警戒线、越线容忍；合成链不变，终点永远是杜勒赛因。
   「随机」是手里卡了大球时的救命按钮，次数按难度递减。 */
.diff{display:flex; align-items:center; gap:5px; flex:0 0 auto}
.diff button{
  flex:1 1 0; min-width:0; height:29px; padding:0 2px;
  border:1px solid var(--line); border-radius:999px; background:var(--panel);
  color:var(--dim); font:inherit; font-size:12px; white-space:nowrap; cursor:pointer;
  transition:color .15s ease, border-color .15s ease, background .15s ease, transform .1s ease;
}
.diff button:active{transform:scale(.96)}
.diff button.on{
  color:var(--gold); font-weight:600;
  border-color:color-mix(in srgb, var(--gold) 58%, var(--line));
  background:color-mix(in srgb, var(--gold) 13%, var(--panel));
}
.diff .rand{
  flex:0 0 auto; display:flex; align-items:center; gap:4px; padding:0 8px 0 7px;
  color:var(--gold); border-color:color-mix(in srgb, var(--gold) 40%, var(--line));
  background:color-mix(in srgb, var(--gold) 8%, var(--panel));
}
.diff .rand svg{width:14px; height:14px; display:block; flex:none}
.diff .rand i{
  font-style:normal; font-size:10.5px; line-height:15px; min-width:15px; text-align:center;
  border-radius:999px; padding:0 4px;
  background:color-mix(in srgb, var(--gold) 26%, transparent);
}
.diff .rand.out{color:var(--dim); border-color:var(--line); background:var(--panel); opacity:.5}
.diff .rand.out i{background:var(--panel2)}

/* 换皮：和「随机」同形不同色（随机是救命绳，金色；换皮是装饰，紫色），
   换过之后描边亮起来，一眼知道当前不是原图 */
.diff .skin{
  color:#a99cff; border-color:color-mix(in srgb, #a99cff 40%, var(--line));
  background:color-mix(in srgb, #a99cff 8%, var(--panel));
}
.diff .skin.on{
  color:#cdc4ff; border-color:color-mix(in srgb, #a99cff 70%, var(--line));
  background:color-mix(in srgb, #a99cff 18%, var(--panel));
  box-shadow:0 0 0 1px color-mix(in srgb, #a99cff 24%, transparent);
}
.diff .skin svg{width:14px; height:14px; display:block; flex:none}
.diff [hidden]{display:none !important}

/* 银芯图标：字内排版，跟着字号走，不撑高行框 */
img.sc{
  width:16px; height:16px; display:inline-block; vertical-align:-3px;
  margin:0 3px 0 1px; border-radius:4px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
}

/* ---------------------------------------------------------------- 结算 */
.ov{
  position:absolute; inset:0; display:grid; place-items:center; padding:16px;
  border-radius:16px; background:rgba(6,9,14,.72); backdrop-filter:blur(6px);
  opacity:0; transition:opacity .18s ease;
}
.ov.on{opacity:1}
.ov[hidden]{display:none}
.card{
  width:min(300px,100%); padding:20px 20px 18px; text-align:center;
  background:#121722; border:1px solid #2b3448; border-radius:16px; color:#e6e9f0;
  box-shadow:0 28px 60px -30px rgba(0,0,0,.9);
}
.card .k{margin:0 0 6px; font-size:11.5px; letter-spacing:.2em; color:#8a93a8}
.card .big{margin:0; display:flex; align-items:baseline; justify-content:center; gap:4px}
.card .big b{font-size:40px; line-height:1; font-variant-numeric:tabular-nums; color:#e3b341}
.card .big span{font-size:12px; color:#8a93a8}
.card .sub{margin:10px 0 3px; font-size:12.5px; line-height:1.6; color:#c3cad8}
.card .cred{margin:12px 0 2px; font-size:12px; color:#8a93a8; letter-spacing:.02em}
.card .cred b{font-size:21px; line-height:1; color:#8a93a8; font-variant-numeric:tabular-nums; margin-right:2px}
.card .cred span{margin-left:6px; font-size:11px; color:#8a93a8}
.card .cred.on b{color:#e3b341}
.card .sub2{margin:0 0 16px; font-size:11.5px; color:#8a93a8}
.acts{display:flex; gap:8px}
.btn{
  flex:1; display:inline-flex; align-items:center; justify-content:center;
  padding:9px 0; border-radius:10px; border:1px solid #2b3448; background:#1a2130;
  color:#e6e9f0; font:inherit; font-size:13.5px; text-decoration:none; cursor:pointer;
}
.btn:hover{border-color:#6ea8ff; color:#6ea8ff}
.btn.primary{
  background:linear-gradient(100deg, #6ea8ff, #a07cff); border-color:transparent;
  color:#fff; font-weight:600;
}
.btn.primary:hover{color:#fff; opacity:.92}

/* ---------------------------------------------------------------- 合成链 */
.chain{
  flex:0 0 auto; display:flex; justify-content:center; align-items:center;
  gap:clamp(1px,0.6vw,5px); height:42px;
}
.ch{
  display:block; width:100%; max-width:30px; aspect-ratio:1; border-radius:50%;
  background:var(--panel2); box-shadow:inset 0 0 0 1px var(--line);
  border:2px solid var(--bd, transparent); box-sizing:border-box;
}
.ch img{
  width:100%; height:100%; display:block; border-radius:50%;
  filter:grayscale(1) brightness(.9); opacity:.26; transition:filter .2s ease, opacity .2s ease;
}
.ch.on{background:transparent; box-shadow:none}
.ch.on img{filter:none; opacity:1}

/* ---------------------------------------------------------------- 越线预警 */
/* 球堆开始压线时不等到判负再说话：先给一条提示，同时把游戏区描一圈红光 */
body.danger canvas#cv{
  box-shadow:0 0 0 2px rgba(232,105,95,.45),
             0 0 46px -6px rgba(232,105,95,.42),
             0 26px 60px -34px rgba(0,0,0,.95);
}
.hot{
  position:fixed; left:50%; top:13%; z-index:55;
  padding:7px 15px 8px; border-radius:999px; overflow:hidden;
  font-size:12.5px; letter-spacing:.02em; white-space:nowrap;
  color:#ffe2dc; background:rgba(72,22,20,.9);
  border:1px solid rgba(232,105,95,.52);
  box-shadow:0 12px 28px -16px rgba(232,105,95,.95);
  opacity:0; transform:translate(-50%,-8px); pointer-events:none;
  transition:opacity .16s ease, transform .16s ease;
}
.hot.on{opacity:1; transform:translate(-50%,0)}
.hot.near{
  color:#ffeccc; background:rgba(70,52,16,.9);
  border-color:rgba(227,179,65,.5);
  box-shadow:0 12px 28px -16px rgba(227,179,65,.9);
}
.hot::after{
  content:''; position:absolute; left:0; bottom:0; height:2px;
  width:calc(var(--p,0) * 100%); background:#e8695f;
  box-shadow:0 0 8px rgba(232,105,95,.9);
}
.hot.near::after{width:0}

/* ---------------------------------------------------------------- 提示 */
.toast{
  position:fixed; left:50%; bottom:16%; transform:translate(-50%, 6px); z-index:60;
  padding:8px 16px; border-radius:999px; font-size:13px; white-space:nowrap;
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  box-shadow:0 16px 34px -18px rgba(0,0,0,.9);
  transform:translate(-50%,0);
  transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
}
.toast.out{opacity:0; transform:translate(-50%,-8px)}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
<meta name="build" content="f712b2f90f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app/icon-192.png">

<body>
<div class="app">
  <header class="hud">
    <a class="back" href="index.html" title="回首页" aria-label="回首页">←</a>
    <div class="num"><b id="sc">0</b><span>分数</span></div>
    <div class="num dim"><b id="bs">0</b><span>最高</span></div>
    <div class="next"><img id="nx" alt="下一颗"><span>下一颗</span></div>
    <button class="ico" id="bgm" aria-pressed="true" title="背景音乐开关（M）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V6.5l9-2v10.2"/><circle cx="6.6" cy="18" r="2.4"/><circle cx="15.6" cy="16.9" r="2.4"/>
      </svg>
    </button>
    <button class="ico" id="snd" aria-pressed="true" title="音效开关">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/>
      </svg>
    </button>
    <button class="ico" id="rst" title="重新开始（R）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11a8 8 0 1 1-2.6-5.6"/><path d="M20 4.5V10h-5.4"/>
      </svg>
    </button>
  </header>

  <div class="diff" id="diff" role="tablist" aria-label="难度">
    <button role="tab" data-diff="easy" aria-selected="false">简单</button>
    <button role="tab" data-diff="normal" aria-selected="true">普通</button>
    <button role="tab" data-diff="hard" aria-selected="false">困难</button>
    <button role="tab" data-diff="frenzy" aria-selected="false">癫狂</button>
    <button class="rand" id="rand" title="把手上这颗换成前几级的随机一颗（X）" aria-label="随机前几级唤醒体">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/>
        <circle cx="8.6" cy="8.6" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="15.4" cy="15.4" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
      <span>随机</span><i id="randn">5</i>
    </button>
    <button class="rand skin" id="skin" title="从全部唤醒体里随机换掉前九级的头像（Y），不重复，杜勒赛因固定" aria-label="随机换头像">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7.5h6l7 9h3"/><path d="M4 16.5h6l2.4-3.1"/><path d="M17.6 4.6 20 7l-2.4 2.4"/><path d="M20 16.5h-2.4"/>
      </svg>
      <span>换皮</span>
    </button>
    <button class="rand skin" id="skinReset" hidden title="还原成原来的头像" aria-label="还原头像">
      <span>还原</span>
    </button>
  </div>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="合成大杜勒游戏区"></canvas>
    <div id="boot" role="status" aria-live="polite">
      <div class="ring"></div>
      <p id="bootText">正在载入…</p>
    </div>
    <div class="ov" id="ov" hidden>
      <div class="card">
        <p class="k" id="ovk">瓶子满了</p>
        <p class="big"><b id="ovs">0</b><span>分</span></p>
        <p class="cred" id="ovc"></p>
        <p class="sub" id="ovd"></p>
        <p class="sub2" id="ovb"></p>
        <div class="acts">
          <button class="btn primary" id="again">再来一局</button>
          <a class="btn" href="index.html">回首页</a>
        </div>
      </div>
    </div>
  </main>

  <div id="hot" class="hot" role="status" aria-live="polite"></div>

  <footer class="chain" id="chain" aria-label="合成链：从小煤球到杜勒赛因"></footer>
</div>
<script>
/* 载入守护（内联，不占请求）：脚本卡住时至少给个说法和一个按钮 */
(function () {
  var t0 = Date.now();
  setTimeout(function () {
    var t = document.getElementById('bootText');
    if (t) t.textContent = '还在载入头像…（首次访问会慢一些）';
  }, 5000);
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (!b || Date.now() - t0 < 18000) return;
    b.innerHTML = '<p id="bootText">载入超时</p>';
    var btn = document.createElement('button');
    btn.textContent = '重新载入';
    btn.style.cssText = 'padding:7px 16px;border-radius:9px;border:1px solid #28324a;background:#1a2130;color:#e6e9f0;font:inherit;cursor:pointer';
    btn.onclick = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    b.appendChild(btn);
  }, 18000);
})();
</script>
<script type="module" src="js/b/merge.js?v=f712b2f90f"></script>
<!-- 横屏 / 竖屏：所有小游戏共用的一块 UI 与逻辑，构建时注入到每个游戏页 </body> 前。
     为什么放在这里而不是各页面各写一份：七个游戏的头部结构完全不一样，
     但「现在该用哪个方向」这件事是同一件——所以只留一份，改一次全站生效。
     行为：
       · 记在每个游戏自己的键上（zjtt:orient:<游戏>），换游戏不会互相影响
       · 优先用 screen.orientation.lock 真正锁方向（Chrome / PWA / 桌面版可用）
       · 锁不住（iOS Safari、桌面浏览器）时：横屏但手机竖着 → 提示「把手机横过来」
       · 改完方向补一次 resize，canvas 游戏会按新尺寸重排 -->
<style>
.zj-orient{
  position:fixed; left:10px; bottom:10px; z-index:80;
  display:flex; align-items:center; gap:2px; padding:3px;
  background:rgba(18,23,33,.82); border:1px solid rgba(150,165,195,.28);
  border-radius:11px; backdrop-filter:blur(6px);
  font:12px/1 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#c8d1e3; box-shadow:0 10px 24px -14px #000;
}
.zj-orient button{
  appearance:none; border:0; background:none; cursor:pointer;
  color:inherit; font:inherit; padding:5px 8px; border-radius:8px;
  display:flex; align-items:center; gap:4px;
}
.zj-orient button:hover{background:rgba(120,150,210,.16)}
.zj-orient button.on{background:rgba(110,168,255,.2); color:#dfe8ff}
.zj-orient .sep{width:1px; height:14px; background:rgba(150,165,195,.25)}
.zj-orient .lbl{font-size:10.5px; opacity:.62; padding:0 3px}
/* 窄屏：只剩一颗循环切换的小钮，别压住游戏底部的摇杆 / 预览条 */
.zj-orient.narrow{padding:2px; gap:0}
.zj-orient.narrow button{padding:6px 7px; line-height:1}
@media (max-width:720px){ .zj-orient{bottom:8px; left:8px; padding:2px} .zj-orient .lbl{display:none} }

.zj-rot{
  position:fixed; inset:0; z-index:9999; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(8,11,18,.94); color:#e6e9f0; text-align:center; padding:24px;
  font:14px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.zj-rot.on{display:flex}
.zj-rot svg{width:64px; height:64px; opacity:.85; animation:zjrot 2.4s ease-in-out infinite}
@keyframes zjrot{0%,45%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
.zj-rot b{font-size:16px}
.zj-rot p{margin:0; max-width:22em; color:#98a3ba; font-size:13px}
.zj-rot .acts{display:flex; gap:10px; margin-top:4px}
.zj-rot button{
  appearance:none; font:inherit; font-size:13px; padding:8px 16px; border-radius:9px;
  border:1px solid rgba(150,165,195,.3); background:rgba(30,37,50,.9); color:#dfe6f5; cursor:pointer;
}
.zj-rot button.pri{background:linear-gradient(100deg,#6ea8ff,#a07cff); border-color:transparent; color:#fff}
</style>
<script>
(function () {
  'use strict';
  var path = location.pathname;
  var file = (path.split('/').pop() || '').replace(/\.html?$/i, '');
  var game = /\/idle\//.test(path) ? 'idle'
    : /\/deathreport\//.test(path) ? 'deathreport'
    : (file || 'index');
  var KEY = 'zjtt:orient:' + game;
  var MODES = [
    { k: 'auto', t: '自动', icon: '⟲' },
    { k: 'land', t: '横屏', icon: '▭' },
    { k: 'port', t: '竖屏', icon: '▯' }
  ];

  function read() {
    try { return localStorage.getItem(KEY) || 'auto'; } catch (e) { return 'auto'; }
  }
  var pref = read();
  var baseTitle = document.title;

  // 窄屏（手机）上游戏画面本来就挤，左下角只留一颗小圆钮，点一下循环切换；
  // 宽屏才摊开成三个按钮。判定只在加载时做一次，避免旋屏时反复重建 DOM。
  var mqNarrow = window.matchMedia ? window.matchMedia('(max-width:720px)') : null;
  var narrow = !!(mqNarrow && mqNarrow.matches);

  // ---- UI
  var bar = document.createElement('div');
  bar.className = 'zj-orient';
  bar.setAttribute('role', 'group');
  bar.setAttribute('aria-label', '游玩方向');

  function modeOf(k) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].k === k) return MODES[i];
    return MODES[0];
  }

  function buildBar() {
    bar.innerHTML = '';
    if (narrow) {
      bar.classList.add('narrow');
      var cur = modeOf(pref);
      var b1 = document.createElement('button');
      b1.type = 'button';
      b1.dataset.k = cur.k;
      b1.className = 'on';
      b1.title = '方向：' + cur.t + '（点一下换）';
      b1.setAttribute('aria-label', '游玩方向：' + cur.t + '，点按切换');
      b1.innerHTML = '<span aria-hidden="true">' + cur.icon + '</span>';
      b1.addEventListener('click', function () {
        var i = MODES.map(function (m) { return m.k; }).indexOf(pref);
        set(MODES[(i + 1) % MODES.length].k, true);
      });
      bar.appendChild(b1);
      return;
    }
    bar.innerHTML = '<span class="lbl">方向</span>';
    MODES.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.k = m.k;
      b.title = m.t === '自动' ? '跟随手机方向' : ('锁定' + m.t);
      b.innerHTML = '<span aria-hidden="true">' + m.icon + '</span><span>' + m.t + '</span>';
      b.addEventListener('click', function () { set(m.k, true); });
      bar.appendChild(b);
    });
  }
  buildBar();

  var overlay = document.createElement('div');
  overlay.className = 'zj-rot';
  overlay.innerHTML = [
    '<svg viewBox="0 0 24 24" fill="none" stroke="#c8d1e3" stroke-width="1.4" stroke-linecap="round">',
    '<rect x="6.5" y="2.5" width="11" height="19" rx="2.4"/>',
    '<path d="M10 5.4h4"/><circle cx="12" cy="18.4" r="1.05" fill="#c8d1e3" stroke="none"/>',
    '</svg>',
    '<b>把手机横过来</b>',
    '<p>这个游戏按横屏排版。手机系统不让网页锁方向时，转一下机身就好；不想转也可以先竖着玩。</p>',
    '<div class="acts"><button type="button" class="pri" data-act="keep">已经横过来了</button>',
    '<button type="button" data-act="port">仍要竖屏玩</button></div>'
  ].join('');

  function ready(fn) {
    if (document.body) fn();
    else document.addEventListener('DOMContentLoaded', fn, { once: true });
  }

  function applyCss() {
    var r = document.documentElement;
    if (pref === 'auto') r.removeAttribute('data-orient');
    else r.setAttribute('data-orient', pref);
    document.dispatchEvent(new CustomEvent('zj:orient', { detail: { mode: pref } }));
    setTimeout(function () {
      window.dispatchEvent(new Event('resize'));
      if (window.visualViewport) window.dispatchEvent(new Event('resize'));
    }, 80);
  }

  function paint() {
    if (narrow) {
      var cur = modeOf(pref);
      var only = bar.querySelector('button');
      if (only) {
        only.dataset.k = cur.k;
        only.title = '方向：' + cur.t + '（点一下换）';
        only.setAttribute('aria-label', '游玩方向：' + cur.t + '，点按切换');
        only.innerHTML = '<span aria-hidden="true">' + cur.icon + '</span>';
      }
    } else {
      [].forEach.call(bar.querySelectorAll('button'), function (b) {
        b.classList.toggle('on', b.dataset.k === pref);
        b.setAttribute('aria-pressed', b.dataset.k === pref ? 'true' : 'false');
      });
    }
    checkRotateHint();
  }

  // 锁定失败 + 手机竖着 = 给个转屏提示；已锁住时系统自己会转，不用提示
  function checkRotateHint() {
    var portrait = window.matchMedia && window.matchMedia('(orientation: portrait)').matches;
    var small = Math.min(screen.width || 9999, screen.height || 9999) < 820;
    var need = pref === 'land' && portrait && small && !locked;
    overlay.classList.toggle('on', need && !dismissed);
    document.body.style.overflow = overlay.classList.contains('on') ? 'hidden' : '';
  }

  var locked = false;
  var dismissed = false;

  function lock(mode) {
    if (!screen.orientation || typeof screen.orientation.lock !== 'function') return Promise.reject();
    return screen.orientation.lock(mode === 'land' ? 'landscape' : mode === 'port' ? 'portrait' : 'any')
      .then(function () { locked = mode !== 'auto'; })
      .catch(function () { locked = false; });
  }

  function fs(on) {
    try {
      if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) {
        return document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
      }
      if (!on && document.fullscreenElement && document.exitFullscreen) return document.exitFullscreen().catch(function () {});
    } catch (e) { /* 桌面/老浏览器没有全屏，忽略 */ }
    return Promise.resolve();
  }

  function set(mode, fromUser) {
    pref = mode;
    try { localStorage.setItem(KEY, mode); } catch (e) {}
    dismissed = false;
    locked = false;
    if (!fromUser) { paint(); return; }
    // 只有用户主动点才要全屏（浏览器要求锁方向必须在手势里、且多为全屏态）
    var seq = mode === 'auto'
      ? Promise.all([lock('auto'), fs(false)])
      : fs(true).then(function () { return lock(mode); });
    Promise.resolve(seq).then(function () {
      applyCss();
      paint();
      if (mode === 'land' && !locked) {
        // 锁不上：至少别让用户以为按钮坏了
        setTimeout(checkRotateHint, 60);
      }
    });
  }

  overlay.addEventListener('click', function (e) {
    var act = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!act) return;
    if (act.dataset.act === 'keep') {
      dismissed = true; overlay.classList.remove('on'); document.body.style.overflow = '';
      window.dispatchEvent(new Event('resize'));
    } else {
      set('port', true);
      overlay.classList.remove('on'); document.body.style.overflow = '';
    }
  });

  ready(function () {
    document.body.appendChild(bar);
    document.body.appendChild(overlay);
    // 页面自己已经有「全屏」按钮时别抢：只在面板里改状态
    if (pref !== 'auto') {
      // 回访直接恢复：不请求全屏（无手势会被拒），能锁就锁
      lock(pref).then(applyCss).catch(applyCss);
    } else {
      applyCss();
    }
    paint();
    window.addEventListener('resize', checkRotateHint);
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { checkRotateHint(); window.dispatchEvent(new Event('resize')); }, 260);
    });
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', function () {
        setTimeout(function () { checkRotateHint(); window.dispatchEvent(new Event('resize')); }, 160);
      });
    }
  });
})();
</script>
<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
