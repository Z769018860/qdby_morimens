<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG 典藏馆 · 战报侦探</title>
<meta name="description" content="忘却前夜官方 CG 典藏馆：用银芯解锁灰机 wiki 收录的全部 CG。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="modulepreload" href="js/account.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/auth.js">
<link rel="modulepreload" href="js/common.js">
<link rel="modulepreload" href="js/gallery.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/theme.js">
</head>
<body>
<main id="app" class="wrap">
  <div id="boot" role="status" aria-live="polite">
    <div class="ring"></div>
    <p class="bt" id="bootText">正在载入…</p>
    <p class="bh" id="bootHint"></p>
  </div>
</main>
<footer class="foot">同人作品，与官方无关。CG 收录自忘却前夜中文维基（灰机 wiki），版权归 Qookka Games 所有。</footer>
<script type="module">await 0; window.__tla = true;</script>
<script nomodule>/* 老到不支持 ES module（多半是 360/QQ 浏览器的「兼容模式」= IE 内核） */
(function () {
  var el = document.getElementById('boot'); if (el) el.className = 'err';
  var t = document.getElementById('bootText'); if (t) t.textContent = '浏览器内核太旧';
  var h = document.getElementById('bootHint');
  if (h) h.textContent = '请在地址栏右侧把「兼容」切成「极速」（闪电图标），或改用 Chrome / Edge 打开。';
})();
</script>
<script>
/* 首屏看门狗：模块/数据卡住时也给人一条路，绝不留只有页脚的白屏。 */
(function () {
  var bootEl = document.getElementById('boot');
  var textEl = document.getElementById('bootText');
  var hintEl = document.getElementById('bootHint');
  function fail(msg) {
    if (!bootEl || !bootEl.parentNode) return;
    bootEl.className = 'err';
    if (textEl) textEl.textContent = '载入失败';
    if (hintEl) hintEl.textContent = msg || '';
    if (!bootEl.querySelector('button')) {
      var b = document.createElement('button');
      b.textContent = '重试';
      b.onclick = function () { location.replace(location.pathname + '?r=' + Date.now()); };
      bootEl.appendChild(b);
    }
  }
  window.__bootFailed = fail;
  setTimeout(function () {
    if (!document.getElementById('boot')) return;
    if (hintEl && !hintEl.textContent) hintEl.textContent = '网络较慢，正在继续载入…';
  }, 8000);
  setTimeout(function () {
    if (!document.getElementById('boot')) return;
    if (!window.__tla) {
      if (textEl) textEl.textContent = '浏览器内核版本过低';
      if (hintEl) hintEl.textContent = '本站需要 Chrome / Edge 89 及以上（360、QQ 浏览器请切到「极速模式」）。';
      return;
    }
    fail('连接可能卡住了，点重试会绕过缓存重新拉。');
  }, 25000);
  setTimeout(function () {
    if (!document.getElementById('boot') || window.__tla) return;
    if (textEl) textEl.textContent = '浏览器内核版本过低';
    if (hintEl) hintEl.textContent = '本站需要 Chrome / Edge 89 及以上（360、QQ 浏览器请切到「极速模式」）。';
  }, 1500);
  window.addEventListener('error', function (e) {
    var tg = e && e.target;
    if (tg && (tg.tagName === 'SCRIPT' || tg.tagName === 'LINK')) fail('脚本加载失败：' + (tg.src || tg.href || ''));
  }, true);
})();
</script>
<script type="module" src="js/gallery.js"></script>
</body>
</html>
