<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弥萨格轮盘 · 忘忘同人小游戏</title>
<meta name="description" content="《忘却前夜》同人的恶魔轮盘：桌上只有一把枪，枪膛里混着实弹与空壳。对自己开枪打出空壳，回合还归你；对别人开枪，就交出去。十位唤醒体各有自己的理智上限、随身道具和被动——24 的「她们」会在空枪后递来一件东西，杜勒赛因让对手少拿一件，拉蒙娜整场能回环一次。放大镜、手锯、镣铐、逆变器、残念药剂、窃取手套，谁先被打空理智谁留下。可人机、同屏双人，也能开房间码跟好友赌一把。">
<meta name="theme-color" content="#0a0a0f">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230a0a0f%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2218%22%20fill%3D%22none%22%20stroke%3D%22%23e3b341%22%20stroke-width%3D%222.6%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%224.6%22%20fill%3D%22%23e0596b%22%2F%3E%3Cpath%20d%3D%22M32%2014v6M32%2044v6M14%2032h6M44%2032h6%22%20stroke%3D%22%23e3b341%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
<style>
/* 这一页不引 css/style.css：游戏壳自带一份。配色沿用站内的深色底 + 金 / 血红，
   整体压得更暗——赌桌只留一盏灯，剩下的都是枪膛里那点反光。 */
:root{
  --bg:#0a0a0f; --bg2:#0e0e15; --panel:#15151f; --panel2:#1b1b26; --panel3:#22222f;
  --line:#282836; --line2:#373748;
  --text:#eaeaf2; --dim:#8d8da2; --dim2:#5f5f74;
  --gold:#e3b341; --gold2:#f2d38a; --red:#e0596b; --red2:#ff8494;
  --green:#4fc98a; --blue:#6ea8ff; --violet:#a37cff;
  --live:#e0596b; --blank:#7c869c;
  --shadow:0 24px 50px -30px #000;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f2f1ec; --bg2:#eae8e1; --panel:#fff; --panel2:#f6f5f0; --panel3:#eceae3;
    --line:#dcd9d0; --line2:#c6c2b6;
    --text:#1d1b22; --dim:#6b6875; --dim2:#96939d;
    --gold:#8a6200; --gold2:#6d4d00; --red:#c03b4c; --red2:#a42b3b;
    --green:#1d8055; --blue:#2f6ad0; --violet:#6d47c8;
    --live:#c03b4c; --blank:#7b8496;
    --shadow:0 20px 40px -30px rgba(20,20,40,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(760px 520px at 50% -8%, rgba(227,179,65,.13), transparent 64%),
    radial-gradient(680px 460px at 12% 108%, rgba(224,89,107,.12), transparent 66%),
    radial-gradient(700px 520px at 92% 96%, rgba(110,168,255,.08), transparent 68%);
  background-repeat:no-repeat;
}
.app{
  position:relative; height:100dvh; max-width:720px; margin:0 auto;
  padding:max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}
/* ---------------------------------------------------------------- 顶栏 */
.top{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.back{
  width:32px; height:32px; flex:0 0 32px; border-radius:9px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  text-decoration:none; font-size:15px; line-height:1;
}
.back:hover{border-color:var(--gold); color:var(--gold)}
.ttl{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.ttl b{font-size:15px; letter-spacing:.06em; white-space:nowrap}
.ttl span{font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ic{
  margin-left:auto; height:30px; min-width:34px; padding:0 9px; flex:0 0 auto; border-radius:9px;
  border:1px solid var(--line); background:var(--panel); color:var(--dim);
  font:12px/1 inherit; cursor:pointer;
}
.ic + .ic{margin-left:0}
.ic:hover{color:var(--gold); border-color:var(--gold)}
.ic.off{color:var(--dim2); text-decoration:line-through}

/* ---------------------------------------------------------------- 屏 */
.scr{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:10px; overflow:auto}
.scr[hidden]{display:none}
.scr.pad{padding-bottom:4px}

/* ---------------------------------------------------------------- 首页 */
.hero{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0 4px; text-align:center}
.hero .gunart{width:min(300px,72vw); color:var(--gold); opacity:.9}
.hero h1{
  margin:2px 0 0; font-size:26px; letter-spacing:.16em; font-weight:800;
  background:linear-gradient(180deg,var(--gold2),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{margin:0; font-size:12.5px; line-height:1.75; color:var(--dim); max-width:34em}
.modes{display:flex; flex-direction:column; gap:8px}
.mode{
  display:flex; flex-direction:column; gap:2px; align-items:flex-start; text-align:left;
  padding:12px 14px; border-radius:14px; cursor:pointer;
  border:1px solid var(--line); background:linear-gradient(160deg,var(--panel2),var(--panel));
  color:var(--text); box-shadow:var(--shadow); transition:.16s;
}
.mode b{font-size:15px; letter-spacing:.06em}
.mode span{font-size:11.5px; color:var(--dim)}
.mode:hover{border-color:var(--gold); transform:translateY(-1px)}
.mode:active{transform:translateY(0)}
.mode[data-mode="net"] b::after{
  content:"房间码"; margin-left:8px; font-size:10px; letter-spacing:.04em;
  padding:1px 6px; border-radius:99px; background:rgba(227,179,65,.16); color:var(--gold);
  vertical-align:2px; font-weight:600;
}
.dif{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.dif .lb{font-size:11.5px; color:var(--dim); margin-right:2px}
.dif button{
  height:30px; padding:0 11px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--dim); font:12px/1 inherit;
}
.dif button[aria-pressed="true"]{color:var(--gold); border-color:var(--gold); background:rgba(227,179,65,.1)}
/* 段位卡：和决斗链接那张一个路数（段名 + 进度条 + 差多少分） */
.rk,.rkg{
  padding:10px 12px; border-radius:12px; border:1px solid var(--line);
  background:linear-gradient(150deg,color-mix(in oklab,var(--rc) 14%,var(--panel)),var(--panel));
}
.rk-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.rk-h b{font-size:14px; letter-spacing:.06em; color:var(--rc)}
.rk-h span{font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums}
.rk-h span b{color:var(--text); font-size:12.5px}
.rk-bar{height:5px; border-radius:99px; background:var(--panel3); margin:7px 0 5px; overflow:hidden}
.rk-bar i{display:block; height:100%; border-radius:99px; background:var(--rc); transition:width .4s}
.rk-n{font-size:11px; color:var(--dim2); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap}
.rk-n b{color:var(--text)}
.rk-n .up{color:var(--gold)}
.rk-eff{color:var(--dim)}
.rkg{margin-top:10px; text-align:left}
.rec{font-size:11.5px; color:var(--dim2); line-height:1.7}
.rec b{color:var(--dim); font-weight:600}
.foot{margin-top:auto; display:flex; gap:8px; flex-wrap:wrap}
.mini{
  height:32px; padding:0 12px; border-radius:9px; cursor:pointer; font:12px/1 inherit;
  border:1px solid var(--line); background:var(--panel); color:var(--dim); text-decoration:none;
  display:inline-flex; align-items:center;
}
.mini:hover{color:var(--gold); border-color:var(--gold)}

/* ---------------------------------------------------------------- 选人 */
.hint{margin:2px 0 0; font-size:12.5px; color:var(--dim)}
.hint b{color:var(--gold)}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{
  position:relative; display:flex; gap:9px; padding:9px; border-radius:13px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel); color:var(--text); text-align:left;
  transition:.14s; overflow:hidden;
}
.pcard:hover{border-color:var(--line2); transform:translateY(-1px)}
.pcard[aria-pressed="true"]{border-color:var(--gold); background:linear-gradient(150deg,rgba(227,179,65,.16),var(--panel))}
.pcard img{width:44px; height:44px; flex:0 0 44px; border-radius:11px; object-fit:cover; background:var(--panel3)}
.pcard .pm{min-width:0; flex:1}
.pcard .pn{font-size:13.5px; font-weight:700; letter-spacing:.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pcard .pt{font-size:10px; color:var(--dim2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pcard .pp{font-size:10.5px; color:var(--dim); line-height:1.45; margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.pcard .php{font-size:10px; color:var(--red2); margin-top:2px}
.pcard .badge{position:absolute; right:8px; top:8px; font-size:9.5px; color:var(--gold)}
.pcard .pn .cb{
  margin-left:5px; font-size:9px; font-weight:600; letter-spacing:0;
  padding:1px 5px; border-radius:99px; vertical-align:1px;
  background:rgba(110,168,255,.16); color:var(--blue);
}
.ph-n{display:block; margin-top:3px; font-size:11px; color:var(--dim2)}
.pickbar input{
  height:36px; padding:0 11px; border-radius:10px; font:12.5px/1 inherit;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
}
.pickbar input::placeholder{color:var(--dim2)}
.tabs3{display:flex; gap:5px; flex-wrap:wrap}
.tabs3 button{
  height:28px; padding:0 10px; border-radius:99px; cursor:pointer; font:11.5px/1 inherit;
  border:1px solid var(--line); background:var(--panel); color:var(--dim);
}
.tabs3 button[aria-pressed="true"]{color:var(--gold); border-color:var(--gold); background:rgba(227,179,65,.12); font-weight:600}
.pickbar{
  display:flex; flex-direction:column; gap:7px;
  position:sticky; top:0; z-index:3; margin:-4px 0 0; padding:4px 0 6px;
  background:linear-gradient(var(--bg) 78%, transparent);
}
.pickfoot{
  display:flex; flex-direction:column; gap:6px; margin-top:auto;
  position:sticky; bottom:0; z-index:3; padding:6px 0 2px;
  background:linear-gradient(transparent, var(--bg) 26%);
}
.pickfoot .pf-row{display:flex; gap:8px}
.pickinfo{
  margin:0; font-size:11px; line-height:1.5; color:var(--dim); min-height:16px;
  max-height:3.2em; overflow:hidden;
}
.pickinfo b{color:var(--text)}
.pickinfo .pw{color:var(--gold)}
.btn{
  flex:1; height:44px; border-radius:12px; cursor:pointer; font:600 14px/1 inherit;
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
}
.btn.pri{
  border-color:transparent; background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#191308;
  box-shadow:0 10px 24px -12px rgba(227,179,65,.8);
}
.btn.ghost{flex:0 0 96px; color:var(--dim)}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}

/* ---------------------------------------------------------------- 房间 */
.room{
  margin:6px 0 auto; padding:16px; border-radius:16px; text-align:center;
  border:1px solid var(--line); background:linear-gradient(170deg,var(--panel2),var(--panel));
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; align-items:center;
}
.room .k{font-size:11.5px; color:var(--dim)}
.room .rcode{
  font:700 30px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.28em;
  color:var(--gold); text-shadow:0 0 26px rgba(227,179,65,.35); padding-left:.28em;
}
.room .rstate{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--dim)}
.room .rstate i{width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 1.6s infinite}
.room .rstate i.ok{background:var(--green); animation:none}
.room .rstate i.bad{background:var(--red); animation:none}
.room input{
  width:100%; height:44px; text-align:center; border-radius:11px; letter-spacing:.3em;
  border:1px solid var(--line2); background:var(--bg2); color:var(--text);
  font:700 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace; text-transform:uppercase;
}
.room .tip2{font-size:11px; color:var(--dim2); line-height:1.7; max-width:26em}
@keyframes pulse{50%{opacity:.35}}

/* ---------------------------------------------------------------- 战场 */
.battle{gap:7px; overflow:hidden}
.side{
  position:relative; flex:0 0 auto; display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  padding:8px 10px; border-radius:13px; border:1px solid var(--line);
  background:linear-gradient(165deg,var(--panel2),var(--panel)); transition:.18s;
}
.side.acting{border-color:rgba(227,179,65,.55); box-shadow:0 0 0 1px rgba(227,179,65,.18) inset, 0 10px 30px -22px var(--gold)}
.side.hit{animation:hit .42s}
.side.dead{opacity:.5; filter:grayscale(.5)}
@keyframes hit{
  0%{transform:translateX(0)}
  18%{transform:translateX(-6px)}
  40%{transform:translateX(5px)}
  65%{transform:translateX(-3px)}
  100%{transform:translateX(0)}
}
.side .av{width:46px; height:46px; flex:0 0 46px; border-radius:12px; object-fit:cover; background:var(--panel3)}
.side .hf{flex:1 1 150px; min-width:0}
.side .nm{display:flex; align-items:baseline; gap:6px; min-width:0}
.side .nm b{font-size:14px; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.side .nm span{font-size:9.5px; color:var(--dim2); white-space:nowrap}
.pips{display:flex; align-items:center; gap:3px; margin-top:4px}
.pips i{
  width:12px; height:8px; border-radius:2px; background:var(--panel3);
  box-shadow:0 0 0 1px var(--line) inset;
}
.pips i.on{background:linear-gradient(180deg,var(--red2),var(--red)); box-shadow:0 0 8px -2px var(--red)}
.pips .hpn{font-size:10px; color:var(--dim); margin-left:4px; font-variant-numeric:tabular-nums}
.bdgs{display:flex; gap:4px; margin-top:3px; flex-wrap:wrap}
.bdgs i{
  font-size:9.5px; font-style:normal; padding:1px 5px; border-radius:99px; line-height:1.5;
  border:1px solid var(--line2); color:var(--dim); background:var(--bg2);
}
.bdgs i.sh{color:var(--blue); border-color:rgba(110,168,255,.45)}
.bdgs i.cf{color:var(--violet); border-color:rgba(163,124,255,.45)}
.bdgs i.sw{color:var(--red2); border-color:rgba(224,89,107,.45)}
.bdgs i.bl{color:var(--red2); border-color:rgba(224,89,107,.3)}
.bdgs i.mu{color:var(--violet); border-color:rgba(163,124,255,.45)}

.chips{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
.chip{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:1px;
  width:52px; padding:5px 2px 4px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line2); background:var(--panel3); color:var(--text);
  font:inherit; transition:.13s;
}
.chip i{font-style:normal; font-size:15px; line-height:1.1}
.chip span{font-size:9px; color:var(--dim); white-space:nowrap; transform:scale(.94)}
.chip:hover{border-color:var(--gold); transform:translateY(-1px)}
.chip:disabled{opacity:.4; cursor:not-allowed; transform:none}
.chip.c-info i{color:var(--blue)} .chip.c-heal i{color:var(--green)}
.chip.c-atk i{color:var(--red2)} .chip.c-ctrl i{color:var(--violet)}
.chip.c-util i{color:var(--gold)}
.chip.mini{width:26px; height:26px; padding:0; justify-content:center; border-radius:8px; cursor:default}
.chip.mini:hover{transform:none; border-color:var(--line2)}
.chip.empty{
  width:26px; height:26px; border-style:dashed; border-color:var(--line); background:transparent;
  cursor:default; opacity:.5;
}

.mid{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:6px; padding:2px 0}
.counts{display:flex; align-items:center; gap:10px; justify-content:center; font-size:12px; color:var(--dim)}
.counts b{font-size:16px; font-variant-numeric:tabular-nums; margin-left:2px}
.counts .c-live b{color:var(--live)}
.counts .c-blank b{color:var(--blank)}
.counts .c-live i,.counts .c-blank i{display:inline-block; width:7px; height:7px; border-radius:50%; vertical-align:1px; margin-right:5px}
.counts .c-live i{background:var(--live); box-shadow:0 0 8px var(--live)}
.counts .c-blank i{background:var(--blank)}
.turnbadge{
  margin-left:auto; font-size:10.5px; padding:2px 8px; border-radius:99px;
  border:1px solid var(--line2); color:var(--dim);
}
.turnbadge.me{color:var(--gold); border-color:var(--gold); background:rgba(227,179,65,.1)}
.turnbadge.foe{color:var(--dim2)}
.gunbox{display:flex; flex-direction:column; align-items:center; gap:4px}
.gun{width:min(340px,88vw); color:var(--text); transform-origin:70% 50%; will-change:transform}
.gun svg{display:block; width:100%; height:auto}
.gun.fire{animation:recoil .34s cubic-bezier(.2,.8,.3,1)}
.flash{opacity:0}
.gun.fire .flash{animation:mflash .3s ease-out}
@keyframes mflash{
  0%{opacity:1} 45%{opacity:.45} 100%{opacity:0}
}
@keyframes recoil{
  0%{transform:none}
  16%{transform:translateX(10px) rotate(-1.2deg)}
  40%{transform:translateX(-3px)}
  100%{transform:none}
}
.muzzle{
  position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none;
  opacity:0; transition:opacity .1s;
}
.rack{position:relative; display:flex; gap:5px; align-items:center; justify-content:center; flex-wrap:wrap; min-height:14px}
.rack i{
  width:9px; height:14px; border-radius:3px 3px 2px 2px; background:var(--panel3);
  box-shadow:0 0 0 1px var(--line) inset; transition:.2s;
}
.rack i.seen{box-shadow:0 0 0 1px var(--line2) inset}
.rack i.live{background:linear-gradient(180deg,var(--red2),var(--red)); box-shadow:0 0 9px -1px var(--red)}
.rack i.blank{background:linear-gradient(180deg,#b9c2d6,#8b95ab); box-shadow:0 0 8px -2px #9aa4bb}
.rack i.gone{opacity:0; transform:translateY(-6px) scale(.6)}
.say{
  margin:0; min-height:2.6em; text-align:center; font-size:12px; line-height:1.42; color:var(--dim);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.say.bad{color:var(--red2)} .say.good{color:var(--green)} .say.warn{color:var(--gold)}
.say.hd{color:var(--gold2)}

.dock{flex:0 0 auto; display:flex; flex-direction:column; gap:7px}
.acts{display:flex; gap:8px}
.act{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:1px; padding:9px 6px;
  border-radius:13px; cursor:pointer; font:inherit; color:var(--text);
  border:1px solid var(--line2); background:linear-gradient(170deg,var(--panel3),var(--panel2));
  transition:.14s;
}
.act b{font-size:14.5px; letter-spacing:.06em}
.act span{font-size:9.5px; color:var(--dim2)}
.act.foe{border-color:rgba(224,89,107,.5); background:linear-gradient(170deg,rgba(224,89,107,.18),var(--panel2))}
.act.foe b{color:var(--red2)}
.act:hover:not(:disabled){transform:translateY(-1px); border-color:var(--gold)}
.act:disabled{opacity:.35; cursor:not-allowed}

/* 飘字 */
.float{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font:800 22px/1 inherit; pointer-events:none; z-index:5; animation:floatUp 1s ease-out forwards;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}
.float.dmg{color:var(--red2)} .float.heal{color:var(--green)} .float.info{color:var(--gold2)}
@keyframes floatUp{
  0%{opacity:0; transform:translate(-50%,-30%) scale(.8)}
  22%{opacity:1; transform:translate(-50%,-60%) scale(1.08)}
  100%{opacity:0; transform:translate(-50%,-140%) scale(1)}
}

<script>
/* 首屏守护 + 启动数据预取（构建时注入，各页共用一份）
   1) 占位是纯 HTML，HTML 一到就能画，不等任何 JS；
   2) 模块或数据卡住时给出可点的界面，绝不留只有页脚的白屏；
   3) 启动数据拆两路并行：data/boot.json（索引/标签/关键词，约 110KB）与
      data/dict.json（图鉴字典，约 520KB，只有要用字典的页面才下）。
      拿到 boot.json 就能开拉题库分片，字典在后台并行走——原来挤成一个 918KB 的文件，
      分片必须等它下完才能开始，手机上白白多一个「1~2 秒」的轮次。 */
(function () {
  // ---------------------------------------------------------------- 兼容垫片
  // 手机上的内置浏览器（微信 / QQ / 各家浏览器）内核普遍比 Chrome 慢两三年，
  // 少一个 API 就是整页报错、什么都不显示。这里补两个最常用的。
  if (window.Element && !Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function () {
      while (this.firstChild) this.removeChild(this.firstChild);
      for (var i = 0; i < arguments.length; i++) {
        var n = arguments[i];
        if (n == null) continue;
        this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n);
      }
    };
  }
  if (!String.prototype.replaceAll) {
    String.prototype.replaceAll = function (find, rep) { return this.split(find).join(rep); };
  }
  // <dialog> 在 iOS 15.4 之前根本没有：没有 showModal 时退回「加 open 属性」，
  // 版式由 css/style.css 的 dialog.picker[open] 兜住，至少还能选、不会整页崩掉。
  (function () {
    var proto = window.HTMLDialogElement && HTMLDialogElement.prototype;
    if (!proto || proto.showModal) return;
    proto.showModal = function () { this.setAttribute('open', ''); };
    proto.close = function () { this.removeAttribute('open'); };
  })();

  var bootEl = document.getElementById('boot');
  var textEl = document.getElementById('bootText');
  var hintEl = document.getElementById('bootHint');
  var t0 = Date.now();
  var settled = false;

  function setHint(s) { if (hintEl) hintEl.textContent = s; }

  function retryBtn(label) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.onclick = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    return btn;
  }

  // 慢一点就说句话，别让人以为死了
  var hintTimer = setTimeout(function () {
    if (!document.getElementById('boot')) return;
    setHint('网络较慢，正在继续载入（站点在新加坡节点，首次访问会慢一些）…');
  }, 7000);

  // 看门狗：20 秒还没渲染出内容，给一个明确的按钮。
  // 这时候如果主脚本压根没跑起来（语法太旧 / 被插件或代理拦了），提示要说清楚，
  // 否则用户只会反复点「重新载入」。
  var dog = setInterval(function () {
    if (!document.getElementById('boot')) { clearInterval(dog); clearTimeout(hintTimer); settled = true; return; }
    if (Date.now() - t0 < 20000) return;
    clearInterval(dog);
    if (settled) return;
    settled = true;
    bootEl.className = 'err';
    if (!window.__bootMain) {
      textEl.textContent = '脚本没能启动';
      setHint('浏览器可能太旧了：请用 Chrome / Edge 90 以上、或 iOS 15 以上的 Safari 打开；'
        + '360、QQ 浏览器请在地址栏切到「极速」模式。');
    } else {
      textEl.textContent = '载入超时';
      setHint('可能是到服务器的连接卡住了，点下面的按钮重试（会重新拉一次）。');
    }
    bootEl.appendChild(retryBtn('重新载入'));
  }, 1000);

  // 内核探测：以前靠「顶层 await 能不能解析」判断内核新旧。现在打包产物里已经没有
  // 顶层 await（Chrome 61+ / Safari 11+ 都能跑），这条路不需要了——真的跑不起来时，
  // 脚本的 onerror 和下面的看门狗会接手。

  function fail(msg) {
    if (settled || !document.getElementById('boot')) return;
    settled = true;
    clearInterval(dog);
    bootEl.className = 'err';
    textEl.textContent = '载入失败';
    setHint(msg || '');
    bootEl.appendChild(retryBtn('重试'));
  }
  window.__bootFailed = fail;

  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      fail('脚本加载失败：' + (t.src || t.href || ''));
    } else if (e && e.message && /import|module|MIME|Failed to fetch/i.test(e.message)) {
      fail(e.message);
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    fail(r && (r.message || String(r)));
  });

  // 带超时与一次重试的 JSON 拉取：实测边缘偶尔会挂起连接不返回
  function get(url, retried) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 10000);
    return fetch(url, { signal: ctl.signal }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.json();
    }).catch(function (err) {
      clearTimeout(timer);
      if (retried) throw err;
      return get(url + (url.indexOf('?') < 0 ? '?' : '&') + 'rt=' + Date.now(), true);
    });
  }

  //  /  由构建替换：要用启动数据的页面是真地址，其余是空串（一个字节都不下）
  var dataUrl = '';
  var data = dataUrl ? get(dataUrl) : null;
  if (data) data.catch(function () {});
  var dictUrl = '';
  var dict = dictUrl ? get(dictUrl) : null;
  if (dict) dict.catch(function () {});
  window.__boot = { data: data, dict: dict };
})();
</script>

<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    /* 申请「持久存储」：图片缓存跟本地存档一样不被浏览器随手清掉 */
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  });
  /* sw.js 发现本机离线包是旧版（版本戳对不上）会喊一声。既然网站已经有新内容了，
     就给一条能点走的提示，别让人一直以为「离线版就是几个月前的样子」。
     局内（body.live）不弹：那会儿满屏都是判定框，任何浮层都是碍事。 */
  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type !== 'offline-stale') return;
    if (/offline.html$/i.test(location.pathname)) return;
    if (document.body.classList.contains('live')) return;
    try { if (sessionStorage.getItem('zjtt-stale') === d.build) return; } catch (err) {}
    var a = document.createElement('a');
    a.href = 'offline.html';
    a.textContent = '本机离线包是旧版（' + String(d.stamp || '').slice(0, 8) + '）· 点这里更新';
    a.setAttribute('style', 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;'
      + 'padding:7px 14px;border-radius:999px;font:600 12.5px/1.4 system-ui,sans-serif;text-decoration:none;'
      + 'color:#08111f;background:linear-gradient(180deg,#ffe9a8,#e3b341);box-shadow:0 6px 18px rgba(0,0,0,.38);'
      + 'max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis');
    a.addEventListener('click', function () {
      try { sessionStorage.setItem('zjtt-stale', d.build); } catch (err) {}
    });
    document.body.appendChild(a);
    /* 进局内就把提示收掉：横屏顶部正中间是发球点，浮层压在那里最碍事 */
    var obs = new MutationObserver(function () {
      if (document.body.classList.contains('live')) { a.remove(); obs.disconnect(); }
    });
    try { obs.observe(document.body, { attributes: true, attributeFilter: ['class'] }); } catch (err) {}
    setTimeout(function () { a.remove(); obs.disconnect(); }, 15000);
  });
}
</script>
