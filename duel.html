<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>唤醒王：决斗链接 · 忘忘同人小游戏</title>
<meta name="description" content="《忘却前夜》同人卡牌对战：把唤醒体写进命轮，用祭品、觉醒召唤、魔法与陷阱和对手赌一段记忆。九套预组卡组、十二种羁绊、五个卡包、一百一十四张卡；人机、同屏双人、房间码好友对战，附世界观设定。">
<meta name="theme-color" content="#0a0c12">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230a0c12%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2219%22%20fill%3D%22none%22%20stroke%3D%22%23e3b341%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M32%2018l9%2014-9%2014-9-14z%22%20fill%3D%22%23e8656f%22%20opacity%3D%22.9%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
<style>
/* 这一页不引 css/style.css：整站那份是给内容页的，卡牌桌只要自己这一份。 */
:root{
  --bg:#0a0c12; --bg2:#0d1119; --panel:#141926; --panel2:#1a2130; --panel3:#202836;
  --line:#28313f; --line2:#354053;
  --text:#e8ecf5; --dim:#8b95a8; --dim2:#5f6a7e;
  --gold:#e3b341; --gold2:#f0cd78; --red:#e8656f; --blue:#6ea8ff; --green:#4fc98a; --violet:#a07cff;
  --chaos:#e8656f; --caro:#d98b6a; --aqua:#5b9bd5; --ultra:#e3b341; --any:#7c869c;
  --shadow:0 18px 40px -24px #000;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef1f7; --bg2:#e7ebf4; --panel:#fff; --panel2:#f4f6fb; --panel3:#e9edf6;
    --line:#d7dce8; --line2:#c3cadb;
    --text:#1b2130; --dim:#667088; --dim2:#8c96ab;
    --gold:#9a6f00; --gold2:#7a5600; --red:#c8413a; --blue:#2c6fdb; --green:#1f8a55; --violet:#6b45c8;
    --chaos:#c8413a; --caro:#a8623c; --aqua:#2c6fdb; --ultra:#8a6400; --any:#6b7488;
    --shadow:0 18px 40px -30px rgba(20,30,60,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(820px 520px at 14% -10%, rgba(227,179,65,.10), transparent 66%),
    radial-gradient(720px 460px at 88% 2%, rgba(232,101,111,.09), transparent 68%),
    radial-gradient(900px 620px at 50% 116%, rgba(91,155,213,.08), transparent 70%);
  background-repeat:no-repeat;
}
.app{
  height:100dvh; max-width:1040px; margin:0 auto;
  padding:max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}
/* ---------------------------------------------------------------- 顶栏 */
.top{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.back{
  width:32px; height:32px; flex:0 0 32px; border-radius:9px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  text-decoration:none; font-size:15px; line-height:1;
}
.back:hover{border-color:var(--gold); color:var(--gold)}
.ttl{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.ttl b{font-size:15px; letter-spacing:.06em; white-space:nowrap}
.ttl span{font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.coin{
  margin-left:auto; height:30px; padding:0 10px; flex:0 0 auto; border-radius:9px;
  border:1px solid var(--line); background:var(--panel); color:var(--gold);
  font:inherit; font-size:11.5px; font-weight:600; letter-spacing:.04em;
  display:flex; align-items:center; gap:5px; cursor:default;
}
.coin b{font-size:13px; color:var(--gold2)}

/* ---------------------------------------------------------------- 舞台 */
#stage{position:relative; flex:1 1 auto; min-height:0}
.scr{position:absolute; inset:0; display:none; overflow-y:auto; overscroll-behavior:contain}
.scr.on{display:flex; flex-direction:column}
.scr.pad{padding:2px 2px 14px}

/* ---------------------------------------------------------------- 首页 */
.hero{text-align:center; padding:26px 0 4px}
.kicker{margin:0 0 8px; font-size:10.5px; letter-spacing:.34em; color:var(--dim2)}
.hero h1{
  margin:0; font-size:clamp(30px,7vw,46px); letter-spacing:.16em; font-weight:800;
  background:linear-gradient(104deg,var(--text) 6%,var(--gold) 48%,var(--red) 92%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero h1.longname{font-size:clamp(23px,6vw,40px); letter-spacing:.06em; white-space:nowrap}
.hero .lead{margin:12px auto 0; max-width:33em; font-size:13px; line-height:1.9; color:var(--dim)}
.hero .lead b{color:var(--text); font-weight:600}
.hr{width:52px; height:2px; margin:16px auto 0; border-radius:2px; background:linear-gradient(90deg,var(--gold),var(--red)); opacity:.8}

.sec-h{display:flex; align-items:baseline; gap:8px; margin:20px 2px 8px}
.sec-h h2{margin:0; font-size:13px; letter-spacing:.14em; color:var(--dim)}
.sec-h .r{margin-left:auto; font-size:11.5px; color:var(--dim2)}

.decks{display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
.deck{
  position:relative; text-align:left; cursor:pointer; padding:12px 13px;
  border-radius:13px; background:var(--panel); border:1px solid var(--line);
  color:var(--text); font:inherit; transition:border-color .15s, transform .15s, background .15s;
  display:flex; flex-direction:column; gap:6px; overflow:hidden;
}
.deck::before{
  content:""; position:absolute; inset:0 0 auto; height:2px;
  background:linear-gradient(90deg, var(--rc), transparent 72%);
}
.deck:hover{transform:translateY(-2px); border-color:var(--rc)}
.deck.on{border-color:var(--rc); background:var(--panel2); box-shadow:0 14px 30px -22px #000}
.deck .dh{display:flex; align-items:center; gap:6px}
.deck .dh b{font-size:14.5px; letter-spacing:.03em}
.deck .rm{margin-left:auto; font-size:10px; letter-spacing:.12em; color:var(--rc); border:1px solid color-mix(in srgb,var(--rc) 42%, var(--line)); border-radius:6px; padding:1px 5px}
.deck .ds{font-size:11.5px; color:var(--dim); line-height:1.7; min-height:2.6em}
.deck .db{display:flex; flex-wrap:wrap; gap:4px}
.bond{
  font-size:10.5px; color:var(--gold2); background:color-mix(in srgb,var(--gold) 12%, transparent);
  border:1px solid color-mix(in srgb,var(--gold) 34%, var(--line)); border-radius:99px; padding:1px 7px;
  white-space:nowrap;
}
.deck .dm{font-size:10.5px; color:var(--dim2)}

.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{
  height:38px; padding:0 16px; border-radius:10px; border:1px solid var(--line2);
  background:var(--panel2); color:var(--text); font:inherit; font-size:13px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:hover{border-color:var(--dim); background:var(--panel3)}
.btn.pri{
  background:linear-gradient(180deg, color-mix(in srgb,var(--gold) 92%, #fff), var(--gold));
  color:#1a1206; border-color:color-mix(in srgb,var(--gold) 70%, #000); font-weight:700; letter-spacing:.04em;
}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{height:30px; padding:0 10px; font-size:12px; border-radius:8px}
.btn:disabled{opacity:.42; cursor:not-allowed}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel)}
.seg button{
  height:34px; padding:0 12px; border:0; background:transparent; color:var(--dim);
  font:inherit; font-size:12px; cursor:pointer;
}
.seg button.on{background:var(--panel3); color:var(--text); font-weight:600}
.nav-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:10px}
.tile{
  display:flex; align-items:center; gap:9px; padding:11px 12px; border-radius:12px;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  font:inherit; cursor:pointer; text-align:left;
}
.tile:hover{border-color:var(--gold)}
.tile .ti{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:var(--panel3); font-size:14px}
.tile .tn{font-size:13px; font-weight:600}
.tile .td{font-size:10.5px; color:var(--dim)}

/* ---------------------------------------------------------------- 对战盘 */
#scr-duel{overflow-y:auto; overflow-x:hidden; gap:6px}
.duelbar{display:flex; align-items:center; gap:6px; flex:0 0 auto; font-size:11.5px; color:var(--dim)}
.duelbar{flex-wrap:wrap; row-gap:4px}
.duelbar .turn,.duelbar .ph{white-space:nowrap}
.duelbar .turn{color:var(--text); font-weight:600; letter-spacing:.04em}
.duelbar .ph{color:var(--gold2)}
.duelbar .sp{margin-left:auto; display:flex; gap:6px}

.side{flex:0 0 auto; display:flex; flex-direction:column; gap:5px}
.pinfo{display:flex; align-items:center; gap:8px; padding:4px 9px; border-radius:10px; background:var(--panel); border:1px solid var(--line)}
.pinfo .who{font-size:12px; font-weight:700; letter-spacing:.04em; min-width:3.4em}
.pinfo .lp{
  flex:1 1 auto; height:16px; border-radius:8px; background:var(--panel3); overflow:hidden; position:relative;
  border:1px solid var(--line);
}
.pinfo .lp i{
  position:absolute; inset:0 auto 0 0; width:100%; border-radius:7px;
  background:linear-gradient(90deg, color-mix(in srgb,var(--green) 80%, #fff), var(--green));
  transition:width .35s ease;
}
.pinfo .lp.low i{background:linear-gradient(90deg, var(--red), color-mix(in srgb,var(--red) 70%, #000))}
.pinfo .lpn{position:absolute; inset:0; display:grid; place-items:center; font-size:10.5px; font-weight:700; color:#08130c; letter-spacing:.04em}
.pinfo .meta{font-size:10.5px; color:var(--dim); white-space:nowrap; display:flex; gap:7px}
.pinfo .bonds{display:flex; gap:3px}
.pinfo .bonds span{width:7px; height:7px; border-radius:50%; background:var(--gold); opacity:.85}

.field{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:0; width:100%; max-width:540px; margin:0 auto}
.field.sp{grid-template-columns:repeat(3,1fr)}
.slot{
  position:relative; border-radius:10px; border:1px dashed var(--line2);
  background:color-mix(in srgb, var(--panel) 60%, transparent);
  min-height:108px; display:grid; place-items:center; color:var(--dim2); font-size:10.5px;
}
.slot.empty::after{content:attr(data-l); opacity:.55; letter-spacing:.1em}
.slot.hot{border-color:var(--gold); box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%, transparent) inset; cursor:pointer}
.slot.hot.attack{border-color:var(--red); background:color-mix(in srgb,var(--red) 10%, transparent)}
.slot.sp{min-height:44px}
.slot .card{--cw:84px; --ch:104px}      /* 场上的怪兽：原来 60×80，名字只剩两个字就被截断，数值也被位置标签压住 */
.slot.sp .card{--cw:46px; --ch:62px}
.slot.sp .card .ct{height:19px; padding:1px 3px}
.slot.sp .card .nm{font-size:8px}
.slot.sp .card .pt{font-size:7.5px}
.slot.sp.empty::after{content:"魔陷"}

.mid{flex:1 1 auto; min-height:72px; max-height:150px; display:flex; flex-direction:column; gap:6px; align-items:stretch; width:100%; margin:0 auto}
.log{
  flex:1 1 auto; min-height:0; overflow-y:auto; padding:6px 9px; border-radius:10px;
  background:color-mix(in srgb,var(--panel) 70%, transparent); border:1px solid var(--line);
  font-size:11.5px; line-height:1.65; color:var(--dim); list-style:none; margin:0;
}
.log li{padding:0}
.log li[data-k="damage"],.log li[data-k="battle"]{color:#f0999f}
.log li[data-k="heal"]{color:#7fd6a6}
.log li[data-k="summon"],.log li[data-k="awaken"]{color:var(--gold2)}
.log li[data-k="spell"]{color:#9dc0ff}
.log li[data-k="trap"]{color:#c9a2ff}
.log li[data-k="bond"]{color:#f0cd78; font-weight:600}
.log li[data-k="turn"]{color:var(--text); font-weight:600; opacity:.85; margin-top:2px}
.log li[data-k="over"]{color:var(--gold2); font-weight:700}

.acts{display:flex; gap:6px; flex-wrap:wrap; flex:0 0 auto}
.acts .btn{flex:1 1 auto; justify-content:center}

.hand{
  flex:0 0 auto; display:flex; gap:5px; overflow-x:auto; overflow-y:hidden; padding:6px 2px 4px;
  scrollbar-width:thin; min-height:104px;
}
.hand .card{flex:0 0 auto; --cw:72px; --ch:96px}
.hand.empty-h{color:var(--dim2); font-size:11.5px; align-items:center; justify-content:center}
.hand::-webkit-scrollbar{height:4px}
.hand::-webkit-scrollbar-thumb{background:var(--line2); border-radius:2px}

/* ---------------------------------------------------------------- 卡面 */
.card{
  --cw:76px; --ch:104px;
  position:relative; width:var(--cw); height:var(--ch); border-radius:8px; overflow:hidden;
  border:1.5px solid var(--rc,var(--line2)); background:var(--panel2); cursor:pointer;
  display:flex; flex-direction:column; box-shadow:0 4px 10px -6px #000;
  transition:transform .12s, border-color .12s, box-shadow .12s;
  user-select:none;
}
.card:hover{transform:translateY(-3px); box-shadow:0 10px 18px -10px #000}
.card .face{
  flex:1 1 auto; min-height:0; background-image:var(--sheet,none);
  background-size:var(--sheet-size,800% 700%);
  background-repeat:no-repeat; background-color:#0f1420;
  border-bottom:1px solid color-mix(in srgb, var(--rc) 40%, transparent);
}
/* 名字行 + 数值行 加起来比原来写死的 28px 高（body 行高 1.55 会把数值行撑到 14px），名字就被 overflow 切掉了：
   高度改成跟着内容走（最少 30px），行高写死，卡面图在 flex 里让出空间 */
.card .ct{padding:2px 4px 3px; display:flex; flex-direction:column; gap:1px; flex:0 0 auto; min-height:30px; height:auto; overflow:hidden}
.card .nm{
  font-size:10px; line-height:1.25; font-weight:700; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; letter-spacing:.02em;
}
.card .pt{line-height:1.2; font-size:9.5px; color:var(--dim); display:flex; gap:4px; font-variant-numeric:tabular-nums}
.card .pt b{color:var(--text); font-weight:700}
.card .rb{
  position:absolute; top:3px; left:3px; font-size:8px; font-weight:800; letter-spacing:.04em;
  padding:0 3px; border-radius:3px; background:rgba(6,9,14,.72); color:var(--gold2);
  border:1px solid color-mix(in srgb,var(--gold) 40%, transparent);
}
.card .lv{
  position:absolute; top:3px; right:3px; font-size:8px; letter-spacing:-.1em;
  color:var(--gold2); text-shadow:0 1px 2px #000; background:rgba(6,9,14,.6);
  border-radius:3px; padding:0 2px;
}
.card .rm{position:absolute; top:0; left:0; right:0; height:2px; background:var(--rc)}
.card[data-rar="R"] .rb{color:#9dc0ff; border-color:rgba(91,155,213,.5)}
.card[data-rar="SR"] .rb{color:#c9a2ff; border-color:rgba(160,124,255,.55)}
.card[data-rar="UR"] .rb{color:#f0cd78; border-color:rgba(227,179,65,.6)}
.card[data-rar="GR"] .rb{color:#ff9ba2; border-color:rgba(232,101,111,.65)}
.card[data-rar="N"] .rb{color:#aab4c6; border-color:rgba(95,106,126,.5)}
.card[data-r="chaos"]{--rc:#e8656f}
.card[data-r="caro"]{--rc:#d98b6a}
.card[data-r="aqua"]{--rc:#5b9bd5}
.card[data-r="ultra"]{--rc:#e3b341}
.card.on{outline:2px solid var(--gold); outline-offset:1px; transform:translateY(-3px)}
.card.dim{opacity:.45}
.card.def{transform:rotate(0)}
.card.def .face{flex:0 0 52%}
.card.set .face{background-image:var(--backimg,none)!important; background-size:cover!important; background-position:center!important}
.card.set .nm{color:var(--dim)}
.card.used{opacity:.6}
.card .tagp{
  position:absolute; bottom:2px; right:3px; font-size:8.5px; padding:0 3px; border-radius:3px;
  background:rgba(6,9,14,.7); color:#cdd6e6;
}
/* 场上怪兽的「攻击 / 守备」标签挪到卡面上沿，别压住下面的攻防数值 */
.slot .card .tagp{bottom:auto; top:20px; right:3px}
.card.mini{--cw:64px; --ch:88px}
.card.mini .nm{font-size:9px}
.card.big{--cw:132px; --ch:186px}
.card.big .nm{font-size:12.5px}
.card.big .pt{font-size:11.5px}

/* ---------------------------------------------------------------- 操作条 / 弹层 */
.actbar{
  position:absolute; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--panel) 96%, transparent); backdrop-filter:blur(10px);
  border-top:1px solid var(--line2); border-radius:14px 14px 0 0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -18px 40px -24px #000;
  display:none; flex-direction:column; gap:8px;
}
.actbar.on{display:flex}
.actbar .ah{display:flex; align-items:center; gap:8px; font-size:12.5px}
.actbar .ah b{font-size:13px}
.actbar .ah .x{margin-left:auto}
.actbar .ab{display:flex; gap:6px; flex-wrap:wrap}
.actbar .ab .btn{flex:1 1 auto; justify-content:center}
.actbar .hint{font-size:11px; color:var(--dim); line-height:1.6}

.mask{
  position:fixed; inset:0; z-index:60; background:rgba(4,6,10,.72); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; padding:18px;
}
.mask.on{display:flex}
.modal{
  width:min(560px,100%); max-height:82vh; overflow:auto; border-radius:16px;
  background:var(--panel); border:1px solid var(--line2); padding:16px; box-shadow:var(--shadow);
}
.modal h3{margin:0 0 4px; font-size:15px; letter-spacing:.04em}
.modal .sub{margin:0 0 12px; font-size:11.5px; color:var(--dim)}
.modal .mb{display:flex; gap:6px; justify-content:flex-end; margin-top:14px}
.modal .close{position:relative}
.mtitle{display:flex; align-items:center; gap:8px}
.mtitle .x{margin-left:auto}

/* ---------------------------------------------------------------- 卡包 */
.packs{display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.pack{
  position:relative; padding:13px; border-radius:13px; border:1px solid var(--line);
  background:linear-gradient(160deg, var(--panel2), var(--panel)); overflow:hidden;
  display:flex; flex-direction:column; gap:7px;
}
.pack::after{
  content:""; position:absolute; right:-30px; top:-30px; width:110px; height:110px; border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--gold) 22%, transparent), transparent 70%);
  pointer-events:none;
}
.pack .pn{font-size:14px; font-weight:700; letter-spacing:.04em}
.pack .pe{font-size:9.5px; letter-spacing:.18em; color:var(--dim2)}
.pack .ps{font-size:11.5px; color:var(--gold2)}
.pack .pd{font-size:11.5px; color:var(--dim); line-height:1.75; min-height:3.4em}
.pack .pbar{height:5px; border-radius:3px; background:var(--panel3); overflow:hidden}
.pack .pbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--gold2))}
.pack .pf{display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--dim)}
.pack .pf .btn{margin-left:auto}
.pack .plist{font-size:10.5px; color:var(--dim2); line-height:1.6; max-height:0; overflow:hidden; transition:max-height .2s}
.pack.open .plist{max-height:240px; overflow:auto}

/* 拆包：每张牌放大，名字允许写两行，一眼就能看清抽到了什么 */

.dwrap{display:flex; flex-direction:column; gap:4px}
.dwrap .deck{flex:1}
.dwrap .dview{align-self:stretch}
.readface{display:flex; justify-content:center; margin:6px 0 8px}
.readface .card{--cw:132px; --ch:190px}
.gh{margin:14px 0 6px; font-size:12px; letter-spacing:.12em; color:var(--gold2); border-bottom:1px solid var(--line); padding-bottom:3px}
.lcs{display:grid; gap:6px}
.lc{border:1px solid var(--line); border-left:3px solid var(--rc,var(--line)); border-radius:8px; padding:6px 9px; background:var(--panel); cursor:pointer}
.lc:hover{background:var(--panel2)}
.lc .lh{display:flex; align-items:center; gap:6px; font-size:13.5px}
.lc .lh i{font-style:normal; color:var(--gold2); font-size:12px}
.lc .lr{margin-left:auto; font-size:10px; color:var(--dim2); border:1px solid var(--line); border-radius:5px; padding:0 5px}
.lc .lo{font-size:10px; color:var(--dim2)}
.lc .ls{font-size:10.5px; color:var(--dim2); margin:1px 0 3px}
.lc .lt{font-size:12px; color:var(--dim); line-height:1.65}
.lm{font-size:10.5px; color:var(--dim2); margin:-3px 0 2px 10px}
.pull .pc{cursor:pointer; position:relative}
.pull .tagp{background:var(--gold2,#c9a24a); color:#111; font-weight:700; font-size:10px; padding:1px 5px; border-radius:4px}
.pull{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:10px; margin:8px 0}
.pull .card{--cw:100%; --ch:178px; width:100%}
.pull .card .ct{min-height:46px; padding:3px 5px 4px}
.pull .card .nm{font-size:13px; line-height:1.2; white-space:normal; overflow:visible; text-overflow:clip; word-break:break-all}
.pull .card .pt{font-size:11.5px}
.pull .card .lv,.pull .card .rb{font-size:9.5px}
.pull .rar{
  text-align:center; font-size:10px; letter-spacing:.1em; margin-top:2px; color:var(--dim);
}

/* ---------------------------------------------------------------- 卡表 */
.filters{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px}
.chip{
  height:28px; padding:0 10px; border-radius:99px; border:1px solid var(--line);
  background:var(--panel); color:var(--dim); font:inherit; font-size:11.5px; cursor:pointer;
}
.chip.on{color:var(--text); border-color:var(--gold); background:var(--panel2)}
.chip[data-r="chaos"].on{border-color:var(--chaos); color:var(--chaos)}
.chip[data-r="caro"].on{border-color:var(--caro); color:var(--caro)}
.chip[data-r="aqua"].on{border-color:var(--aqua); color:var(--aqua)}
.chip[data-r="ultra"].on{border-color:var(--ultra); color:var(--ultra)}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:7px}
.grid-cards .card{width:100%; height:auto; aspect-ratio:76/104}
.grid-cards .card .face{flex:1 1 auto}

/* ---------------------------------------------------------------- 世界观 */
.lore{max-width:44em; margin:0 auto; padding:6px 2px 20px}
.lore h1{font-size:clamp(22px,4.6vw,30px); letter-spacing:.1em; margin:8px 0 6px}
.lore .intro{font-size:13.5px; color:var(--dim); line-height:1.95; border-left:2px solid var(--gold); padding-left:12px; margin:12px 0 20px}
.chap{margin:0 0 18px; padding:0 0 16px; border-bottom:1px solid var(--line)}
.chap h2{font-size:14.5px; letter-spacing:.06em; margin:0 0 2px}
.chap .en{font-size:9.5px; letter-spacing:.2em; color:var(--dim2); margin-bottom:8px}
.chap .q{margin:0 0 10px; font-size:12.5px; color:var(--gold2); font-style:italic; line-height:1.8}
.chap p{margin:0 0 9px; font-size:13px; line-height:1.95; color:color-mix(in srgb, var(--text) 84%, var(--dim))}
.realms{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); margin:10px 0 18px}
.realm{border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:var(--panel); border-top:2px solid var(--rc)}
.realm .rn{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--rc)}
.realm .rn span{margin-left:auto; font-size:9px; letter-spacing:.14em; color:var(--dim2)}
.realm .rm2{font-size:11px; color:var(--gold2); margin:2px 0 5px}
.realm .rd{font-size:11.5px; color:var(--dim); line-height:1.75}
.realm .rs{font-size:10.5px; color:var(--dim2); margin-top:5px}
.terms{display:grid; gap:6px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.term{border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--panel)}
.term b{font-size:12.5px; color:var(--gold2)}
.term p{margin:2px 0 0; font-size:11.5px; color:var(--dim); line-height:1.7}

.coin + .coin{margin-left:6px}

/* ---------------------------------------------------------------- 好友房 */
.duelbar .btag{
  font-size:10px; letter-spacing:.08em; color:var(--gold2); border:1px solid color-mix(in srgb,var(--gold) 40%, var(--line));
  border-radius:6px; padding:0 5px; white-space:nowrap;
}
.room{
  border:1px solid var(--line); border-radius:14px; background:var(--panel);
  padding:18px 14px; display:flex; flex-direction:column; gap:10px; align-items:stretch;
}
.room .rcode{
  font-size:clamp(30px,9vw,46px); font-weight:800; letter-spacing:.34em; text-align:center;
  padding-left:.34em; color:var(--gold2); text-shadow:0 0 26px color-mix(in srgb,var(--gold) 42%, transparent);
}
.room .rstate{display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; color:var(--dim)}
.room .rstate .dot{width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 1.6s infinite}
.room .rstate .dot.ok{background:var(--green); animation:none}
.room .rstate .dot.bad{background:var(--red); animation:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rin{
  width:100%; height:52px; margin:4px 0 2px; padding:0 14px; text-align:center;
  font:600 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.3em; text-transform:uppercase;
  color:var(--text); background:var(--panel2); border:1px solid var(--line2); border-radius:10px;
}
.rin:focus{outline:none; border-color:var(--gold)}
/* 魔法 / 陷阱：图集里是画出来的符号，顶条按类别换个颜色，一眼能和怪兽分开 */
.card[data-k="S"] .rm{background:linear-gradient(90deg,#8b9cf7,#c9bcff)}
.card[data-k="T"] .rm{background:linear-gradient(90deg,#e8656f,#ffb0aa)}
.card[data-k="S"] .face,.card[data-k="T"] .face{background-color:#0d0f18}

/* ---------------------------------------------------------------- 杂项 */
.loading{display:grid; place-items:center; height:60%; color:var(--dim); font-size:13px; letter-spacing:.1em}
.empty{color:var(--dim); font-size:12.5px; padding:16px 4px}
.note{font-size:11px; color:var(--dim2); line-height:1.7}
.tips{margin:6px 0 0; padding-left:16px; font-size:11.5px; color:var(--dim); line-height:1.8}
.tips li{margin:2px 0}
@media (max-width:520px){
  .hero{padding-top:16px}
  .hand{min-height:116px}
  .hand .card{--cw:78px; --ch:106px}
  .pinfo .meta{font-size:10px}
}

/* ---------------------------------------------------------------- 对战盘自适应
   所有卡牌尺寸都由 #scr-duel 上的几个变量推出来：
   --mch/--mcw 场上怪兽，--sch/--scw 魔陷区，--hch/--hcw 手牌。
   变量按「可用高度」和「棋盘列宽度」取小，所以手机竖屏、横屏、平板、电脑都不留大块空白，也不会撑出滚动条。
   --off 是除了卡牌以外的固定占高（顶栏 / 血条 / 日志 / 操作条…），各版式在下面各自给一个数。 */
#scr-duel{
  --bw:calc(100vw - 28px);
  --off:520px;
  --mmax:190px; --mmin:70px; --div:3.74;
  --mcw:min(calc(clamp(var(--mmin), calc((100dvh - var(--off)) / var(--div)), var(--mmax)) * .8), calc((var(--bw) - 34px) / 3));
  --mch:calc(var(--mcw) / .8);
  --sch:clamp(34px, calc(var(--mch) * .42), 84px);
  --scw:calc(var(--sch) * .74);
  --hch:clamp(88px, calc(var(--mch) * .9), 170px);
  --hcw:calc(var(--hch) * .75);
  --fw:max(300px, calc(var(--mcw) * 3 + 16px));
}
#scr-duel .side,#scr-duel .duelbar,#scr-duel .mid{width:100%; max-width:var(--fw); margin-left:auto; margin-right:auto}
#scr-duel .field{max-width:none}
#scr-duel .slot{min-height:calc(var(--mch) + 6px)}
#scr-duel .slot .card{--cw:var(--mcw); --ch:var(--mch)}
#scr-duel .slot .card .nm{font-size:clamp(9px, calc(var(--mcw) * .125), 15px)}
#scr-duel .slot .card .pt{font-size:clamp(9px, calc(var(--mcw) * .115), 14px)}
#scr-duel .slot .card .ct{min-height:calc(var(--mch) * .28)}
#scr-duel .slot .card .rb,#scr-duel .slot .card .lv,#scr-duel .slot .card .tagp{font-size:clamp(8px, calc(var(--mcw) * .085), 12px)}
#scr-duel .slot .card .tagp{top:calc(var(--mch) * .17)}
#scr-duel .slot.sp{min-height:calc(var(--sch) + 6px)}
#scr-duel .slot.sp .card{--cw:var(--scw); --ch:var(--sch)}
#scr-duel .slot.sp .card .ct{min-height:0; height:calc(var(--sch) * .3)}
#scr-duel .slot.sp .card .nm{font-size:clamp(7.5px, calc(var(--scw) * .17), 11px)}
#scr-duel .slot.sp .card .pt{font-size:clamp(7px, calc(var(--scw) * .15), 10px)}
#scr-duel .hand{justify-content:safe center; min-height:calc(var(--hch) + 12px)}
#scr-duel .hand .card{--cw:var(--hcw); --ch:var(--hch)}
#scr-duel .hand .card .nm{font-size:clamp(9px, calc(var(--hcw) * .14), 14px)}
#scr-duel .hand .card .pt{font-size:clamp(8.5px, calc(var(--hcw) * .12), 13px)}
#scr-duel .hand.empty-h{min-height:calc(var(--hch) * .5)}
#scr-duel .log{font-size:clamp(11px, 1.2vw, 13px)}

/* 电脑 / 平板横放：左边是棋盘，右边一整列日志与操作条，手牌贴在棋盘下面 */
@media (min-width:900px) and (min-height:561px){
  #scr-duel.on{
    --bw:calc(min(100vw, 1040px) - 24px - 340px);
    --off:240px; --mmax:250px;
    display:grid; gap:8px 14px; overflow:hidden;
    grid-template-columns:minmax(0,1fr) 326px;
    grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) auto;
    grid-template-areas:"bar bar" "op mid" "me mid" "hand mid";
  }
  #scr-duel>.duelbar{grid-area:bar; max-width:none}
  #scr-duel>.side.op-side{grid-area:op; justify-content:flex-end}
  #scr-duel>.side.me-side{grid-area:me; justify-content:flex-start}
  #scr-duel>.mid{grid-area:mid; max-width:none; max-height:none; margin:0}
  #scr-duel>.hand{grid-area:hand; flex-wrap:nowrap}
  #scr-duel .log{font-size:12.5px}
}
/* 手机横屏：棋盘缩到只剩两排怪兽，手牌挪到右侧一列里换行排，日志与操作条在它上面 */
@media (min-width:600px) and (max-height:560px){
  #scr-duel.on{
    --bw:calc(100vw - 24px - 336px);
    --off:224px; --div:2.84; --mmin:40px;
    display:grid; gap:5px 10px; overflow:hidden;
    grid-template-columns:minmax(0,1fr) 326px;
    grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);
    grid-template-areas:"bar bar" "op mid" "me hand";
  }
  #scr-duel>.duelbar{grid-area:bar; max-width:none}
  #scr-duel>.side.op-side{grid-area:op; justify-content:center; gap:3px}
  #scr-duel>.side.me-side{grid-area:me; justify-content:center; gap:3px}
  #scr-duel>.mid{grid-area:mid; max-width:none; max-height:none; min-height:0; margin:0}
  #scr-duel>.hand{
    grid-area:hand; flex-wrap:wrap; align-content:flex-start; overflow-x:hidden; overflow-y:auto; min-height:0; padding:2px;
    --hch:min(78px, 20dvh);
  }
  #scr-duel .hand .card{--cw:calc(var(--hch) * .75); --ch:var(--hch)}
  #scr-duel .pinfo{padding:2px 8px}
  #scr-duel .log{font-size:11px; line-height:1.5}
  .top{gap:6px}
}
/* 竖屏矮机（小屏手机）：压低固定占高，卡牌跟着缩 */
@media (max-width:899px) and (max-height:700px){
  #scr-duel{--off:362px}
  #scr-duel>.mid{max-height:84px; min-height:52px}
}
@media (min-width:600px) and (max-width:899px) and (min-height:701px){
  #scr-duel{--mmax:230px}
}
@media (max-width:899px) and (min-height:701px){
  #scr-duel{--off:410px}
}

<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
