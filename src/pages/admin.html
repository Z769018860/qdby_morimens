<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理后台 · 忘忘同人小游戏</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f7fb">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="modulepreload" href="js/admin.js">
<link rel="modulepreload" href="js/api.js">
<link rel="modulepreload" href="js/common.js">
<link rel="modulepreload" href="js/sitestats.js">
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --panel2:#f3f4f6; --line:#e5e7eb;
  --text:#1f2937; --dim:#6b7280; --accent:#111827; --accent2:#334155;
  --gold:#c2410c; --green:#137a3c; --red:#b42318; --blue:#1f5fa8;
  --shadow:0 10px 25px rgba(17,24,39,.08);
  --shadow2:0 2px 8px rgba(17,24,39,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background-image:
    radial-gradient(760px 420px at 8% -8%, rgba(99,102,241,.055), transparent 62%),
    radial-gradient(680px 420px at 96% 2%, rgba(14,165,233,.05), transparent 60%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;line-height:1.3}
.dim{color:var(--dim)}

.pfh{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:9px clamp(12px,3vw,28px); background:rgba(246,247,251,.86);
  backdrop-filter:blur(12px) saturate(1.2); border-bottom:1px solid var(--line)}
.pfh .brand{display:flex; flex-direction:column; line-height:1.15}
.pfh .brand b{font-size:15px}
.pfh .brand small{font-size:9.5px; letter-spacing:.22em; color:#9aa3af}
.tag{font-size:11px; padding:2px 9px; border-radius:999px; background:#fef3c7; color:#92400e; border:1px solid #fde68a}
.pfh-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.ghostlink{font-size:12.5px; color:var(--dim); padding:6px 8px; border-radius:8px}
.ghostlink:hover{background:#fff; color:var(--text)}

.wrap{max-width:1180px; margin:0 auto; padding:clamp(14px,2.4vw,26px) clamp(12px,3vw,28px) 56px}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 17px; box-shadow:var(--shadow2); margin-bottom:14px}
.card h2{font-size:15px}
.card .sub{font-size:12.5px; color:var(--dim); margin:3px 0 12px}
.pagehead{margin:4px 0 16px}
.pagehead h1{font-size:clamp(21px,3.2vw,28px)}
.pagehead p{margin:6px 0 0; color:var(--dim); font-size:13px}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px}
.kpi{background:var(--panel2); border:1px solid var(--line); border-radius:13px; padding:11px 13px; display:flex; flex-direction:column; gap:1px}
.kpi small{font-size:11px; color:var(--dim)}
.kpi b{font-size:21px; font-variant-numeric:tabular-nums; line-height:1.25}
.kpi span{font-size:11px; color:var(--dim)}

.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
input[type=text],input[type=number]{font:inherit; font-size:13px; padding:7px 11px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--text); outline:none}
input:focus{border-color:#9aa3af; box-shadow:0 0 0 3px rgba(17,24,39,.06)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 15px; border-radius:10px;
  border:1px solid transparent; cursor:pointer; font:inherit; font-size:13px; font-weight:600; color:#fff;
  background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 6px 16px -8px rgba(17,24,39,.5)}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.55; cursor:default; filter:none}
.btn.ghost{background:#fff; color:var(--text); border-color:var(--line); box-shadow:none}
.btn.ghost:hover{border-color:#c7cbd3; filter:none}
.btn.sm{padding:5px 11px; font-size:12px; border-radius:8px}
.btn.gold{background:linear-gradient(90deg,#b45309,#d97706)}

.tblwrap{overflow:auto; border:1px solid var(--line); border-radius:13px}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:820px}
th,td{padding:9px 11px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{background:#fafbfc; font-weight:600; font-size:11.5px; color:var(--dim); position:sticky; top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.num{font-variant-numeric:tabular-nums; text-align:right}
.namecell{display:flex; align-items:center; gap:7px; min-width:0}
.namecell b{font-weight:700}
.badge{font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--dim); background:#fff}
.badge.ok{color:var(--green); border-color:#bfe0cb; background:#f2fbf5}
.badge.no{color:var(--dim)}
.empty{margin:6px 0 0; padding:26px 12px; text-align:center; color:var(--dim); font-size:12.5px; border:1px dashed var(--line); border-radius:12px; background:#fafbfc}

/* 发放面板 */
.sheet{position:fixed; inset:0; z-index:80; display:none; place-items:center; padding:16px; background:rgba(17,24,39,.36); backdrop-filter:blur(3px)}
.sheet.on{display:grid}
.sheet .box{width:min(420px,100%); background:#fff; border-radius:16px; padding:18px; box-shadow:0 24px 60px -20px rgba(17,24,39,.5)}
.sheet h3{font-size:16px; margin-bottom:4px}
.sheet .who{font-size:12.5px; color:var(--dim); margin:0 0 12px}
.sheet .row{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap}
.sheet .row input[type=number]{width:110px}
.sheet .row input[type=text]{flex:1 1 180px}
.sheet .quick{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap}
.sheet .quick button{font:inherit; font-size:11.5px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--dim); cursor:pointer}
.sheet .quick button:hover{border-color:#c7cbd3; color:var(--text)}
.sheet .acts{display:flex; gap:8px; justify-content:flex-end; margin-top:6px}

.toast{position:fixed; left:50%; bottom:8%; transform:translateX(-50%); z-index:90; padding:9px 16px; border-radius:999px; background:#111827; color:#fff; font-size:13px; box-shadow:var(--shadow)}
#boot{display:grid; place-items:center; gap:10px; padding:80px 0; color:var(--dim)}
#boot .ring{width:26px; height:26px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gate{padding:44px 16px; text-align:center}
.gate h1{font-size:22px; margin-bottom:8px}
.gate p{margin:0 0 16px; color:var(--dim); font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<header class="pfh">
  <a class="brand" href="index.html"><b>忘忘同人小游戏</b><small>ADMIN</small></a>
  <span class="tag">管理后台</span>
  <div class="pfh-right" id="pfhRight"><a class="ghostlink" href="profile.html">个人中心</a><a class="ghostlink" href="index.html">回首页</a></div>
</header>
<main id="app" class="wrap">
  <div id="boot" role="status" aria-live="polite"><div class="ring"></div><p id="bootText">正在核对身份…</p><p id="bootHint"></p></div>
</main>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<!-- @boot -->
<script type="module" src="js/admin.js"></script>
</body>
</html>
