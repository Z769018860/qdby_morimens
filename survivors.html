<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>唤醒体幸存者 · 忘忘同人小游戏</title>
<meta name="description" content="吸血鬼幸存者的玩法，素材全部取自《忘却前夜》：62 名唤醒体 + 7 位 B 站主播彩蛋角色的技能都是可抽的武器，一路捡造物、开命轮，在忘川里活过 15 分钟。">
<meta name="theme-color" content="#0a0d14">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231f2430%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%224.5%22%2F%3E%0A%20%20%3Cline%20x1%3D%2237.5%22%20y1%3D%2236.5%22%20x2%3D%2249%22%20y2%3D%2248%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%224%22%20fill%3D%22%23e8b04b%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
<style>
/* 这一页不引用 css/style.css：整站那份 65KB 是给多页应用的，
   游戏页只要一个壳 + 一个脚本请求。样式全部走 CSS 变量，浅色也跟着系统走。 */
:root{
  --bg:#0a0d14; --panel:#121722; --panel2:#1a2130; --line:#28324a;
  --text:#e6e9f0; --dim:#8a93a8; --accent:#6ea8ff; --gold:#e3b341; --bad:#e8695f;
  --chaos:#b06bd9; --caro:#e8695f; --aequor:#5fe0d0; --ultra:#e3b341;
}
/* 这一页固定深色：战斗画面是深色地格，界面跟着系统切成浅色会割裂。
   （整站其余页面仍然跟随系统。） */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(760px 420px at 50% -8%, rgba(110,168,255,.12), transparent 70%);
  background-repeat:no-repeat;
  font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
button{font:inherit}

.app{position:relative; width:100%; height:100dvh; overflow:hidden}
#cv{display:block; width:100%; height:100%; touch-action:none; background:#0a0d14; cursor:crosshair}

/* ------------------------------------------------------------------ HUD */
#hud[hidden]{display:none}
#hud{position:absolute; inset:0; pointer-events:none; padding:max(10px,env(safe-area-inset-top)) 12px 12px;
  display:flex; flex-direction:column; gap:8px}
.hud-top{display:flex; align-items:center; gap:10px}
.hud-time{display:flex; flex-direction:column; line-height:1.1}
.hud-time b{font-size:20px; font-variant-numeric:tabular-nums; letter-spacing:.02em}
.hud-time span{font-size:11px; color:var(--dim)}
.hud-lv{flex:1 1 auto; display:flex; align-items:center; gap:7px; min-width:0}
.hud-lv span{font-size:11.5px; color:var(--dim); white-space:nowrap}
.hud-lv b{color:var(--gold); font-size:13px}
.xp{flex:1 1 auto; height:6px; border-radius:999px; background:color-mix(in oklab, var(--line) 80%, transparent); overflow:hidden}
.xp i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#4aa3ff,#7ee0ff); transition:width .12s linear}
.hud-pause,.hud-mute{pointer-events:auto; width:34px; height:34px; flex:0 0 34px; border-radius:10px;
  border:1px solid var(--line); background:color-mix(in oklab, var(--panel) 88%, transparent);
  color:var(--dim); font-size:12px; cursor:pointer}
.hud-pause:hover,.hud-mute:hover{color:var(--accent); border-color:var(--accent)}
.hud-mute.off{color:color-mix(in oklab, var(--bad) 80%, var(--dim)); border-color:color-mix(in oklab, var(--bad) 45%, var(--line))}

.hud-bars{display:flex; flex-direction:column; gap:5px; width:min(240px, 52%)}
.bar{position:relative; height:15px; border-radius:999px; overflow:hidden;
  background:color-mix(in oklab, #000 50%, var(--panel)); border:1px solid var(--line)}
.bar i{display:block; height:100%; width:100%; transition:width .12s linear}
.bar.hp i{background:linear-gradient(90deg,#d64a5a,#ff8a7a)}
.bar.sh{height:8px}
.bar.sh i{background:linear-gradient(90deg,#3b7dd8,#8ec5ff)}
.bar em{position:absolute; inset:0; display:grid; place-items:center; font-style:normal;
  font-size:10px; letter-spacing:.04em; text-shadow:0 1px 2px rgba(0,0,0,.8); color:#fff}

/* 狂气：一条槽配一个「狂」按钮。有条没按钮等于没做，满了必须能一眼看到并点掉。 */
.ragebox{display:flex; align-items:center; gap:5px; width:100%}
.bar.rage{flex:1 1 auto; height:11px}
.bar.rage i{width:0; background:linear-gradient(90deg,#a8502e,#ff9350); transition:width .1s linear}
.ragebox.ready .bar.rage{border-color:color-mix(in oklab,#ff9350 62%,var(--line));
  box-shadow:0 0 9px color-mix(in oklab,#ff9350 42%,transparent)}
.ragebox.ready .bar.rage i{background:linear-gradient(90deg,#ff7a3a,#ffc07a)}
.ragebox.burst .bar.rage i{background:linear-gradient(90deg,#ff4a2a,#ffd28a)}
.ragebtn{pointer-events:auto; flex:0 0 auto; width:26px; height:26px; border-radius:50%;
  border:1px solid color-mix(in oklab,#ff9350 38%,var(--line));
  background:color-mix(in oklab,#ff9350 12%,var(--panel));
  color:color-mix(in oklab,#ff9350 72%,var(--dim)); font-size:11px; font-weight:700;
  line-height:1; cursor:pointer; transition:transform .14s, background .14s}
.ragebox.ready .ragebtn{color:#1b0b05; background:linear-gradient(180deg,#ffb066,#ff7a3a);
  border-color:transparent; animation:ragePulse 1.1s ease-in-out infinite}
.ragebtn:disabled{opacity:.45; cursor:default; animation:none}
@keyframes ragePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}

.hud-weapons{display:flex; flex-wrap:wrap; gap:5px; margin-top:auto}
.slot{position:relative; width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
  background:color-mix(in oklab, var(--panel) 90%, transparent); display:grid; place-items:center; overflow:hidden}
.slot i{display:block; border-radius:6px}
.slot .pips{position:absolute; bottom:2px; left:0; right:0; display:flex; gap:1px; justify-content:center}
/* 冷却遮罩：从上往下收，收完就是这一发打出去的瞬间。
   用 transform 而不是 height —— 改 height 会触发重排，六个槽每帧重排会掉帧。 */
.slot .cdm{position:absolute; left:0; right:0; top:0; height:100%; border-radius:8px;
  background:linear-gradient(180deg, rgba(6,9,14,.86), rgba(6,9,14,.46));
  transform-origin:top; transform:scaleY(0); pointer-events:none; will-change:transform}
.slot .pips b{width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.22)}
.slot .pips b.on{background:var(--gold); box-shadow:0 0 4px color-mix(in oklab,var(--gold) 70%,transparent)}
/* 造物/命轮/契物：真实图标 + 层数角标，点一下看详情。
   HUD 整体是 pointer-events:none，这几个必须单独放行，否则点不到。 */
.hud-weapons .slot, .hud-passives .slot{pointer-events:auto; cursor:pointer}
.hud-weapons .slot:active, .hud-passives .slot:active{transform:scale(.94)}
.slot.p{border-color:color-mix(in oklab,#7ad6a0 42%,var(--line))}
.slot.w{border-color:color-mix(in oklab,var(--gold) 58%,var(--line));
  background:color-mix(in oklab,var(--gold) 10%,var(--panel))}
.slot.c{border-color:color-mix(in oklab,var(--chaos) 58%,var(--line));
  background:color-mix(in oklab,var(--chaos) 10%,var(--panel))}
.slot .stk{position:absolute; right:1px; top:1px; min-width:13px; height:13px; padding:0 3px;
  border-radius:7px; background:#7ad6a0; color:#08130d; font-size:9px; font-style:normal;
  font-weight:700; line-height:13px; text-align:center; box-shadow:0 0 4px rgba(0,0,0,.5)}
/* 超武槽：金边 + 右上角「超」标。没有这个标记，玩家只会觉得「这把打得比较疼」，
   完全不知道背后有一套凑条件的机制。 */
.slot.evo{border-color:var(--gold); box-shadow:0 0 0 1px color-mix(in oklab,var(--gold) 60%,transparent),
  0 0 8px color-mix(in oklab,var(--gold) 45%,transparent)}
.slot .evb{position:absolute; right:1px; top:1px; width:13px; height:13px; border-radius:4px;
  background:var(--gold); color:#1a1206; font-size:9px; font-style:normal; font-weight:800;
  line-height:13px; text-align:center; box-shadow:0 0 5px rgba(0,0,0,.55)}
.hud-passives{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px}
/* 道具栏：横排在血条下方，点一下立刻用掉。做成 44px 高是为了手指能点准 —— 
   这东西是在被围住的时候摸出来的，点不中等于没有。 */
.hud-items{display:flex; gap:6px; margin-top:6px; pointer-events:auto}
.hud-items[hidden]{display:none}
.itm{display:flex; align-items:center; gap:6px; height:34px; padding:0 10px 0 7px;
  border-radius:11px; cursor:pointer; font:inherit;
  border:1px solid color-mix(in oklab, var(--c) 55%, var(--line));
  background:color-mix(in oklab, var(--c) 14%, var(--panel));
  color:var(--text); transition:.12s}
.itm:hover{background:color-mix(in oklab, var(--c) 24%, var(--panel))}
.itm:active{transform:scale(.95)}
.itm b{font-size:15px; line-height:1; color:var(--c)}
.itm span{font-size:11px; color:color-mix(in oklab, var(--c) 70%, var(--text))}
/* 机制角标：王权 12/25 这种。放右下角，不挡视野也不和技能槽抢位置 */
.mechchip{position:absolute; right:12px; bottom:calc(64px + env(safe-area-inset-bottom));
  padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600;
  border:1px solid var(--line); background:color-mix(in oklab, #000 45%, var(--panel));
  letter-spacing:.02em; font-variant-numeric:tabular-nums}
.mechchip[hidden]{display:none}
.mechchip.hot{animation:mechpulse 1.1s ease-in-out infinite}
@keyframes mechpulse{50%{box-shadow:0 0 12px color-mix(in oklab, #7fb3ff 70%, transparent)}}
.bossbar[hidden]{display:none}
.bossbar{position:absolute; left:50%; bottom:calc(26px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  width:min(420px, 84%); display:flex; flex-direction:column; gap:3px; align-items:center}
.bossbar span{font-size:11.5px; color:var(--bad); letter-spacing:.06em;
  text-shadow:0 1px 3px rgba(0,0,0,.9)}
.bossbar i{display:block; width:100%; height:7px; border-radius:999px; overflow:hidden;
  background:color-mix(in oklab,#000 60%, var(--panel)); border:1px solid color-mix(in oklab,var(--bad) 45%,var(--line))}
.bossbar b{display:block; height:100%; background:linear-gradient(90deg,#b83a3a,#ff8a7a); transition:width .12s linear}

/* 触屏摇杆 */
#stick{position:fixed; z-index:5; width:96px; height:96px; margin:-48px 0 0 -48px;
  border-radius:50%; border:1.5px solid color-mix(in oklab, var(--accent) 45%, transparent);
  background:color-mix(in oklab, var(--accent) 8%, transparent);
  pointer-events:none; opacity:0; transition:opacity .12s ease}
#stick i{position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
  border-radius:50%; background:color-mix(in oklab, var(--accent) 55%, transparent);
  border:1.5px solid color-mix(in oklab, #fff 45%, transparent)}

/* --------------------------------------------------------------- 遮罩层 */
.ov{position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  background:color-mix(in oklab, var(--bg) 82%, transparent); backdrop-filter:blur(6px);
  padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom))}
.ov[hidden]{display:none}
.ov.mid .card{max-width:min(560px, 100%)}

/* --------------------------------------------------------------- 选人 */
.pick{position:relative; width:100%; max-width:640px; height:100%; display:flex; flex-direction:column; gap:10px; min-height:0;
  padding-bottom:max(2px, env(safe-area-inset-bottom))}
/* 回首页：选人页左上角一个小胶囊。战斗中不显示，避免误触退出整局。 */
.pick .home{position:absolute; top:10px; left:10px; z-index:2; display:inline-flex; align-items:center; gap:4px;
  height:26px; padding:0 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); color:var(--dim); font-size:12px; text-decoration:none}
.pick .home:hover{color:var(--accent); border-color:var(--accent)}
.pick header{text-align:center; flex:0 0 auto; padding-top:6px}
.pick h1{margin:0; font-size:25px; letter-spacing:.04em}
.pick h1 span{color:var(--accent)}
.pick .sub{margin:5px 0 0; color:var(--dim); font-size:12.5px}

.diff{display:flex; gap:5px; flex:0 0 auto}
.diff button{flex:1 1 0; height:30px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); color:var(--dim); font-size:12.5px; cursor:pointer; transition:.12s}
.diff button.on{color:var(--gold); font-weight:600; border-color:color-mix(in oklab,var(--gold) 58%,var(--line));
  background:color-mix(in oklab,var(--gold) 13%,var(--panel))}
.tip{margin:-4px 0 0; font-size:11.5px; color:var(--dim); text-align:center}
/* 选人页的即时提示（例如点了未解锁的角色）：红色是因为它是「你被拦住了」 */
.tip.warn{color:#ff9a88; background:color-mix(in oklab,#ff7a6a 12%,transparent);
  border:1px solid color-mix(in oklab,#ff7a6a 35%,transparent); border-radius:8px;
  padding:6px 8px; margin-top:6px}
.tip.warn[hidden]{display:none}

.char-list{flex:1 1 auto; min-height:0; overflow:auto; display:grid;
  grid-template-columns:repeat(auto-fill, minmax(62px, 1fr)); gap:6px; padding:2px;
  background:color-mix(in oklab, var(--panel) 55%, transparent); border:1px solid var(--line);
  border-radius:14px; padding:8px}
.char-list::-webkit-scrollbar{width:6px}
.char-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.ch{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:5px 2px 4px; border-radius:10px; border:1px solid transparent; background:transparent;
  color:var(--dim); cursor:pointer; transition:.12s}
.ch:hover{background:color-mix(in oklab, var(--accent) 10%, transparent)}
.ch i{border-radius:50%; display:block; filter:grayscale(.25) brightness(.92)}
.ch b{font-size:10.5px; font-weight:500; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ch.on{border-color:var(--accent); background:color-mix(in oklab, var(--accent) 16%, transparent); color:var(--text)}
.ch.on i{filter:none}
.ch.r-chaos.on{border-color:var(--chaos); background:color-mix(in oklab, var(--chaos) 16%, transparent)}
.ch.r-caro.on{border-color:var(--caro); background:color-mix(in oklab, var(--caro) 16%, transparent)}
.ch.r-aequor.on{border-color:var(--aequor); background:color-mix(in oklab, var(--aequor) 16%, transparent)}
.ch.r-ultra.on{border-color:var(--ultra); background:color-mix(in oklab, var(--ultra) 16%, transparent)}
/* 四位神秘唤醒体：没有立绘，只有剪影。未解锁时整张卡压暗到几乎只剩轮廓，
   解锁后仍然保留剪影外观（素材本来就不存在），但名字亮出来。 */
.ch.hidden-one{border-color:color-mix(in oklab, #9aa7ff 22%, transparent);
  background:linear-gradient(180deg, rgba(154,167,255,.07), transparent 70%)}
.ch.locked i{filter:brightness(.78) contrast(.95)}
.ch.locked b{color:color-mix(in oklab, var(--dim) 80%, transparent); letter-spacing:.12em}
.ch.locked:hover{border-color:color-mix(in oklab, #9aa7ff 40%, transparent)}
.ch .lkb{position:absolute; top:1px; right:1px; font-size:10px; line-height:1; padding:3px 5px;
  border-radius:8px; font-style:normal; font-weight:700; color:#0e1118;
  background:color-mix(in oklab,#9aa7ff 90%, #fff);
  box-shadow:0 1px 5px rgba(0,0,0,.5)}
.ch .lkb.open{background:var(--gold); color:#241a04}
/* 彩蛋唤醒体（B 站主播）：头像用主播本人的 B 站图，外圈是角色主题色。
   头像缺失时退回「主题色圆底 + 一个字」的徽章 —— 配色必须和 js/sv/ui.js 的
   eggStyle()、js/sv/render.js 的 drawEggFace() 三处一致。 */
.ch.egg{border-color:color-mix(in oklab, var(--gold) 26%, transparent);
  background:linear-gradient(180deg, rgba(227,179,65,.06), transparent 70%)}
.ch.egg i{filter:none}
.ch.egg b{color:var(--gold); font-size:10px; letter-spacing:-.2px}
.ch.egg.on{border-color:var(--gold); background:color-mix(in oklab, var(--gold) 15%, transparent)}
.ch .lkb.egg{background:var(--gold); color:#241a04; font-size:9px; letter-spacing:0; padding:3px 4px}
.ch i.egg,.ci-portrait.egg,.up-img.egg{display:flex; align-items:center; justify-content:center;
  font-weight:800; line-height:1; letter-spacing:0}
.ch i.egg{font-size:21px}
.ci-portrait.egg{font-size:29px}
.up-img.egg{font-size:19px}
/* 通用徽章类：ui.js 的 charFaceHTML() 用它给 HUD 技能槽、构筑详情、
   超武觉醒卡画「这是谁的技能」。字号由内联 font-size 决定（跟着尺寸走）。 */
.egg-face{display:flex; align-items:center; justify-content:center;
  font-weight:800; line-height:1; letter-spacing:0; border-radius:50%; flex:0 0 auto}

.char-info{flex:0 0 auto; padding:9px 11px; border-radius:13px; border:1px solid var(--line);
  background:var(--panel); font-size:12px; line-height:1.5; max-height:38vh; overflow:auto}
.ci-top{display:flex; gap:10px; align-items:flex-start}
.ci-portrait{border-radius:12px; display:block; flex:0 0 auto}
.char-info h3{margin:0 0 3px; font-size:15px}
.char-info h3 small{color:var(--dim); font-weight:400; font-size:11px; margin-left:4px}
.ci-tags{display:flex; gap:5px; margin:0 0 4px}
.tg{font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--dim)}
.tg.r-chaos{color:var(--chaos); border-color:color-mix(in oklab,var(--chaos) 50%,var(--line))}
.tg.r-caro{color:var(--caro); border-color:color-mix(in oklab,var(--caro) 50%,var(--line))}
.tg.r-aequor{color:var(--aequor); border-color:color-mix(in oklab,var(--aequor) 50%,var(--line))}
.tg.r-ultra{color:var(--ultra); border-color:color-mix(in oklab,var(--ultra) 50%,var(--line))}
/* 身份标签：唤醒体 / 剧情角色 / 首领 / 守密人。N 和威廉严格说来不是唤醒体，
   所以这一枚用虚线边跟着，一眼能和「界域/定位/稀有度」那三枚分开 */
.tg.kind{color:var(--gold); border-style:dashed;
  border-color:color-mix(in oklab,var(--gold) 50%, transparent)}
.ci-line{margin:0; color:var(--dim); font-size:11.5px}
.ci-line b{color:var(--accent); font-weight:600; margin-right:6px; font-size:11px}
.ci-talent{margin:7px 0 6px; color:var(--dim); font-size:11.5px}
.ci-talent b{display:block; color:var(--gold); font-size:12px; margin-bottom:1px}
.ci-w{display:flex; flex-direction:column; gap:4px}
.wi{display:flex; align-items:baseline; gap:7px; padding:3px 7px; border-radius:8px;
  background:color-mix(in oklab, var(--panel2) 80%, transparent)}
.wi .pk{font-size:9.5px; padding:0 5px; border-radius:999px; background:color-mix(in oklab,var(--accent) 22%,transparent); color:var(--accent)}
.wi b{font-size:12px; font-weight:600}
.wi em{font-size:11px; color:var(--dim); font-style:normal; margin-left:auto}
/* 未解锁：条件 + 进度。条件用正文字号，进度用等宽数字，一眼知道还差多少 */
.ci-lock{margin:8px 0 4px; padding:8px 10px; border-radius:10px;
  border:1px dashed color-mix(in oklab,#9aa7ff 45%, transparent);
  background:color-mix(in oklab,#9aa7ff 10%, transparent)}
.ci-lock b{display:block; color:#9aa7ff; font-size:11.5px; margin-bottom:3px}
.ci-lock p{margin:0; color:var(--text); font-size:12px; line-height:1.5}
.ci-lock u{display:block; margin-top:4px; text-decoration:none; font-size:11px;
  color:var(--dim); font-variant-numeric:tabular-nums}
.ci-mech{margin:6px 0; font-size:11.5px; color:var(--dim); line-height:1.5;
  padding-left:8px; border-left:2px solid color-mix(in oklab,var(--gold) 55%,transparent)}
.ci-mech b{display:block; color:var(--gold); font-size:12px}
/* 档案：一段叙事文案，比分节行文长，所以给个淡底把「资料」和「数值」隔开 */
/* 羁绊：彩蛋主播和某位官方唤醒体的专属联动。金底是为了和「档案」的蓝底分开 ——
   上面一条是玩法，下面一条是资料，玩家扫一眼就能分辨 */
.ci-bond{margin:8px 0 6px; padding:8px 10px; border-radius:10px;
  background:color-mix(in oklab, #ffd76a 7%, transparent);
  border-left:2px solid color-mix(in oklab, #ffd76a 58%, transparent)}
.ci-bond b{display:block; color:#ffd76a; font-size:11.5px; letter-spacing:.05em; margin-bottom:4px}
.ci-bond p{margin:0 0 6px}
.ci-bond p:last-child{margin-bottom:0}
.ci-bond em{display:block; font-style:normal; color:var(--text); font-size:12px; font-weight:600}
.ci-bond span{display:block; font-size:11.5px; color:var(--dim); line-height:1.55}
.ci-bond u{display:block; margin-top:2px; text-decoration:none; font-size:10.5px;
  color:color-mix(in oklab, #ffd76a 52%, var(--dim))}
.ci-bio{margin:8px 0 6px; padding:8px 10px; border-radius:10px;
  background:color-mix(in oklab, var(--panel2) 88%, transparent);
  border-left:2px solid color-mix(in oklab,#9aa7ff 55%, transparent)}
.ci-bio b{display:block; color:#9aa7ff; font-size:11.5px; letter-spacing:.05em; margin-bottom:4px}
.ci-bio span{display:block; font-size:11.5px; line-height:1.68; color:var(--dim);
  text-indent:2em; text-align:justify}
.ci-bio u{display:block; margin-top:5px; text-decoration:none; font-size:10px;
  color:color-mix(in oklab, var(--dim) 70%, transparent)}

.btn{height:44px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
  color:var(--text); cursor:pointer; font-size:14.5px; font-weight:600; transition:.14s}
.btn.primary{background:linear-gradient(180deg, color-mix(in oklab,var(--accent) 90%, #fff), var(--accent));
  border-color:transparent; color:#03101f}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--dim)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.55; cursor:default; filter:saturate(.6)}
.btn:disabled:active{transform:none}

/* --------------------------------------------------------- 升级三选一 */
.card{width:100%; max-height:100%; overflow:auto; border-radius:16px; border:1px solid var(--line);
  background:var(--panel); padding:16px}
.card h2{margin:0 0 4px; font-size:18px; text-align:center}
.card .hint{margin:0 0 12px; text-align:center; color:var(--dim); font-size:12px}
#upList{display:flex; flex-direction:column; gap:8px}
.up{position:relative; display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:10px 34px 10px 11px; border-radius:13px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel2); color:var(--text); transition:.13s}
.up:hover{border-color:var(--accent); transform:translateY(-1px)}
.up.w{border-color:color-mix(in oklab,var(--accent) 42%,var(--line))}
.up.k{border-color:color-mix(in oklab,#7ad6a0 38%,var(--line))}
.up-img{flex:0 0 auto; border-radius:10px; display:block; background:var(--panel)}
.up-txt{display:flex; flex-direction:column; gap:1px; min-width:0}
.up-txt b{font-size:13.5px}
.up-txt em{font-size:11.5px; color:var(--dim); font-style:normal;
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.up-txt u{font-size:11px; color:var(--accent); text-decoration:none}
.up-tag{position:absolute; right:8px; top:6px; font-size:9.5px; color:var(--dim)}
.up-key{position:absolute; right:8px; bottom:6px; font-size:9.5px; color:var(--dim);
  border:1px solid var(--line); border-radius:4px; padding:0 4px}
/* 不同稀有度的边框：新/升级技能=蓝，造物=绿，命轮=金，契物=紫 */
.up.wnew{border-color:color-mix(in oklab,var(--accent) 55%,var(--line))}
.up.wlv{border-color:color-mix(in oklab,var(--accent) 35%,var(--line))}
/* 替换卡用橙框，跟「新增」的蓝框分开：这是会丢掉一把已有技能的选项 */
.up.wswap{border-color:color-mix(in oklab,#ff9350 55%,var(--line));
  background:color-mix(in oklab,#ff9350 7%,var(--panel2))}
.up.creation{border-color:color-mix(in oklab,#7ad6a0 50%,var(--line))}
.up.wheel{border-color:color-mix(in oklab,var(--gold) 60%,var(--line));
  background:color-mix(in oklab,var(--gold) 8%,var(--panel2))}
.up.cov{border-color:color-mix(in oklab,var(--chaos) 60%,var(--line));
  background:color-mix(in oklab,var(--chaos) 9%,var(--panel2))}
/* 后期两条线：淬炼=金（永久但单次很小），道具=青（一次性但立刻见效） */
.up.growth{border-color:color-mix(in oklab,var(--gold) 55%,var(--line));
  background:color-mix(in oklab,var(--gold) 6%,var(--panel2))}
.up.item{border-color:color-mix(in oklab,#5fe0d0 55%,var(--line));
  background:color-mix(in oklab,#5fe0d0 7%,var(--panel2))}
/* 「什么都不选」的出口：技能栏满了、想要的都不在上面时，玩家得能退出这一屏 */
.up-none{margin:8px 0 0; text-align:center; color:var(--dim); font-size:12px}
.up-skip{display:block; width:100%; margin-top:10px; padding:9px;
  border-radius:11px; border:1px dashed var(--line); background:transparent;
  color:var(--dim); font-size:12.5px; cursor:pointer; transition:.13s; font-family:inherit}
.up-skip:hover{color:var(--text); border-color:color-mix(in oklab,var(--accent) 45%,var(--line))}

/* --------------------------------------------------------- 构筑详情 */
.if-h{margin:14px 0 6px; font-size:12px; color:var(--accent); letter-spacing:.04em}
.if-h:first-child{margin-top:0}
.if-row{display:flex; gap:9px; align-items:flex-start; padding:7px 9px; border-radius:10px;
  background:var(--panel2); margin-bottom:5px}
.if-row i{flex:0 0 auto; border-radius:8px; display:block}
.if-row>b, .if-row div{min-width:0}
.if-row b{font-size:12.5px; display:block}
.if-row b em{font-style:normal; color:var(--gold); font-size:11px; margin-left:4px}
.if-row span{display:block; font-size:11px; color:var(--dim); margin-top:1px}
.if-row u{display:block; font-size:11px; color:color-mix(in oklab,var(--accent) 78%,var(--dim));
  text-decoration:none; margin-top:2px}
.if-row.sm{padding:5px 8px}
.if-row.sm b{font-size:12px}
/* 超武技能行：左侧金线 + 金框标签，和普通技能区分开 */
.if-row.has-evo{border-left:2px solid var(--gold); padding-left:8px;
  background:color-mix(in oklab,var(--gold) 7%,transparent)}
.evo-tag{display:inline-block; margin-left:5px; padding:0 5px; border-radius:5px; font-style:normal;
  font-size:10px; font-weight:600; background:color-mix(in oklab,var(--gold) 22%,transparent);
  color:var(--gold); vertical-align:1px}
.if-row u.evo-line{color:var(--gold)}
/* 还没觉醒的技能：把超武条件写在下面，玩家才知道该往哪个方向凑 */
.if-row u.evo-need{color:color-mix(in oklab,var(--gold) 60%,var(--dim))}
/* 机制行与淬炼/道具用的文字图标（没有图集格位，用一个符号代替立绘） */
.if-glyph{flex:0 0 26px; width:26px; height:26px; border-radius:8px; display:flex;
  align-items:center; justify-content:center; font-style:normal; font-size:15px;
  background:color-mix(in oklab, currentColor 14%, transparent);
  box-shadow:inset 0 0 0 1px color-mix(in oklab, currentColor 34%, transparent)}
.if-row.mech{border-left:2px solid color-mix(in oklab,var(--gold) 60%,transparent);
  background:color-mix(in oklab,var(--gold) 6%,transparent)}
/* 羁绊：没达成是灰的，达成后整行转金 —— 和机制那条常亮的金线不冲突，
   机制是自带的，羁绊是自己凑出来的 */
.if-row.bond{border-left:2px solid color-mix(in oklab,#8790a6 50%,transparent);
  background:color-mix(in oklab,#8790a6 7%,transparent)}
/* 没达成的等级用灰色，别跟着 .if-row b em 一起变金 —— 没生效还标金色会看着像已经生效 */
.if-row.bond b em{color:color-mix(in oklab,#8790a6 70%, var(--dim))}
.if-row.bond.on{border-left-color:var(--gold);
  background:color-mix(in oklab,var(--gold) 9%,transparent)}
.if-row.bond.on b em{color:var(--gold)}
/* 替换目标选择：六个槽两列铺开，等级与超武状态一眼可见 */
#swapList{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:10px 0 4px}
.sw{display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:7px 9px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel2); color:inherit; font:inherit;
  text-align:left; cursor:pointer; min-width:0}
.sw:active{transform:scale(.97)}
.sw i{flex:0 0 auto; border-radius:8px}
.sw b{font-size:12.5px; font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sw em{margin-left:auto; flex:0 0 auto; font-style:normal; font-size:11px; color:var(--gold)}
.sw.evo{border-color:color-mix(in oklab,var(--gold) 55%,var(--line))}
.sw.lock{cursor:not-allowed; opacity:.62; border-style:dashed}
.sw.lock:active{transform:none}
.sw.lock em{color:var(--dim)}
.sw .evo-tag{flex:0 0 100%; margin:0; padding:0; background:none; font-size:10px;
  color:color-mix(in oklab,var(--gold) 80%,var(--dim))}

/* ------------------------------------------------------- 结算伤害明细 */
.dmg-row{display:flex; align-items:center; gap:7px; margin-bottom:6px}
.dmg-row>i{flex:0 0 auto; border-radius:7px; display:block}
.dmg-ico{width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
  background:color-mix(in oklab,#ff9350 22%,var(--panel2)); color:#ff9350; font-size:11px;
  font-style:normal; font-weight:700}
.dmg-meta{flex:0 0 auto; width:90px; min-width:0}
.dmg-meta b{display:block; font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dmg-meta em{display:block; font-style:normal; font-size:10px; color:var(--dim);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dmg-bar{flex:1 1 auto; height:7px; border-radius:999px; overflow:hidden;
  background:color-mix(in oklab,#000 45%,var(--panel2))}
.dmg-bar u{display:block; height:100%; border-radius:999px; text-decoration:none}
.dmg-num{flex:0 0 auto; font-size:11.5px; font-variant-numeric:tabular-nums; text-align:right; min-width:62px}
.dmg-num em{display:block; font-style:normal; font-size:9.5px; color:var(--dim)}
.dmg-sub{margin:8px 0 0; font-size:11px; color:var(--dim); text-align:center}

/* --------------------------------------------------------------- 结算 */
#endStats{display:grid; grid-template-columns:repeat(auto-fit,minmax(76px,1fr)); gap:8px; margin:14px 0 6px}
.es{display:flex; flex-direction:column; align-items:center; gap:1px; background:var(--panel2);
  border-radius:11px; padding:9px 4px; margin:0}
.es b{font-size:19px; color:var(--gold); font-variant-numeric:tabular-nums}
.es span{font-size:10.5px; color:var(--dim); text-align:center}
.row{display:flex; gap:8px; margin-top:12px}
/* 结算里的解锁区块：只在刚好放出神秘唤醒体时出现，所以做得有仪式感一点
   （金框 + 剪影），但不要做成需要点掉的弹窗 —— 玩家这时候只想看分数。 */
#endUnlock[hidden]{display:none}

/* ---------------------------------------------------- 超武觉醒提示卡
   以前超武觉醒只在角色头顶飘一行小字，玩家回过神时它已经没了，
   既不知道是哪把技能变的，也不知道变成了什么效果。这里做成一张
   会停留几秒的卡：来源技能 → 超武名、达成条件、效果，三条一次讲清。 */
#evoPop{position:absolute; left:12px; right:12px;
  top:calc(max(10px, env(safe-area-inset-top)) + 58px);
  z-index:8; display:flex; flex-direction:column; gap:6px; pointer-events:none}
#evoPop[hidden]{display:none}
.evo-card{pointer-events:auto; position:relative; display:flex; gap:9px; align-items:flex-start;
  padding:9px 10px 10px; border-radius:12px; overflow:hidden;
  border:1px solid color-mix(in oklab, var(--gold) 58%, var(--line));
  background:linear-gradient(180deg, rgba(38,31,16,.96), rgba(14,17,24,.97));
  box-shadow:0 8px 26px rgba(0,0,0,.55), inset 0 0 26px color-mix(in oklab, var(--gold) 12%, transparent);
  animation:evoIn .34s cubic-bezier(.2,.9,.3,1.15)}
.evo-card.out{animation:evoOut .3s ease forwards}
.evo-card>i{flex:0 0 40px; width:40px; height:40px; border-radius:9px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); filter:none}
.evo-card .eb{flex:1 1 auto; min-width:0}
.evo-card .eb .tag{display:inline-flex; align-items:center; gap:4px; font-size:10px; letter-spacing:.18em;
  color:var(--gold); text-transform:uppercase}
.evo-card .eb .nm{margin:2px 0 3px; font-size:14px; line-height:1.3}
.evo-card .eb .nm s{color:var(--dim); font-size:11.5px; text-decoration:none}
.evo-card .eb .nm b{color:var(--gold); font-weight:600}
.evo-card .eb .cond{font-size:10.5px; color:color-mix(in oklab, var(--gold) 62%, var(--dim)); line-height:1.4}
.evo-card .eb .fx{margin-top:3px; font-size:11.5px; color:var(--text); line-height:1.45}
/* 羁绊达成卡：同一套排版换蓝底，一眼能分出「凑出羁绊」和「技能质变」 */
.evo-card.bond{border-color:color-mix(in oklab, #7fd8ff 55%, var(--line));
  background:linear-gradient(180deg, rgba(16,32,42,.96), rgba(14,17,24,.97));
  box-shadow:0 8px 26px rgba(0,0,0,.55), inset 0 0 26px color-mix(in oklab, #7fd8ff 11%, transparent)}
.evo-card.bond .eb .tag{color:#7fd8ff}
.evo-card.bond .eb .nm b{color:#9fe6ff}
.evo-card.bond .eb .cond{color:color-mix(in oklab, #7fd8ff 58%, var(--dim))}
.evo-card .x{position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:8px;
  border:1px solid transparent; background:transparent; color:var(--dim); font-size:12px; cursor:pointer}
.evo-card .x:hover{color:var(--text); border-color:var(--line)}
@keyframes evoIn{from{opacity:0; transform:translateY(-16px) scale(.96)} to{opacity:1; transform:none}}
@keyframes evoOut{to{opacity:0; transform:translateY(-10px) scale(.98)}}
.ul-box{margin:12px 0 4px; padding:10px 11px; border-radius:12px;
  border:1px solid color-mix(in oklab,var(--gold) 55%,var(--line));
  background:color-mix(in oklab,var(--gold) 8%,var(--panel2))}
.ul-box h3{margin:0 0 7px; font-size:12.5px; color:var(--gold); letter-spacing:.04em}
.ul-row{display:flex; gap:9px; align-items:center; padding:5px 0}
.ul-row i{flex:0 0 auto; border-radius:10px}
.ul-row b{font-size:13px}
.ul-row span{display:block; font-size:11px; color:var(--dim); line-height:1.45}
.ul-tip{margin:6px 0 0; font-size:10.5px; color:var(--dim)}
.row .btn{flex:1 1 0}

#pauseWeapons{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:6px; margin:12px 0}
.pw{display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:9px; background:var(--panel2); font-size:12px}
.pw i{display:block; border-radius:8px; flex:0 0 auto}
/* 五个字的技能名（「共生畸变」）在窄屏会把最后一个字挤到第二行，看着像换了个技能。
   名字单行省略，等级靠右固定，两者都不许互相挤。 */
.pw b{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pw em{margin-left:auto; flex:0 0 auto; font-style:normal; color:var(--gold); font-size:11px}
#pauseStats{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; color:var(--dim); font-size:12px}
#pauseStats b{color:var(--text)}
.dim{color:var(--dim)}

@media (max-width:520px){
  .pick h1{font-size:21px}
  .char-list{grid-template-columns:repeat(auto-fill, minmax(56px, 1fr))}
  .char-info{max-height:34vh}
}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
<meta name="build" content="190e9d7fec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/app/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="忘忘小游戏">
</head>
<body>
<div class="app">
  <canvas id="cv"></canvas>

  <div id="hud" hidden></div>
  <div id="evoPop" hidden></div>
  <div id="stick"><i></i></div>

  <!-- ------------------------------------------------------- 选人 -->
  <div class="ov" id="ovPick">
    <div class="pick">
      <a class="home" href="index.html">← 首页</a>
      <header>
        <h1>唤醒体<span>幸存者</span></h1>
        <p class="sub">素材全部取自《忘却前夜》· 62 名唤醒体的 124 个技能都是可抽的武器 · 4 位神秘人要靠自己打出来 · 名单最后站着 9 位 B 站主播，各自和一位唤醒体绑着专属羁绊</p>
      </header>

      <div class="diff" id="diffBox"></div>
      <p class="tip" id="diffTip"></p>
      <p class="tip warn" id="pickTip" hidden></p>

      <div class="char-list" id="charList" aria-label="选择唤醒体"></div>
      <div class="char-info" id="charInfo"></div>

      <button class="btn primary" id="btnStart" disabled>进入融灾禁区</button>
    </div>
  </div>

  <!-- --------------------------------------------------- 升级三选一 -->
  <div class="ov mid" id="ovUp" hidden>
    <div class="card">
      <h2>获得一份馈赠</h2>
      <p class="hint" id="upHint">选一个带走 · 键盘 1 / 2 / 3 · 0 跳过</p>
      <div id="upList"></div>
      <button class="up-skip" id="btnSkipUp">这次不要 · 跳过</button>
    </div>
  </div>

  <!-- --------------------------------------------------- 替换目标 -->
  <div class="ov mid" id="ovSwap" hidden>
    <div class="card">
      <h2 id="swapTitle">替换掉哪一个？</h2>
      <p class="hint">被换掉的技能会失去全部等级，新技能从 1 级起 · 键盘 1 ~ 6</p>
      <div id="swapList"></div>
      <div class="row">
        <button class="btn ghost" id="btnSwapCancel">算了，换一张</button>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------- 暂停 -->
  <div class="ov mid" id="ovPause" hidden>
    <div class="card">
      <h2>暂停</h2>
      <p class="hint">这一局还在等着你 · 放弃会按当前战果结算，银芯照发</p>
      <div id="pauseStats"></div>
      <div id="pauseWeapons"></div>
      <div class="row">
        <button class="btn primary" id="btnResume">继续</button>
        <button class="btn ghost" id="btnQuit">放弃并结算</button>
      </div>
    </div>
  </div>

  <!-- ------------------------------------------------------- 结算 -->
  <div class="ov mid" id="ovEnd" hidden>
    <div class="card">
      <h2 id="endTitle">结束</h2>
      <p class="hint" id="endSub"></p>
      <div id="endStats"></div>
      <p class="hint" id="endTier"></p>
      <div id="endUnlock"></div>
      <div id="endDmg"></div>
      <div class="row">
        <button class="btn primary" id="btnAgain">再来一局</button>
        <button class="btn ghost" id="btnMenu">回到选人</button>
      </div>
    </div>
  </div>

  <!-- --------------------------------------------------- 构筑详情 -->
  <div class="ov mid" id="ovInfo" hidden>
    <div class="card">
      <h2>当前构筑</h2>
      <p class="hint">战斗已暂停 · 关掉面板继续</p>
      <div id="infoBody"></div>
      <div class="row">
        <button class="btn primary" id="btnInfoClose">返回战斗</button>
      </div>
    </div>
  </div>
</div>

<script>
/* 载入守护（内联，不占请求）：脚本卡住时至少给个说法和一个按钮 */
(function () {
  var t0 = Date.now();
  setTimeout(function () {
    var b = document.getElementById('btnStart');
    // 已经就绪就不要盖掉按钮文案：图集解码通常 1 秒内就完了，
    // 原先这里无条件改写，结果素材早好了按钮却一直挂着「正在载入素材…」。
    if (b && !b.dataset.ready) { b.textContent = '正在载入素材…'; b.disabled = true; }
  }, 4000);
  setTimeout(function () {
    if (Date.now() - t0 < 18000) return;
    var b = document.getElementById('btnStart');
    if (!b || b.dataset.ready) return;
    b.textContent = '载入超时，点这里重试';
    b.disabled = false;
    b.onclick = function () { location.replace(location.pathname + '?r=' + Date.now()); };
  }, 18000);
})();
</script>
<script type="module" src="js/b/survivors.js?v=190e9d7fec"></script>
<!-- 横屏 / 竖屏：所有小游戏共用的一块 UI 与逻辑，构建时注入到每个游戏页 </body> 前。
     为什么放在这里而不是各页面各写一份：七个游戏的头部结构完全不一样，
     但「现在该用哪个方向」这件事是同一件——所以只留一份，改一次全站生效。
     行为：
       · 记在每个游戏自己的键上（zjtt:orient:<游戏>），换游戏不会互相影响
       · 优先用 screen.orientation.lock 真正锁方向（Chrome / PWA / 桌面版可用）
       · 锁不住（iOS Safari、桌面浏览器）时：横屏但手机竖着 → 提示「把手机横过来」
       · 改完方向补一次 resize，canvas 游戏会按新尺寸重排 -->
<style>
.zj-orient{
  position:fixed; left:10px; bottom:10px; z-index:80;
  display:flex; align-items:center; gap:2px; padding:3px;
  background:rgba(18,23,33,.82); border:1px solid rgba(150,165,195,.28);
  border-radius:11px; backdrop-filter:blur(6px);
  font:12px/1 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#c8d1e3; box-shadow:0 10px 24px -14px #000;
}
.zj-orient button{
  appearance:none; border:0; background:none; cursor:pointer;
  color:inherit; font:inherit; padding:5px 8px; border-radius:8px;
  display:flex; align-items:center; gap:4px;
}
.zj-orient button:hover{background:rgba(120,150,210,.16)}
.zj-orient button.on{background:rgba(110,168,255,.2); color:#dfe8ff}
.zj-orient .sep{width:1px; height:14px; background:rgba(150,165,195,.25)}
.zj-orient .lbl{font-size:10.5px; opacity:.62; padding:0 3px}
/* 窄屏：只剩一颗循环切换的小钮，别压住游戏底部的摇杆 / 预览条 */
.zj-orient.narrow{padding:2px; gap:0}
.zj-orient.narrow button{padding:6px 7px; line-height:1}
@media (max-width:720px){ .zj-orient{bottom:8px; left:8px; padding:2px} .zj-orient .lbl{display:none} }

.zj-rot{
  position:fixed; inset:0; z-index:9999; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(8,11,18,.94); color:#e6e9f0; text-align:center; padding:24px;
  font:14px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.zj-rot.on{display:flex}
.zj-rot svg{width:64px; height:64px; opacity:.85; animation:zjrot 2.4s ease-in-out infinite}
@keyframes zjrot{0%,45%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
.zj-rot b{font-size:16px}
.zj-rot p{margin:0; max-width:22em; color:#98a3ba; font-size:13px}
.zj-rot .acts{display:flex; gap:10px; margin-top:4px}
.zj-rot button{
  appearance:none; font:inherit; font-size:13px; padding:8px 16px; border-radius:9px;
  border:1px solid rgba(150,165,195,.3); background:rgba(30,37,50,.9); color:#dfe6f5; cursor:pointer;
}
.zj-rot button.pri{background:linear-gradient(100deg,#6ea8ff,#a07cff); border-color:transparent; color:#fff}
</style>
<script>
(function () {
  'use strict';
  var path = location.pathname;
  var file = (path.split('/').pop() || '').replace(/\.html?$/i, '');
  var game = /\/idle\//.test(path) ? 'idle'
    : /\/deathreport\//.test(path) ? 'deathreport'
    : (file || 'index');
  var KEY = 'zjtt:orient:' + game;
  var MODES = [
    { k: 'auto', t: '自动', icon: '⟲' },
    { k: 'land', t: '横屏', icon: '▭' },
    { k: 'port', t: '竖屏', icon: '▯' }
  ];

  function read() {
    try { return localStorage.getItem(KEY) || 'auto'; } catch (e) { return 'auto'; }
  }
  var pref = read();
  var baseTitle = document.title;

  // 窄屏（手机）上游戏画面本来就挤，左下角只留一颗小圆钮，点一下循环切换；
  // 宽屏才摊开成三个按钮。判定只在加载时做一次，避免旋屏时反复重建 DOM。
  var mqNarrow = window.matchMedia ? window.matchMedia('(max-width:720px)') : null;
  var narrow = !!(mqNarrow && mqNarrow.matches);

  // ---- UI
  var bar = document.createElement('div');
  bar.className = 'zj-orient';
  bar.setAttribute('role', 'group');
  bar.setAttribute('aria-label', '游玩方向');

  function modeOf(k) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].k === k) return MODES[i];
    return MODES[0];
  }

  function buildBar() {
    bar.innerHTML = '';
    if (narrow) {
      bar.classList.add('narrow');
      var cur = modeOf(pref);
      var b1 = document.createElement('button');
      b1.type = 'button';
      b1.dataset.k = cur.k;
      b1.className = 'on';
      b1.title = '方向：' + cur.t + '（点一下换）';
      b1.setAttribute('aria-label', '游玩方向：' + cur.t + '，点按切换');
      b1.innerHTML = '<span aria-hidden="true">' + cur.icon + '</span>';
      b1.addEventListener('click', function () {
        var i = MODES.map(function (m) { return m.k; }).indexOf(pref);
        set(MODES[(i + 1) % MODES.length].k, true);
      });
      bar.appendChild(b1);
      return;
    }
    bar.innerHTML = '<span class="lbl">方向</span>';
    MODES.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.k = m.k;
      b.title = m.t === '自动' ? '跟随手机方向' : ('锁定' + m.t);
      b.innerHTML = '<span aria-hidden="true">' + m.icon + '</span><span>' + m.t + '</span>';
      b.addEventListener('click', function () { set(m.k, true); });
      bar.appendChild(b);
    });
  }
  buildBar();

  var overlay = document.createElement('div');
  overlay.className = 'zj-rot';
  overlay.innerHTML = [
    '<svg viewBox="0 0 24 24" fill="none" stroke="#c8d1e3" stroke-width="1.4" stroke-linecap="round">',
    '<rect x="6.5" y="2.5" width="11" height="19" rx="2.4"/>',
    '<path d="M10 5.4h4"/><circle cx="12" cy="18.4" r="1.05" fill="#c8d1e3" stroke="none"/>',
    '</svg>',
    '<b>把手机横过来</b>',
    '<p>这个游戏按横屏排版。手机系统不让网页锁方向时，转一下机身就好；不想转也可以先竖着玩。</p>',
    '<div class="acts"><button type="button" class="pri" data-act="keep">已经横过来了</button>',
    '<button type="button" data-act="port">仍要竖屏玩</button></div>'
  ].join('');

  function ready(fn) {
    if (document.body) fn();
    else document.addEventListener('DOMContentLoaded', fn, { once: true });
  }

  function applyCss() {
    var r = document.documentElement;
    if (pref === 'auto') r.removeAttribute('data-orient');
    else r.setAttribute('data-orient', pref);
    document.dispatchEvent(new CustomEvent('zj:orient', { detail: { mode: pref } }));
    setTimeout(function () {
      window.dispatchEvent(new Event('resize'));
      if (window.visualViewport) window.dispatchEvent(new Event('resize'));
    }, 80);
  }

  function paint() {
    if (narrow) {
      var cur = modeOf(pref);
      var only = bar.querySelector('button');
      if (only) {
        only.dataset.k = cur.k;
        only.title = '方向：' + cur.t + '（点一下换）';
        only.setAttribute('aria-label', '游玩方向：' + cur.t + '，点按切换');
        only.innerHTML = '<span aria-hidden="true">' + cur.icon + '</span>';
      }
    } else {
      [].forEach.call(bar.querySelectorAll('button'), function (b) {
        b.classList.toggle('on', b.dataset.k === pref);
        b.setAttribute('aria-pressed', b.dataset.k === pref ? 'true' : 'false');
      });
    }
    checkRotateHint();
  }

  // 锁定失败 + 手机竖着 = 给个转屏提示；已锁住时系统自己会转，不用提示
  function checkRotateHint() {
    var portrait = window.matchMedia && window.matchMedia('(orientation: portrait)').matches;
    var small = Math.min(screen.width || 9999, screen.height || 9999) < 820;
    var need = pref === 'land' && portrait && small && !locked;
    overlay.classList.toggle('on', need && !dismissed);
    document.body.style.overflow = overlay.classList.contains('on') ? 'hidden' : '';
  }

  var locked = false;
  var dismissed = false;

  function lock(mode) {
    if (!screen.orientation || typeof screen.orientation.lock !== 'function') return Promise.reject();
    return screen.orientation.lock(mode === 'land' ? 'landscape' : mode === 'port' ? 'portrait' : 'any')
      .then(function () { locked = mode !== 'auto'; })
      .catch(function () { locked = false; });
  }

  function fs(on) {
    try {
      if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) {
        return document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
      }
      if (!on && document.fullscreenElement && document.exitFullscreen) return document.exitFullscreen().catch(function () {});
    } catch (e) { /* 桌面/老浏览器没有全屏，忽略 */ }
    return Promise.resolve();
  }

  function set(mode, fromUser) {
    pref = mode;
    try { localStorage.setItem(KEY, mode); } catch (e) {}
    dismissed = false;
    locked = false;
    if (!fromUser) { paint(); return; }
    // 只有用户主动点才要全屏（浏览器要求锁方向必须在手势里、且多为全屏态）
    var seq = mode === 'auto'
      ? Promise.all([lock('auto'), fs(false)])
      : fs(true).then(function () { return lock(mode); });
    Promise.resolve(seq).then(function () {
      applyCss();
      paint();
      if (mode === 'land' && !locked) {
        // 锁不上：至少别让用户以为按钮坏了
        setTimeout(checkRotateHint, 60);
      }
    });
  }

  overlay.addEventListener('click', function (e) {
    var act = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!act) return;
    if (act.dataset.act === 'keep') {
      dismissed = true; overlay.classList.remove('on'); document.body.style.overflow = '';
      window.dispatchEvent(new Event('resize'));
    } else {
      set('port', true);
      overlay.classList.remove('on'); document.body.style.overflow = '';
    }
  });

  ready(function () {
    document.body.appendChild(bar);
    document.body.appendChild(overlay);
    // 页面自己已经有「全屏」按钮时别抢：只在面板里改状态
    if (pref !== 'auto') {
      // 回访直接恢复：不请求全屏（无手势会被拒），能锁就锁
      lock(pref).then(applyCss).catch(applyCss);
    } else {
      applyCss();
    }
    paint();
    window.addEventListener('resize', checkRotateHint);
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { checkRotateHint(); window.dispatchEvent(new Event('resize')); }, 260);
    });
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', function () {
        setTimeout(function () { checkRotateHint(); window.dispatchEvent(new Event('resize')); }, 160);
      });
    }
  });
})();
</script>
<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
