<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>蚀界方块 · 忘忘同人小游戏</title>
<meta name="description" content="照着《Slidey》和《Slydris》的玩法：盘面上本来就有方块，按住一块左右滑，上面的方块失去支撑会掉下来补空；松手算一步，底下的水就顶上来一整行。填满一行消掉，顶到天花板就结束。四界域配色、唤醒体头像，十二关递进加一个无尽关；每关评级打到 SSS 才算过，到手后可以接着玩也可以收手。">
<meta name="theme-color" content="#070b16">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231f2430%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%224.5%22%2F%3E%0A%20%20%3Cline%20x1%3D%2237.5%22%20y1%3D%2236.5%22%20x2%3D%2249%22%20y2%3D%2248%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%224%22%20fill%3D%22%23e8b04b%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
<style>
/* 这一页不引整站的 css/style.css：这里只要一个游戏壳。
   背景、方块、头像圆贴全部由 canvas 现画，整页只有一次脚本请求 + 四张头像。 */
:root{
  --bg:#0a0f1e; --panel:#141d33; --panel2:#1c2745; --line:rgba(150,185,255,.2);
  --text:#eef3ff; --dim:#93a3c4; --accent:#7cd8ff; --pink:#ff9ec4; --gold:#e3b341;
  --bad:#e8695f; --good:#57d8a0;
  --r:15px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:
    radial-gradient(78% 42% at 84% -8%,rgba(255,158,196,.16),transparent 62%),
    radial-gradient(72% 40% at 8% 2%,rgba(124,216,255,.18),transparent 58%),
    radial-gradient(130% 82% at 50% 104%,#17203f 0%,#080c1a 68%),
    var(--bg);
  color:var(--text);overflow:hidden;
  font:15px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.app{
  height:100dvh;max-width:560px;margin:0 auto;
  padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#scrPre{justify-content:center}
.scr[hidden]{display:none}

/* ---------------------------------------------------------------- 通用头 */
.shead{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.back{
  width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(18,27,50,.72);color:var(--text);
  text-decoration:none;font-size:16px;line-height:1;
}
.back:hover{border-color:var(--accent);color:var(--accent)}
.shead h1{margin:0;font-size:17px;letter-spacing:.02em}
.shead p{margin:1px 0 0;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .sp{flex:1}
.ico{
  width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(18,27,50,.72);color:var(--dim);font-size:15px;
}
.ico:hover{border-color:var(--accent);color:var(--accent)}
.ico.off{opacity:.42}

/* ---------------------------------------------------------------- 关卡列表 */
.lvlist{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:7px;padding:2px 2px 12px;
}
.lv{
  position:relative;
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--line);background:linear-gradient(150deg,rgba(24,36,64,.94),rgba(13,21,38,.94));
  transition:border-color .16s ease,transform .12s ease;
}
/* 卡片顶上的两只猫耳，跟方块呼应 */
.lv::before,.lv::after{
  content:"";position:absolute;top:-6px;width:13px;height:9.5px;pointer-events:none;
  background:linear-gradient(180deg,rgba(52,74,118,.98),rgba(26,38,66,.98));
  clip-path:polygon(50% 0,100% 100%,0 100%);
  transition:background .16s ease;
}
.lv::before{left:15px}
.lv::after{right:15px}
.lv:not(.lock):hover::before,.lv:not(.lock):hover::after{background:rgba(124,216,255,.5)}
.lv:not(.lock):hover{border-color:rgba(99,210,255,.5);transform:translateX(2px)}
.lv.lock{opacity:.44}
.lv .no{
  flex:0 0 34px;height:34px;border-radius:12px;display:grid;place-items:center;
  font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;
  background:linear-gradient(150deg,rgba(124,216,255,.4),rgba(255,158,196,.3));
  color:#f2fbff;border:1px solid rgba(170,225,255,.46);
  box-shadow:0 2px 10px rgba(90,160,255,.2),inset 0 1px 0 rgba(255,255,255,.22);
}
.lv.endless .no{background:rgba(227,179,65,.14);color:var(--gold);border-color:rgba(227,179,65,.32);font-size:17px}
.lv .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lv .meta b{font-size:14px;font-weight:650}
.lv .meta i{font-size:11px;color:var(--dim);font-style:normal}
.lv .meta em{font-size:11px;color:#7e90b2;font-style:normal}
.lv .rk{flex:0 0 auto;font-size:12px;color:var(--dim)}
.lv .rk b{
  display:inline-block;min-width:24px;text-align:center;font-size:15px;font-weight:800;font-style:italic;
  color:#8a93a8;border-radius:8px;padding:1px 0;
  background:rgba(255,255,255,.05);
}
.lv .rk b[data-k="S"]{color:#ffd45e}
.lv .rk b[data-k="SS"]{color:#a9e6ff;text-shadow:0 0 10px rgba(140,220,255,.35)}
.lv .rk b[data-k="SSS"]{color:#ffd45e;text-shadow:0 0 12px rgba(255,212,94,.55)}
.lv .rk b[data-k="A"]{color:#8fd0ff}
.lv .rk b[data-k="B"]{color:#9ee6b4}
.lv .rk b[data-k="C"]{color:#c9c2ae}
.lv .rk b.none{font-size:12px;font-style:normal;color:#5d6b88}
.sfoot{flex:0 0 auto;text-align:center;font-size:11px;color:#7486a8;padding:5px 0 3px;letter-spacing:.03em}

/* ---------------------------------------------------------------- 开战前的关卡面板 */
.precard{
  flex:0 1 auto;min-height:0;overflow-y:auto;
  padding:14px 15px 16px;border-radius:16px;
  border:1px solid rgba(120,170,240,.22);
  background:
    radial-gradient(120% 60% at 100% 0%,rgba(99,210,255,.10),transparent 60%),
    linear-gradient(160deg,rgba(24,37,66,.96),rgba(12,20,38,.96));
  box-shadow:0 14px 40px rgba(0,0,0,.35);
}
.ptitle{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.ptitle h2{margin:0;font-size:19px;letter-spacing:.02em}
.ptitle p{margin:0;font-size:11.5px;color:var(--dim)}
.pgoals{display:flex;gap:8px;margin-bottom:13px}
.pgoals span{
  flex:1;padding:7px 10px;border-radius:9px;font-size:12px;color:var(--dim);
  background:rgba(9,15,30,.55);border:1px solid rgba(120,170,240,.14);
}
.pgoals b{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.pgoals .phelp{
  flex:0 0 auto;padding:7px 10px;border-radius:9px;font-size:12px;color:#9fdcff;
  border:1px solid rgba(124,216,255,.3);background:rgba(124,216,255,.1);
  white-space:nowrap;
}
.pgoals .phelp:active{transform:translateY(1px)}
.precard h3{
  margin:14px 0 7px;font-size:12px;font-weight:600;color:#9fb0d0;letter-spacing:.06em;
  display:flex;align-items:center;gap:7px;
}
.precard h3::before{
  content:"";width:3px;height:11px;border-radius:2px;background:var(--accent);opacity:.85;
}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mod{
  padding:8px 10px;border-radius:10px;
  background:rgba(9,15,30,.5);border:1px solid rgba(120,170,240,.13);
}
.mod b{display:block;font-size:12.5px;color:#bfe4ff;margin-bottom:2px}
.mod p{margin:0;font-size:11px;line-height:1.45;color:#8fa1c0}
.row{display:flex;flex-wrap:wrap;gap:6px}
.pc{display:flex;flex-direction:column;align-items:center;gap:1px;width:52px}
.pc span{font-size:10px;color:var(--dim);letter-spacing:.02em}
.row canvas{border-radius:8px;background:rgba(9,15,30,.45)}
.pi{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  width:56px;padding:6px 2px;border-radius:9px;
  background:rgba(9,15,30,.5);border:1px solid rgba(120,170,240,.13);
}
.pi b{font-size:10px;font-weight:500;color:#93a5c4}
.pi .ic{width:22px;height:22px}
.tip{
  margin:12px 0 0;padding:8px 11px;border-radius:9px;font-size:11.5px;line-height:1.5;color:#a8b8d4;
  background:rgba(99,210,255,.07);border-left:2px solid rgba(99,210,255,.5);
}
.wake{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.wk{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 3px;border-radius:10px;
  background:rgba(9,15,30,.5);border:1px solid rgba(120,170,240,.16);
}
.wk img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--rc)}
.wk span{font-size:10px;color:#b6c5de;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prefoot{flex:0 0 auto;display:flex;gap:8px;padding-top:2px;margin-top:0}
.prefoot .ghost{
  flex:0 0 96px;padding:12px;border-radius:12px;font-size:13.5px;
  border:1px solid var(--line);background:rgba(16,26,48,.72);color:#a9b8d2;
}
.prefoot .ghost:hover{border-color:var(--accent);color:var(--accent)}
.primary{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px;border-radius:15px;font-size:14.5px;font-weight:700;color:#08131f;
  background:linear-gradient(135deg,#a9e8ff,#7cc8ff 46%,#ffb6d2);
  box-shadow:0 8px 26px rgba(110,190,255,.3);
}
.primary:active{transform:translateY(1px)}
.primary svg{width:15px;height:15px}

/* ---------------------------------------------------------------- 战斗 */
.play{gap:6px}
.hud{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.scbox{display:flex;align-items:baseline;gap:7px;min-width:0}
.scbox #rank{
  font-size:26px;font-weight:800;font-style:italic;line-height:1;
  color:#8a93a8;transition:color .3s ease;text-shadow:0 0 18px rgba(124,216,255,.26);
}
#rank[data-k="S"]{color:#ffd45e}
#rank[data-k="A"]{color:#8fd0ff}
#rank[data-k="B"]{color:#9ee6b4}
#rank[data-k="C"]{color:#c9c2ae}
#rank[data-k="D"]{color:#8a93a8}
#rank[data-k="SS"]{color:#a9e6ff;text-shadow:0 0 14px rgba(140,220,255,.4)}
.scbox #rank[data-k="SSS"]{
  font-size:19px;letter-spacing:-.02em;color:#ffd45e;
  text-shadow:0 0 16px rgba(255,205,90,.55);
}
.scbox #score{
  font-size:21px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
}
.hud .sp{flex:1}
.meta{display:flex;gap:12px}
.meta div{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.meta i{font-size:9.5px;color:var(--dim);font-style:normal;letter-spacing:.08em}
.meta b{font-size:12.5px;font-variant-numeric:tabular-nums;color:#cfdcf2}
.bar{flex:0 0 auto;height:3px;border-radius:2px;background:rgba(120,170,240,.13);overflow:hidden}
.bar i{
  display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,#4fb8ee,#9fe4ff);
  transition:width .3s ease;
}
.stage{
  flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;
  box-shadow:0 12px 40px rgba(90,140,255,.10),inset 0 0 0 1px rgba(160,200,255,.06);
}
#cv{display:block;width:100%;height:100%;touch-action:none}
/* 提示不再浮在棋盘上：小屏上那一条会正好压住最底一行。
   现在借底部那一行显示，关卡名和提示交替出现。 */
.lvname.hl{color:#9fe0ff;font-size:11px;letter-spacing:0}
.dock{flex:0 0 auto;display:flex;gap:8px;align-items:stretch}
.dock i{font-size:9.5px;color:var(--dim);font-style:normal;letter-spacing:.1em}
.itembox{
  flex:1;display:flex;align-items:center;gap:8px;min-width:0;
  padding:6px 9px;border-radius:14px;border:1px solid var(--line);background:rgba(18,27,50,.7);
}
#itemBar{display:flex;gap:8px;flex:1;justify-content:flex-start}
.slot{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  border:1px dashed rgba(150,185,255,.22);background:rgba(9,15,30,.42);color:#8b9bba;
}
.slot.has{
  border-style:solid;border-color:rgba(120,170,240,.34);color:#cfe0f8;
  background:linear-gradient(150deg,rgba(28,44,76,.9),rgba(15,24,44,.9));
}
.slot.has:hover{border-color:var(--accent);color:#fff}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,179,65,.24);color:#ffe9a8}
.slot:disabled{opacity:.5;cursor:default}
.slot .ic{width:21px;height:21px}
.lvname{flex:0 0 auto;text-align:center;font-size:10.5px;color:#8fa6cc;letter-spacing:.06em;padding-bottom:1px}

/* 造物图标：纯 CSS，省一次图片请求 */
.ic{
  width:22px;height:22px;display:block;position:relative;
}
.ic-hammer::before{
  content:"";position:absolute;left:3px;top:2px;width:12px;height:6px;border-radius:2px;
  background:currentColor;transform:rotate(-28deg);
}
.ic-hammer::after{
  content:"";position:absolute;left:9px;top:6px;width:3px;height:13px;border-radius:1.5px;
  background:currentColor;transform:rotate(-28deg);opacity:.75;
}
.ic-bomb::before{
  content:"";position:absolute;left:4px;top:6px;width:14px;height:14px;border-radius:50%;
  border:2px solid currentColor;
}
.ic-bomb::after{
  content:"";position:absolute;left:13px;top:2px;width:6px;height:6px;border-radius:50%;
  border:1.6px solid currentColor;border-right-color:transparent;border-bottom-color:transparent;
  transform:rotate(20deg);
}
.ic-flask::before{
  content:"";position:absolute;left:5px;top:2px;width:4px;height:5px;
  border:1.8px solid currentColor;border-bottom:0;
}
.ic-flask::after{
  content:"";position:absolute;left:2px;top:7px;width:0;height:0;
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:12px solid currentColor;opacity:.85;
}
.ic-clock::before{
  content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;
  border:2px solid currentColor;
}
.ic-clock::after{
  content:"";position:absolute;left:10.4px;top:7px;width:1.8px;height:6px;background:currentColor;
}
.ic-scroll::before{
  content:"";position:absolute;left:4px;top:4px;width:14px;height:14px;border-radius:3px;
  border:2px solid currentColor;
}
.ic-scroll::after{
  content:"";position:absolute;left:7.5px;top:8.5px;width:7px;height:1.8px;background:currentColor;
  box-shadow:0 3.4px 0 currentColor;
}

/* ---------------------------------------------------------------- 浮层 */
.ov{
  position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:22px;
  background:rgba(4,8,18,.76);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .22s ease;
}
.ov[hidden]{display:none}
.ov.on{opacity:1}
.card{
  width:100%;max-width:352px;padding:20px 18px;border-radius:18px;text-align:center;
  border:1px solid rgba(120,170,240,.26);
  background:linear-gradient(165deg,rgba(26,40,70,.98),rgba(11,18,36,.98));
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  transform:translateY(8px) scale(.985);transition:transform .26s cubic-bezier(.2,.9,.3,1.1);
}
.ov.on .card{transform:none}

/* ---- 新手教学（第一关自动弹一次） ---- */
.tutcard{text-align:left}
.tutno{
  margin:0 0 9px;font-size:11px;letter-spacing:.16em;color:#8093b8;text-align:center;
  font-variant-numeric:tabular-nums;
}
.tutart{
  position:relative;height:96px;margin-bottom:12px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(120,170,240,.18);
  background:radial-gradient(120% 110% at 50% 0%,rgba(96,176,255,.16),rgba(9,16,34,.55));
}
.tutart .ta{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;transition:opacity .22s ease;
}
.tutart .ta.on{opacity:1}
.tutart .tb{fill:rgba(124,216,255,.2);stroke:rgba(160,215,255,.6);stroke-width:1.3}
.tutart .tb.dim{fill:rgba(124,216,255,.1);stroke:rgba(150,200,255,.34)}
.tutart .tb.hot{fill:rgba(255,170,208,.3);stroke:#ffb6d2;stroke-width:1.6}
.tutart .tb.ghost{fill:rgba(255,255,255,.06);stroke:rgba(190,225,255,.5);stroke-dasharray:4 3}
.tutart .tb.rise{fill:rgba(124,216,255,.38);stroke:rgba(196,238,255,.9)}
.tutart .tb.full{fill:rgba(255,214,94,.26);stroke:#ffd45e}
.tutart .arw{fill:none;stroke:#9fdcff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tutart .spk{fill:none;stroke:#f4fff9;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(6,12,24,.55))}
.tutart .sss{
  fill:#ffd45e;font:900 30px/1 system-ui,-apple-system,"PingFang SC",sans-serif;
  font-style:italic;letter-spacing:.04em;filter:drop-shadow(0 0 8px rgba(255,205,90,.45));
}
.tutcard h3{font-size:16.5px;margin:0 0 6px}
.tutcard .why{font-size:13px;line-height:1.6;color:#a7b6d4;margin:0 0 14px;text-align:left}
.tutcard .prime{margin-bottom:6px}
.tutcard .link{width:100%}
.card .big{
  font-size:58px;font-weight:900;font-style:italic;line-height:1;margin:2px 0 4px;
  color:#8a93a8;letter-spacing:-.02em;
}
.card .big[data-k="S"]{color:#ffd45e;text-shadow:0 0 26px rgba(255,212,94,.4)}
.card .big[data-k="A"]{color:#8fd0ff;text-shadow:0 0 22px rgba(143,208,255,.34)}
.card .big[data-k="B"]{color:#9ee6b4}
.card .big[data-k="C"]{color:#c9c2ae}
.card .big[data-k="D"]{color:#7c879e}
.card .big[data-k="SS"]{color:#a9e6ff;text-shadow:0 0 22px rgba(140,220,255,.4)}
.card .big[data-k="SSS"]{
  font-size:46px;letter-spacing:.03em;
  background:linear-gradient(102deg,#fff6d0,#ffd45e 38%,#ffb04a 68%,#fff6d0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,205,90,.5));
  animation:sssPulse 1.9s ease-in-out infinite;
}
@keyframes sssPulse{
  0%,100%{filter:drop-shadow(0 0 12px rgba(255,205,90,.42))}
  50%{filter:drop-shadow(0 0 24px rgba(255,214,110,.72))}
}
.ssscard{
  border-color:rgba(255,212,94,.4);
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 46px rgba(255,200,80,.14);
}
.card h3{margin:0 0 3px;font-size:16px}
.card .why{margin:0 0 14px;font-size:11.5px;color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stats div{
  padding:8px;border-radius:10px;background:rgba(9,15,30,.5);
  border:1px solid rgba(120,170,240,.12);
}
.stats i{display:block;font-size:10px;color:var(--dim);font-style:normal;letter-spacing:.08em}
.stats b{font-size:16px;font-variant-numeric:tabular-nums}
.card .prime{
  width:100%;padding:11px;border-radius:14px;font-size:14px;font-weight:700;color:#08131f;
  background:linear-gradient(135deg,#a9e8ff,#7cc8ff 46%,#ffb6d2);margin-bottom:8px;
}
.card .minor{
  width:100%;padding:10px;border-radius:11px;font-size:13px;color:#a9b8d2;
  border:1px solid var(--line);background:rgba(16,26,48,.72);margin-bottom:8px;
}
.card .minor:hover{border-color:var(--accent);color:var(--accent)}
.card .link{font-size:12px;color:var(--dim);padding:6px}
.card .link:hover{color:var(--accent)}

/* ---------------------------------------------------------------- 载入守护 */
#boot{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;gap:10px;
  background:var(--bg);color:var(--dim);font-size:13px;
  transition:opacity .3s ease;
}
#boot.done{opacity:0;pointer-events:none}
#boot p{margin:0}

@media (max-height:680px){
  .precard{padding:11px 12px 13px}
  .precard h3{margin:10px 0 6px}
  .mod p{font-size:10.5px}
  .pi{width:50px}
}

(function () {
  var t0 = Date.now();
  setTimeout(function () {
    var t = document.getElementById('bootText');
    if (t) t.textContent = '还在画方块…（首次访问会慢一些）';
  }, 5000);
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (!b || Date.now() - t0 < 18000) return;
    b.innerHTML = '<p id="bootText">载入超时</p>';
    var btn = document.createElement('button');
    btn.textContent = '重新载入';
    btn.style.cssText = 'margin-top:10px;padding:7px 16px;border-radius:9px;border:1px solid #26355a;background:#16223c;color:#e8eefc;font:inherit;cursor:pointer';
    btn.onclick = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    b.appendChild(btn);
  }, 18000);
})();
</script>
<script type="module" src="js/b/block.js?v=adfd1f12bf"></script>
<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    /* 申请「持久存储」：图片缓存跟本地存档一样不被浏览器随手清掉 */
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  });
  /* sw.js 发现本机离线包是旧版（版本戳对不上）会喊一声。既然网站已经有新内容了，
     就给一条能点走的提示，别让人一直以为「离线版就是几个月前的样子」。
     局内（body.live）不弹：那会儿满屏都是判定框，任何浮层都是碍事。 */
  navigator.serviceWorker.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type !== 'offline-stale') return;
    if (/offline.html$/i.test(location.pathname)) return;
    if (document.body.classList.contains('live')) return;
    try { if (sessionStorage.getItem('zjtt-stale') === d.build) return; } catch (err) {}
    var a = document.createElement('a');
    a.href = 'offline.html';
    a.textContent = '本机离线包是旧版（' + String(d.stamp || '').slice(0, 8) + '）· 点这里更新';
    a.setAttribute('style', 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:99999;'
      + 'padding:7px 14px;border-radius:999px;font:600 12.5px/1.4 system-ui,sans-serif;text-decoration:none;'
      + 'color:#08111f;background:linear-gradient(180deg,#ffe9a8,#e3b341);box-shadow:0 6px 18px rgba(0,0,0,.38);'
      + 'max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis');
    a.addEventListener('click', function () {
      try { sessionStorage.setItem('zjtt-stale', d.build); } catch (err) {}
    });
    document.body.appendChild(a);
    /* 进局内就把提示收掉：横屏顶部正中间是发球点，浮层压在那里最碍事 */
    var obs = new MutationObserver(function () {
      if (document.body.classList.contains('live')) { a.remove(); obs.disconnect(); }
    });
    try { obs.observe(document.body, { attributes: true, attributeFilter: ['class'] }); } catch (err) {}
    setTimeout(function () { a.remove(); obs.disconnect(); }, 15000);
  });
}
</script>
