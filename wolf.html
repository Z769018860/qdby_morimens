<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弥萨格狼人杀 · 忘忘同人小游戏</title>
<meta name="description" content="《忘却前夜》同人狼人杀：你是守密人，其余位置由唤醒体扮演。12 种身份牌随机发，每只唤醒体在不同身份下有各自的说法、口癖和对别人的私心；还能当众号召有身份的人站出来。五档难度、随机阵容，可以反复开局；也能切到「快进」或「自动」，让这一局自己打完。">
<meta name="theme-color" content="#0a0d14">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23121826%22%2F%3E%3Cpath%20d%3D%22M32%2012c9%200%2016%207%2016%2016%200%2012-16%2024-16%2024S16%2040%2016%2028c0-9%207-16%2016-16z%22%20fill%3D%22none%22%20stroke%3D%22%23e3b341%22%20stroke-width%3D%223%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2228%22%20r%3D%224%22%20fill%3D%22%23e3b341%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
<style>
/* 这一页不引 css/style.css：整站那份 65KB 是给内容页的，游戏壳只要自己这一份。 */
:root{
  --bg:#0a0d14; --bg2:#0d1220; --panel:#121826; --panel2:#171f2e; --line:#26304a;
  --text:#e6e9f0; --dim:#8a93a8; --dim2:#5f6a80;
  --blue:#6ea8ff; --gold:#e3b341; --red:#e8656f; --violet:#a07cff; --green:#4fc98a;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef1f7; --bg2:#e7ebf4; --panel:#fff; --panel2:#f4f6fb; --line:#d7dce8;
    --text:#1b2130; --dim:#667088; --dim2:#8c96ab;
    --blue:#2c6fdb; --gold:#9a6f00; --red:#c8413a; --violet:#6b45c8; --green:#1f8a55;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(900px 520px at 18% -10%, color-mix(in oklab, var(--gold) 12%, transparent), transparent 68%),
    radial-gradient(760px 480px at 88% 6%, color-mix(in oklab, var(--violet) 14%, transparent), transparent 70%);
  background-repeat:no-repeat;
  transition:background-color .5s ease;
}
body.night{
  background-color:#070a12;
  background-image:
    radial-gradient(700px 420px at 50% -6%, color-mix(in oklab, var(--blue) 16%, transparent), transparent 70%),
    radial-gradient(900px 600px at 20% 110%, color-mix(in oklab, #14284d 55%, transparent), transparent 70%);
}
body.night::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(circle at 50% 45%, transparent 38%, rgba(0,0,0,.55) 100%);
  animation:fadeIn .8s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.app{
  position:relative; z-index:1; height:100dvh; max-width:1120px; margin:0 auto;
  padding:max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}
/* ---------------------------------------------------------------- 顶栏 */
.top{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.back{
  width:32px; height:32px; flex:0 0 32px; border-radius:9px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  text-decoration:none; font-size:15px; line-height:1;
}
.back:hover{border-color:var(--blue); color:var(--blue)}
.ttl{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.ttl b{font-size:15px; letter-spacing:.04em; white-space:nowrap}
.ttl span{font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag{
  margin-left:auto; height:32px; padding:0 10px; flex:0 0 auto; border-radius:9px;
  border:1px solid var(--line); background:var(--panel); color:var(--gold);
  font:inherit; font-size:11.5px; font-weight:600; letter-spacing:.06em;
  display:grid; place-items:center;
}
.tag[data-c="easy"]{color:var(--green); border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.tag[data-c="normal"]{color:var(--blue); border-color:color-mix(in srgb,var(--blue) 45%,var(--line))}
.tag[data-c="hard"]{color:#e09a4a; border-color:color-mix(in srgb,#e09a4a 45%,var(--line))}
.tag[data-c="mad"]{color:var(--red); border-color:color-mix(in srgb,var(--red) 50%,var(--line))}
.tag[data-c="abyss"]{color:var(--violet); border-color:color-mix(in srgb,var(--violet) 55%,var(--line))}
.ico{
  width:32px; height:32px; flex:0 0 32px; border-radius:9px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--dim);
  font:inherit; font-size:13px; cursor:pointer; padding:0;
}
.ico:hover{border-color:var(--blue); color:var(--blue)}
.ico.hide{display:none}

/* ---------------------------------------------------------------- 舞台 */
#stage{position:relative; flex:1 1 auto; min-height:0}
.scr{display:none; height:100%}
.scr.on{display:block}

/* ---------------------------------------------------------------- 标题页 */
#scr-title{overflow-y:auto; padding:4px 2px 10px}
.hero{text-align:center; padding:min(5vh,44px) 0 0}
.kicker{margin:0 0 10px; font-size:10.5px; letter-spacing:.34em; color:var(--dim2); text-transform:uppercase}
.hero h1{
  margin:0; font-size:clamp(30px,6vw,50px); letter-spacing:.12em; font-weight:800;
  background:linear-gradient(100deg,var(--text) 8%,var(--gold) 46%,var(--red) 88%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero .lead{
  margin:14px auto 0; max-width:34em; font-size:13.5px; line-height:1.85; color:var(--dim);
}
.hero .lead b{color:var(--text); font-weight:600}
.rule{width:56px; height:2px; margin:18px auto 0; border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--red)); opacity:.75}

.diffs{
  display:grid; gap:10px; grid-template-columns:repeat(5,minmax(0,1fr));
  margin:26px auto 0; max-width:1000px;
}
.diff{
  text-align:left; cursor:pointer; padding:13px 13px 12px; border-radius:14px;
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  font:inherit; transition:border-color .16s ease, transform .16s ease, background .16s ease;
}
.diff:hover{transform:translateY(-2px); border-color:var(--blue)}
.diff.on{border-color:var(--gold); background:var(--panel2); box-shadow:0 12px 26px -18px rgba(0,0,0,.9)}
.diff .dn{display:flex; align-items:center; gap:7px; font-size:15px; font-weight:700}
.diff .dot{width:7px; height:7px; border-radius:50%; background:var(--dim2)}
.diff[data-c="easy"] .dot{background:var(--green)}
.diff[data-c="normal"] .dot{background:var(--blue)}
.diff[data-c="hard"] .dot{background:#e09a4a}
.diff[data-c="mad"] .dot{background:var(--red)}
.diff[data-c="abyss"] .dot{background:var(--violet)}
.diff .ds{display:block; margin-top:3px; font-size:11.5px; color:var(--dim)}
.diff .dd{display:block; margin-top:7px; font-size:11.5px; line-height:1.6; color:var(--dim2)}

.startrow{display:flex; gap:10px; justify-content:center; margin:22px 0 0; flex-wrap:wrap}
.btn{
  appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  font:inherit; font-size:13.5px; padding:9px 18px; border-radius:11px; cursor:pointer;
  text-decoration:none; transition:border-color .16s ease, color .16s ease, opacity .16s ease;
}
.btn:hover{border-color:var(--blue); color:var(--blue)}
.btn.primary{
  background:linear-gradient(100deg,var(--gold),#d97a4a); border-color:transparent; color:#1a1206;
  font-weight:700; padding:11px 26px; font-size:14.5px;
}
.btn.primary:hover{opacity:.92; color:#1a1206}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px; font-size:12px; border-radius:9px}
.btn:disabled{opacity:.45; cursor:default}

.statline{margin:20px auto 0; text-align:center; font-size:11.5px; color:var(--dim2); line-height:1.9}
.statline b{color:var(--gold); font-weight:600}

/* ---------------------------------------------------------------- 游戏页 */
#scr-game{display:none}
#scr-game.on{display:grid}
.board-wrap{
  display:grid; gap:12px; grid-template-columns:minmax(0,1fr) 236px; height:100%; min-height:0;
}
.board{display:flex; flex-direction:column; min-height:0; min-width:0}
.feed{
  flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; gap:9px; padding:2px 6px 6px 2px;
  scroll-behavior:smooth; overscroll-behavior:contain;
}
.feed::-webkit-scrollbar{width:8px}
.feed::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px}

.msg{display:flex; gap:9px; align-items:flex-start; max-width:min(90%,620px); animation:pop .18s ease-out both}
@keyframes pop{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.msg .av{
  width:36px; height:36px; flex:0 0 36px; border-radius:11px; overflow:hidden;
  border:1px solid var(--line); background:var(--panel2);
}
.msg .av img{width:100%; height:100%; display:block; object-fit:cover}
.msg .body{
  min-width:0; border:1px solid var(--line);
  border-radius:4px 13px 13px 13px; padding:7px 12px 8px;
  /* --pc 是 JS 按席位写进来的：每人一个颜色，气泡、头像框、名字共用 */
  background:linear-gradient(180deg,color-mix(in oklab,var(--pc,var(--panel)) 16%,var(--panel)),var(--panel));
  border-color:color-mix(in srgb,var(--pc,var(--line)) 40%,var(--line));
}
.msg .av{border-color:color-mix(in srgb,var(--pc,var(--line)) 40%,var(--line))}
.msg .who > span:first-child{color:color-mix(in oklab,var(--pc,var(--text)) 70%,var(--text)); font-weight:600}
.msg.me{--pc:var(--gold)}
.msg.me .who > span:first-child{color:var(--gold)}
.msg .who{
  display:flex; align-items:center; gap:6px; margin-bottom:2px;
  font-size:11px; color:var(--dim); letter-spacing:.02em;
}
.msg .tx{font-size:14px; line-height:1.65; word-break:break-word}
.msg.me{margin-left:auto; flex-direction:row-reverse}
.msg.me .body{
  border-radius:13px 4px 13px 13px; border-color:color-mix(in srgb,var(--gold) 42%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 10%,var(--panel)),var(--panel));
}
.msg.me .who{flex-direction:row-reverse}
.msg.dead .body{opacity:.86; border-style:dashed}
.claim{
  font-size:10px; padding:0 7px; border-radius:999px; line-height:16px;
  border:1px solid currentColor; opacity:.9;
}
.claim[data-f="crew"]{color:var(--blue)}
.claim[data-f="wolf"]{color:var(--red)}
.claim[data-f="mole"]{color:#e09a4a}
.claim[data-f="third"]{color:var(--violet)}

/* 立场标签：这句是怀疑还是作保，扫一眼就知道 */
.stance{
  font-size:10px; padding:0 6px; border-radius:999px; line-height:16px;
  border:1px solid currentColor; opacity:.85;
}
.stance.warn{color:var(--red)}
.stance.good{color:var(--blue)}
.stance.gold{color:var(--gold)}
.stance.void{color:var(--violet)}
.stance.dim{color:var(--dim2)}
/* 台词里提到的名字 */
.msg .tx .nmhl{
  color:var(--text); font-weight:600;
  border-bottom:1px solid color-mix(in srgb,var(--gold) 42%,transparent);
}
.msg .why{margin-top:4px; font-size:11px; line-height:1.55; color:var(--dim2)}

.sys{
  align-self:center; max-width:84%; text-align:center;
  font-size:12px; line-height:1.75; color:var(--dim); padding:1px 0;
  animation:pop .2s ease-out both;
}
.sys.warn{color:var(--red)}
.divider{
  display:flex; align-items:center; gap:12px; margin:12px 0 3px;
  font-size:10.5px; letter-spacing:.3em; color:var(--gold); flex:0 0 auto;
}
.divider::before,.divider::after{
  content:""; flex:1 1 auto; height:1px;
  background:linear-gradient(90deg,transparent,var(--line),transparent);
}

.outcard{
  display:flex; align-items:center; gap:10px; max-width:min(92%,560px);
  padding:9px 12px; border-radius:12px; border:1px dashed color-mix(in srgb,var(--red) 55%,var(--line));
  background:color-mix(in srgb,var(--red) 9%,transparent); animation:pop .2s ease-out both;
}
.outcard .av{width:30px; height:30px; border-radius:9px; overflow:hidden; border:1px solid var(--line)}
.outcard .av img{width:100%; height:100%; display:block}
.outcard b{font-size:13px}
.outcard span{font-size:11.5px; color:var(--dim)}
.outcard .rl{color:var(--red); font-weight:600}

.tally{
  max-width:min(94%,600px); border:1px solid var(--line); background:var(--panel);
  border-radius:13px; padding:10px 12px; animation:pop .2s ease-out both;
}
.tally h4{margin:0 0 8px; font-size:11px; letter-spacing:.22em; color:var(--dim); font-weight:600}
.tally .rows{display:flex; flex-wrap:wrap; gap:6px}
.vchip{
  display:inline-flex; align-items:center; gap:4px; font-size:11.5px;
  padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:var(--panel2);
  color:var(--dim);
}
.vchip b{color:var(--text); font-weight:500}
.vchip i{font-style:normal; color:var(--dim2)}

/* ---------------------------------------------------------------- 操作区 */
.composer{flex:0 0 auto; padding:9px 2px 2px; display:flex; flex-direction:column; gap:8px}
.chint{font-size:11.5px; color:var(--dim); padding:0 2px}
.chint b{color:var(--gold); font-weight:600}
.acts{display:flex; gap:8px; flex-wrap:wrap}
.acts .btn{flex:0 0 auto}
.acts .btn.wide{flex:1 1 140px}
/* 节奏条：手动 / 快进 / 自动 */
.pace{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:2px; padding:7px 2px 0; border-top:1px solid var(--line);
}
.pace .seg{
  display:inline-flex; border:1px solid var(--line); border-radius:10px;
  overflow:hidden; background:var(--panel2);
}
.pace .pbtn{
  appearance:none; border:0; background:transparent; color:var(--dim);
  font:inherit; font-size:12px; padding:6px 13px; cursor:pointer;
  transition:background .16s ease, color .16s ease;
}
.pace .pbtn + .pbtn{border-left:1px solid var(--line)}
.pace .pbtn:hover{color:var(--text)}
.pace .pbtn.on{background:color-mix(in srgb,var(--gold) 15%,transparent); color:var(--gold); font-weight:700}
.pace .phint{flex:1 1 120px; min-width:0; font-size:11px; color:var(--dim2); line-height:1.5}
.chint.auto{display:flex; align-items:center; gap:6px}
.chint.auto b{color:var(--violet)}
.chint.auto span{flex:1 1 auto; min-width:0; color:var(--text)}
.chint.auto .btn{flex:0 0 auto}
.waitbar{
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim);
  padding:8px 2px;
}
.waitbar .dots{display:inline-flex; gap:3px}
.waitbar .dots i{width:4px; height:4px; border-radius:50%; background:var(--dim); animation:blink 1.2s infinite}
.waitbar .dots i:nth-child(2){animation-delay:.2s}
.waitbar .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------------------------------------------------------------- 名单 */
.roster{
  border-left:1px solid var(--line); padding-left:12px; min-height:0;
  display:flex; flex-direction:column; gap:3px; overflow-y:auto;
}
.roster h3{
  margin:2px 0 6px; font-size:10.5px; letter-spacing:.24em; color:var(--dim2); font-weight:600;
}
.pl{
  display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:10px;
  border:1px solid transparent; background:transparent; text-align:left; width:100%;
  font:inherit; color:var(--text); cursor:pointer;
}
.pl:hover{background:var(--panel); border-color:var(--line)}
.pl .av{width:26px; height:26px; flex:0 0 26px; border-radius:8px; overflow:hidden; border:1px solid var(--line)}
.pl .av img{width:100%; height:100%; display:block}
.pl .nm{
  font-size:12.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:color-mix(in oklab,var(--pc,var(--text)) 66%,var(--text));
}
.pl.me .nm{color:var(--gold)}
/* 从外面接进来的记录者：名字后面一个小 UP，不抢眼但要认得出 */
.pl .up{
  flex:0 0 auto; font-size:9px; line-height:1; letter-spacing:.04em; font-weight:700;
  padding:2px 3px; border-radius:4px; color:#0b0e14; background:var(--gold);
  transform:translateY(-1px);
}
.pl .cl{font-size:10px; color:var(--dim); margin-left:auto; flex:0 0 auto}
.pl.dead{opacity:.4}
.pl.dead .nm{text-decoration:line-through}
.pl.me{border-color:color-mix(in srgb,var(--gold) 50%,var(--line)); background:color-mix(in srgb,var(--gold) 8%,transparent)}
.pl .you{font-size:10px; color:var(--gold)}

/* ---------------------------------------------------------------- 弹层 */
.sheet{
  position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:16px;
  background:rgba(4,7,12,.72); backdrop-filter:blur(3px); animation:fadeIn .16s ease;
}
.sheet-in{
  width:min(560px,100%); max-height:88vh; overflow-y:auto; padding:18px;
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.9); animation:rise .2s ease-out;
}
@keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.sheet-in h3{margin:0 0 4px; font-size:16px}
.sheet-in .sub{margin:0 0 12px; font-size:12px; color:var(--dim); line-height:1.7}
.pickgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:8px}
.pick{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px 8px;
  border:1px solid var(--line); border-radius:13px; background:var(--panel2);
  color:var(--text); font:inherit; font-size:12px; cursor:pointer; text-align:center;
}
.pick:hover{border-color:var(--blue)}
.pick img,.pick .av{width:46px; height:46px; border-radius:12px; display:block; object-fit:cover; border:1px solid var(--line)}
.pick .rn{font-size:10.5px; color:var(--dim)}
.pick.tied{border-color:var(--gold)}

/* ---------------------------------------------------------------- 记录（便签 / 往期投票 / 纪要） */
.rec{min-height:180px}
.rechead{display:flex; align-items:center; gap:10px}
.rechead h3{margin:0; flex:1 1 auto; font-size:16px}
.recx{
  width:28px; height:28px; flex:0 0 28px; border-radius:8px; padding:0; line-height:1;
  border:1px solid var(--line); background:var(--panel2); color:var(--dim);
  font:inherit; font-size:16px; cursor:pointer;
}
.recx:hover{border-color:var(--blue); color:var(--blue)}
.tabs{display:flex; gap:6px; margin:12px 0 12px; border-bottom:1px solid var(--line)}
.tab{
  appearance:none; border:1px solid transparent; border-bottom:0; border-radius:9px 9px 0 0;
  background:transparent; color:var(--dim); font:inherit; font-size:12.5px;
  padding:7px 14px; cursor:pointer; position:relative; top:1px;
}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel2); border-color:var(--line); color:var(--gold); font-weight:700}

.nrow{
  display:grid; grid-template-columns:28px minmax(0,1fr) auto; gap:6px 9px; align-items:center;
  padding:8px 9px 9px; margin-bottom:7px; border-radius:12px; border:1px solid var(--line);
  background:color-mix(in oklab,var(--pc,var(--panel)) 6%,var(--panel));
  transition:border-color .3s ease, box-shadow .3s ease;
}
.nrow.flash{border-color:var(--gold); box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 28%,transparent)}
.nrow.dead{opacity:.6}
.nrow img{width:28px; height:28px; border-radius:9px; border:1px solid var(--line); display:block}
.nmain{min-width:0}
.nmain b{
  display:block; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:color-mix(in oklab,var(--pc,var(--text)) 62%,var(--text));
}
.nmain span{font-size:10.5px; color:var(--dim2)}
.nseg{
  display:inline-flex; flex:0 0 auto; border:1px solid var(--line); border-radius:9px;
  overflow:hidden; background:var(--panel2);
}
.nb{

<body>
<div class="app">
  <header class="top">
    <a class="back" href="index.html" aria-label="返回项目列表">←</a>

<script type="module" src="js/b/wolf.js?v=5533b4f944"></script>
<!-- 横屏 / 竖屏：所有小游戏共用的一块 UI 与逻辑，构建时注入到每个游戏页 </body> 前。
     为什么放在这里而不是各页面各写一份：七个游戏的头部结构完全不一样，
     但「现在该用哪个方向」这件事是同一件——所以只留一份，改一次全站生效。
     行为：
       · 记在每个游戏自己的键上（zjtt:orient:<游戏>），换游戏不会互相影响
       · 优先用 screen.orientation.lock 真正锁方向（Chrome / PWA / 桌面版可用）
       · 锁不住（iOS Safari、桌面浏览器）时：横屏但手机竖着 → 提示「把手机横过来」
       · 改完方向补一次 resize，canvas 游戏会按新尺寸重排 -->
<style>
.zj-orient{
  position:fixed; left:10px; bottom:10px; z-index:80;
  display:flex; align-items:center; gap:2px; padding:3px;
  background:rgba(18,23,33,.82); border:1px solid rgba(150,165,195,.28);
  border-radius:11px; backdrop-filter:blur(6px);
  font:12px/1 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#c8d1e3; box-shadow:0 10px 24px -14px #000;
}
.zj-orient button{
  appearance:none; border:0; background:none; cursor:pointer;
  color:inherit; font:inherit; padding:5px 8px; border-radius:8px;
  display:flex; align-items:center; gap:4px;
}
.zj-orient button:hover{background:rgba(120,150,210,.16)}
.zj-orient button.on{background:rgba(110,168,255,.2); color:#dfe8ff}
.zj-orient .sep{width:1px; height:14px; background:rgba(150,165,195,.25)}
.zj-orient .lbl{font-size:10.5px; opacity:.62; padding:0 3px}
/* 窄屏：只剩一颗循环切换的小钮，别压住游戏底部的摇杆 / 预览条 */
.zj-orient.narrow{padding:2px; gap:0}
.zj-orient.narrow button{padding:6px 7px; line-height:1}
@media (max-width:720px){ .zj-orient{bottom:8px; left:8px; padding:2px} .zj-orient .lbl{display:none} }

.zj-rot{
  position:fixed; inset:0; z-index:9999; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:14px;
  background:rgba(8,11,18,.94); color:#e6e9f0; text-align:center; padding:24px;
  font:14px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.zj-rot.on{display:flex}
.zj-rot svg{width:64px; height:64px; opacity:.85; animation:zjrot 2.4s ease-in-out infinite}
@keyframes zjrot{0%,45%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
.zj-rot b{font-size:16px}
.zj-rot p{margin:0; max-width:22em; color:#98a3ba; font-size:13px}
.zj-rot .acts{display:flex; gap:10px; margin-top:4px}
.zj-rot button{
  appearance:none; font:inherit; font-size:13px; padding:8px 16px; border-radius:9px;
  border:1px solid rgba(150,165,195,.3); background:rgba(30,37,50,.9); color:#dfe6f5; cursor:pointer;
}
.zj-rot button.pri{background:linear-gradient(100deg,#6ea8ff,#a07cff); border-color:transparent; color:#fff}
</style>
<script>
(function () {
  'use strict';
  var path = location.pathname;
  var file = (path.split('/').pop() || '').replace(/\.html?$/i, '');
  var game = /\/idle\//.test(path) ? 'idle'
    : /\/deathreport\//.test(path) ? 'deathreport'
    : (file || 'index');
  var KEY = 'zjtt:orient:' + game;
  var MODES = [
    { k: 'auto', t: '自动', icon: '⟲' },
    { k: 'land', t: '横屏', icon: '▭' },
    { k: 'port', t: '竖屏', icon: '▯' }
  ];

  function read() {
    try { return localStorage.getItem(KEY) || 'auto'; } catch (e) { return 'auto'; }
  }
  var pref = read();
  var baseTitle = document.title;

  // 窄屏（手机）上游戏画面本来就挤，左下角只留一颗小圆钮，点一下循环切换；
  // 宽屏才摊开成三个按钮。判定只在加载时做一次，避免旋屏时反复重建 DOM。
  var mqNarrow = window.matchMedia ? window.matchMedia('(max-width:720px)') : null;
  var narrow = !!(mqNarrow && mqNarrow.matches);

  // ---- UI
  var bar = document.createElement('div');
  bar.className = 'zj-orient';
  bar.setAttribute('role', 'group');
  bar.setAttribute('aria-label', '游玩方向');

  function modeOf(k) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].k === k) return MODES[i];
    return MODES[0];
  }

  function buildBar() {
    bar.innerHTML = '';
    if (narrow) {
      bar.classList.add('narrow');
      var cur = modeOf(pref);
      var b1 = document.createElement('button');
      b1.type = 'button';
      b1.dataset.k = cur.k;
      b1.className = 'on';
      b1.title = '方向：' + cur.t + '（点一下换）';
      b1.setAttribute('aria-label', '游玩方向：' + cur.t + '，点按切换');
      b1.innerHTML = '<span aria-hidden="true">' + cur.icon + '</span>';
      b1.addEventListener('click', function () {
        var i = MODES.map(function (m) { return m.k; }).indexOf(pref);
        set(MODES[(i + 1) % MODES.length].k, true);
      });
      bar.appendChild(b1);
      return;
    }
    bar.innerHTML = '<span class="lbl">方向</span>';
    MODES.forEach(function (m) {
      var b = document.createElement('button');
      b.type = 'button';
      b.dataset.k = m.k;
      b.title = m.t === '自动' ? '跟随手机方向' : ('锁定' + m.t);
      b.innerHTML = '<span aria-hidden="true">' + m.icon + '</span><span>' + m.t + '</span>';
      b.addEventListener('click', function () { set(m.k, true); });
      bar.appendChild(b);
    });
  }
  buildBar();

  var overlay = document.createElement('div');
  overlay.className = 'zj-rot';
  overlay.innerHTML = [
    '<svg viewBox="0 0 24 24" fill="none" stroke="#c8d1e3" stroke-width="1.4" stroke-linecap="round">',
    '<rect x="6.5" y="2.5" width="11" height="19" rx="2.4"/>',
    '<path d="M10 5.4h4"/><circle cx="12" cy="18.4" r="1.05" fill="#c8d1e3" stroke="none"/>',
    '</svg>',
    '<b>把手机横过来</b>',
    '<p>这个游戏按横屏排版。手机系统不让网页锁方向时，转一下机身就好；不想转也可以先竖着玩。</p>',
    '<div class="acts"><button type="button" class="pri" data-act="keep">已经横过来了</button>',
    '<button type="button" data-act="port">仍要竖屏玩</button></div>'
  ].join('');

  function ready(fn) {
    if (document.body) fn();
    else document.addEventListener('DOMContentLoaded', fn, { once: true });
  }

  function applyCss() {
    var r = document.documentElement;
    if (pref === 'auto') r.removeAttribute('data-orient');
    else r.setAttribute('data-orient', pref);
    document.dispatchEvent(new CustomEvent('zj:orient', { detail: { mode: pref } }));
    setTimeout(function () {
      window.dispatchEvent(new Event('resize'));
      if (window.visualViewport) window.dispatchEvent(new Event('resize'));
    }, 80);
  }

  function paint() {
    if (narrow) {
      var cur = modeOf(pref);
      var only = bar.querySelector('button');
      if (only) {
        only.dataset.k = cur.k;
        only.title = '方向：' + cur.t + '（点一下换）';
        only.setAttribute('aria-label', '游玩方向：' + cur.t + '，点按切换');
        only.innerHTML = '<span aria-hidden="true">' + cur.icon + '</span>';
      }
    } else {
      [].forEach.call(bar.querySelectorAll('button'), function (b) {
        b.classList.toggle('on', b.dataset.k === pref);
        b.setAttribute('aria-pressed', b.dataset.k === pref ? 'true' : 'false');
      });
    }
    checkRotateHint();
  }

  // 锁定失败 + 手机竖着 = 给个转屏提示；已锁住时系统自己会转，不用提示
  function checkRotateHint() {
    var portrait = window.matchMedia && window.matchMedia('(orientation: portrait)').matches;
    var small = Math.min(screen.width || 9999, screen.height || 9999) < 820;
    var need = pref === 'land' && portrait && small && !locked;
    overlay.classList.toggle('on', need && !dismissed);
    document.body.style.overflow = overlay.classList.contains('on') ? 'hidden' : '';
  }

  var locked = false;
  var dismissed = false;

  function lock(mode) {
    if (!screen.orientation || typeof screen.orientation.lock !== 'function') return Promise.reject();
    return screen.orientation.lock(mode === 'land' ? 'landscape' : mode === 'port' ? 'portrait' : 'any')
      .then(function () { locked = mode !== 'auto'; })
      .catch(function () { locked = false; });
  }

  function fs(on) {
    try {
      if (on && document.documentElement.requestFullscreen && !document.fullscreenElement) {
        return document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(function () {});
      }
      if (!on && document.fullscreenElement && document.exitFullscreen) return document.exitFullscreen().catch(function () {});
    } catch (e) { /* 桌面/老浏览器没有全屏，忽略 */ }
    return Promise.resolve();
  }

  function set(mode, fromUser) {
    pref = mode;
    try { localStorage.setItem(KEY, mode); } catch (e) {}
    dismissed = false;
    locked = false;
    if (!fromUser) { paint(); return; }
    // 只有用户主动点才要全屏（浏览器要求锁方向必须在手势里、且多为全屏态）
    var seq = mode === 'auto'
      ? Promise.all([lock('auto'), fs(false)])
      : fs(true).then(function () { return lock(mode); });
    Promise.resolve(seq).then(function () {
      applyCss();
      paint();
      if (mode === 'land' && !locked) {
        // 锁不上：至少别让用户以为按钮坏了
        setTimeout(checkRotateHint, 60);
      }
    });
  }

  overlay.addEventListener('click', function (e) {
    var act = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!act) return;
    if (act.dataset.act === 'keep') {
      dismissed = true; overlay.classList.remove('on'); document.body.style.overflow = '';
      window.dispatchEvent(new Event('resize'));
    } else {
      set('port', true);
      overlay.classList.remove('on'); document.body.style.overflow = '';
    }
  });

  ready(function () {
    document.body.appendChild(bar);
    document.body.appendChild(overlay);
    // 页面自己已经有「全屏」按钮时别抢：只在面板里改状态
    if (pref !== 'auto') {
      // 回访直接恢复：不请求全屏（无手势会被拒），能锁就锁
      lock(pref).then(applyCss).catch(applyCss);
    } else {
      applyCss();
    }
    paint();
    window.addEventListener('resize', checkRotateHint);
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { checkRotateHint(); window.dispatchEvent(new Event('resize')); }, 260);
    });
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', function () {
        setTimeout(function () { checkRotateHint(); window.dispatchEvent(new Event('resize')); }, 160);
      });
    }
  });
})();
</script>
<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
