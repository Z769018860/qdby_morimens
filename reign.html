<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弥萨格王权 · 忘忘同人小游戏</title>
<meta name="description" content="《忘却前夜》同人「王权」玩法：你是弥萨格大学的守密人，每天都有一个人走到桌前提要求，你只能准或不准，两个按钮上写着这一下会动哪几笔账。62 名唤醒体 + 9 位主播 + 一只校猫，近三百张公文，三十个结局（含七个恶搞）。记忆、理智、银芯、羁绊任一见底或涨满，这一任就结束了。">
<meta name="theme-color" content="#0b0910">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23120f18%22%2F%3E%3Cpath%20d%3D%22M14%2026l6-10%2012%207%2012-7%206%2010v8H14z%22%20fill%3D%22none%22%20stroke%3D%22%23e3b341%22%20stroke-width%3D%222.6%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M18%2038h28v6H18z%22%20fill%3D%22%23e3b341%22%20opacity%3D%22.75%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
<style>
/* 这一页不引 css/style.css：整站那份是给内容页的，游戏壳只要自己这一份。
   配色沿用站内的深色底 + 金 / 紫，但整体压得更暗——这一局大部分时间在夜里。 */
:root{
  --bg:#0b0910; --bg2:#100d16; --panel:#16121d; --panel2:#1d1826; --line:#2b2436;
  --text:#ece8f2; --dim:#9a92a8; --dim2:#6b6478;
  --gold:#e3b341; --red:#e0575f; --violet:#a67cff; --blue:#6ea8ff; --teal:#46b6c8;
  --mem:#a67cff; --san:#6ea8ff; --core:#e3b341; --bond:#e0575f;
  --shadow:0 30px 60px -30px rgba(0,0,0,.95), 0 2px 0 rgba(255,255,255,.03) inset;
  --cw:min(360px,86vw);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden;
  font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(760px 520px at 12% -8%, rgba(166,124,255,.16), transparent 66%),
    radial-gradient(700px 480px at 92% 4%, rgba(227,179,65,.10), transparent 68%),
    radial-gradient(900px 700px at 50% 118%, rgba(70,182,200,.10), transparent 70%);
  background-repeat:no-repeat;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(circle at 50% 42%, transparent 42%, rgba(0,0,0,.62) 100%);
}
.app{
  position:relative; z-index:1; height:100dvh; max-width:720px; margin:0 auto;
  padding:max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px;
}

/* ---------------------------------------------------------------- 顶栏 */
.top{display:flex; align-items:center; gap:8px; flex:0 0 auto}
.back{
  width:32px; height:32px; flex:0 0 32px; border-radius:9px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  text-decoration:none; font-size:15px; line-height:1;
}
.back:hover{border-color:var(--gold); color:var(--gold)}
.ttl{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.ttl b{font-size:15px; letter-spacing:.06em; white-space:nowrap}
.ttl span{font-size:10.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip{
  margin-left:auto; height:30px; padding:0 10px; flex:0 0 auto; border-radius:9px;
  border:1px solid var(--line); background:var(--panel); color:var(--gold);
  font-size:11.5px; font-weight:600; letter-spacing:.04em; display:grid; place-items:center;
  white-space:nowrap;
}
.ico{
  width:32px; height:32px; flex:0 0 32px; border-radius:9px; display:grid; place-items:center;
  border:1px solid var(--line); background:var(--panel); color:var(--dim);
  font:inherit; font-size:13px; cursor:pointer; padding:0;
}
.ico:hover{border-color:var(--gold); color:var(--gold)}
.ico.off{opacity:.45}

/* ---------------------------------------------------------------- 潮汐倒计时 */
/* 潮汐是这一局唯一写死的截止日：摆在四条属性上面，省得玩家自己去算第几天该攒钱。 */
.ddl{display:none; align-items:center; gap:8px; flex:0 0 auto; padding:0 2px}
.ddl.on{display:flex}
.ddl .dk{font-size:10px; letter-spacing:.14em; color:#8d7fb0; white-space:nowrap}
.ddl .dtrack{flex:1 1 auto; height:3px; border-radius:3px; background:rgba(166,124,255,.14); overflow:hidden}
.ddl .dtrack i{display:block; height:100%; border-radius:3px;
  background:linear-gradient(90deg,#5a4a8e,#a67cff); transition:width .45s cubic-bezier(.2,.8,.3,1)}
.ddl .dv{font-size:10.5px; font-weight:600; letter-spacing:.04em; color:#c9b0ff;
  white-space:nowrap; font-variant-numeric:tabular-nums}
.ddl.near .dk{color:#ff9ba0}
.ddl.near .dv{color:#ff8f95; animation:pulse 1.4s ease-in-out infinite}
.ddl.near .dtrack i{background:linear-gradient(90deg,#a67cff,#ff6b8a)}
@keyframes pulse{50%{opacity:.45}}

/* ---------------------------------------------------------------- 数值条 */
.meters{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; flex:0 0 auto}
.mtr{
  display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:10px;
  background:var(--panel); border:1px solid var(--line); min-width:0;
  transition:border-color .25s ease, background .25s ease;
}
.mico{color:var(--dim); display:grid; place-items:center; flex:0 0 auto}
.mtr[data-k="mem"] .mico{color:var(--mem)}
.mtr[data-k="san"] .mico{color:var(--san)}
.mtr[data-k="core"] .mico{color:var(--core)}
.mtr[data-k="bond"] .mico{color:var(--bond)}
.mbody{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1 1 auto}
.mrow{display:flex; align-items:baseline; gap:5px; justify-content:space-between}
.mn{font-size:11px; font-weight:600; color:var(--dim); letter-spacing:.04em; white-space:nowrap}
.mv{font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--text)}
.bar{height:4px; border-radius:3px; background:rgba(255,255,255,.07); overflow:hidden; display:block}
.bar i{display:block; height:100%; width:50%; border-radius:3px; transition:width .42s cubic-bezier(.2,.8,.3,1)}
.mtr.low{border-color:rgba(224,87,95,.55); background:rgba(224,87,95,.08)}
.mtr.low .mv{color:#ff8f95}
.mtr.high{border-color:rgba(227,179,65,.5)}
.mtr.dead{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

.tidebar{display:flex; align-items:center; gap:8px; flex:0 0 auto; padding:0 2px}
.tidebar span{font-size:10.5px; letter-spacing:.14em; color:var(--dim2); white-space:nowrap}
.tbar{flex:1 1 auto; height:3px; border-radius:3px; background:rgba(166,124,255,.13); overflow:hidden}
.tbar i{display:block; height:100%; width:6%; background:linear-gradient(90deg,#6a4ec9,#a67cff);
  box-shadow:0 0 10px rgba(166,124,255,.7); transition:width .5s ease}
.tidebar.high span{color:#c9b0ff}
.tidebar.high .tbar i{background:linear-gradient(90deg,#a67cff,#ff6b8a)}

/* ---------------------------------------------------------------- 舞台 */
#stage{position:relative; flex:1 1 auto; min-height:0}
.scr{display:none; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch}
.scr.on{display:block}
#scr-play.on{display:flex; flex-direction:column; overflow:hidden}

/* ---------------------------------------------------------------- 标题页 */
.titleshell{padding:min(4vh,38px) 4px 20px; text-align:center; min-height:100%;
  display:flex; flex-direction:column; justify-content:center}
.kicker{margin:0 0 10px; font-size:10px; letter-spacing:.36em; color:var(--dim2); text-transform:uppercase}
.hero h1{
  margin:0; font-size:clamp(34px,7.4vw,58px); letter-spacing:.14em; font-weight:800;
  background:linear-gradient(102deg,#f3eede 6%,var(--gold) 44%,#b4763f 78%,var(--violet) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 12px 30px rgba(227,179,65,.16));
}
.hero .sub{margin:6px 0 0; font-size:12px; letter-spacing:.24em; color:var(--dim)}
.hero .lead{margin:16px auto 0; max-width:32em; font-size:13.5px; line-height:2; color:var(--dim)}
.hero .lead b{color:var(--text); font-weight:600}
.hero .lead .four{color:var(--gold); letter-spacing:.14em; font-size:12.5px; font-weight:600}

.diffs{display:grid; gap:10px; grid-template-columns:repeat(3,minmax(0,1fr)); margin:26px auto 0; max-width:780px}
.diff{
  text-align:left; cursor:pointer; padding:13px 13px 12px; border-radius:14px;
  background:var(--panel); border:1px solid var(--line); color:var(--text); font:inherit;
  transition:border-color .16s ease, transform .16s ease, background .16s ease;
}
.diff:hover{transform:translateY(-2px); border-color:var(--gold); background:var(--panel2)}
.diff b{display:block; font-size:15px; letter-spacing:.06em}
.diff .dd{display:block; margin-top:3px; font-size:11.5px; color:var(--gold)}
.diff .dx{display:block; margin-top:7px; font-size:11.5px; line-height:1.7; color:var(--dim2)}

.startrow{display:flex; gap:10px; justify-content:center; margin:22px 0 0; flex-wrap:wrap}
.btn{
  appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  font:inherit; font-size:13.5px; padding:10px 18px; border-radius:11px; cursor:pointer;
  text-decoration:none; transition:border-color .16s ease, color .16s ease, opacity .16s ease;
}
.btn:hover{border-color:var(--gold); color:var(--gold)}
.btn.primary{
  background:linear-gradient(100deg,var(--gold),#d0854a); border-color:transparent; color:#1a1206;
  font-weight:700; padding:11px 26px; font-size:14.5px;
}
.btn.primary:hover{opacity:.92; color:#1a1206}
.btn.ghost{background:transparent}
.bestline{margin:16px 0 0; font-size:11.5px; color:var(--dim2); letter-spacing:.04em}
.discl{margin:22px auto 0; max-width:34em; font-size:10.5px; line-height:1.9; color:var(--dim2)}

/* ---------------------------------------------------------------- 卡片 */
#scr-play{position:relative}
.deckwrap{position:relative; flex:1 1 auto; min-height:0; display:grid; place-items:center}
.deck{width:100%; height:100%; display:grid; place-items:center; padding:4px 0; min-height:0}
.card{
  position:relative; width:var(--cw); height:min(100%,560px);
  max-height:calc(100% - 2px); border-radius:20px; overflow:hidden;
  background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
  display:flex; flex-direction:column; touch-action:none; cursor:grab;
  transform:translateY(14px) scale(.97); opacity:0;
  transition:transform .3s cubic-bezier(.2,.8,.3,1), opacity .3s ease;
  will-change:transform;
}
.card.in{transform:none; opacity:1}
.card:active{cursor:grabbing}
.card.is-tide{border-color:rgba(166,124,255,.6); box-shadow:0 0 0 1px rgba(166,124,255,.25), var(--shadow)}
.face{position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#0d0b12}
.face img.art{width:100%; height:100%; object-fit:cover; object-position:50% 8%; display:block; user-select:none}
.face .artmask{
  position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(11,9,16,.18) 0%, rgba(11,9,16,0) 34%, rgba(22,18,29,.86) 82%, var(--panel) 100%);
}
.face .sigil{
  position:absolute; inset:0; display:grid; place-items:center; color:rgba(227,179,65,.55);
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.028) 0 2px, transparent 2px 9px),
    radial-gradient(circle at 50% 42%, rgba(227,179,65,.10), transparent 62%);
}
.face .sigil svg{width:104px; height:104px; filter:drop-shadow(0 6px 24px rgba(227,179,65,.35))}
.face .sigil.tide-sig{color:rgba(166,124,255,.6); background:
  repeating-linear-gradient(135deg, rgba(166,124,255,.05) 0 2px, transparent 2px 9px),
  radial-gradient(circle at 50% 40%, rgba(166,124,255,.14), transparent 64%)}
.kind{
  position:absolute; top:10px; left:10px; padding:3px 9px; border-radius:999px;
  font-size:10px; letter-spacing:.14em; background:rgba(11,9,16,.7); border:1px solid currentColor;
}
.kind.tide{color:#c9b0ff}
.kind.sys{color:rgba(227,179,65,.8)}
.realm{
  position:absolute; top:10px; right:10px; padding:3px 9px; border-radius:999px;
  font-size:10px; letter-spacing:.12em; color:var(--rc);
  background:rgba(11,9,16,.66); border:1px solid var(--rc); opacity:.9;
}
.bubble{position:absolute; left:0; right:0; bottom:0; padding:16px 18px 15px}
.say{margin:0; font-size:16px; line-height:1.78; letter-spacing:.01em; text-wrap:pretty}
.name{display:flex; align-items:baseline; gap:8px; margin-top:12px; padding-top:10px;
  border-top:1px solid rgba(255,255,255,.09)}
.name b{font-size:13.5px; letter-spacing:.08em; color:var(--gold)}
.name span{font-size:10.5px; color:var(--dim2); letter-spacing:.06em}

/* 拖拽提示 */
.hint{
  position:absolute; top:50%; transform:translateY(-50%); font-size:12px; letter-spacing:.2em;
  padding:8px 12px; border-radius:10px; border:1px solid currentColor; opacity:0;
  transition:opacity .16s ease; pointer-events:none; background:rgba(11,9,16,.7);
}
.hint.on{opacity:1}
.hint{z-index:3}
.hint.l{left:6px; color:var(--red)}
.hint.r{right:6px; color:var(--gold)}

/* 选择按钮 */
.choices{display:grid; grid-template-columns:1fr 1fr; gap:10px; flex:0 0 auto; padding:10px 0 2px;
  width:var(--cw); margin:0 auto; transition:opacity .18s ease}
.choices.hide{opacity:0; pointer-events:none}
.ch{
  appearance:none; cursor:pointer; padding:9px 10px 8px; border-radius:13px; font:inherit;
  font-size:13.5px; line-height:1.3; text-align:center; min-height:54px;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  transition:border-color .16s ease, background .16s ease, transform .1s ease;
}
.ch:active{transform:scale(.985)}
.ch em{font-style:normal; font-size:10px; letter-spacing:.16em; opacity:.55}
.chrow{display:flex; align-items:center; gap:6px}
.cl{font-weight:600; letter-spacing:.02em}
/* 按钮上那几枚小字：这一下会动哪几笔账 */
.cfx{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; min-height:14px}
.cfx i{
  font-style:normal; font-size:9.5px; line-height:1.6; padding:0 5px; border-radius:5px;
  letter-spacing:.02em; white-space:nowrap; font-variant-numeric:tabular-nums;
}
.cfx i.up{color:#8fe3bb; background:rgba(127,220,176,.12)}
.cfx i.down{color:#ffaab0; background:rgba(255,155,160,.12)}
.cfx i.tide{color:#c9b0ff; background:rgba(166,124,255,.14)}
.cfx i.none{color:var(--dim2); background:rgba(255,255,255,.04)}
.ch.no{color:#ffb1b5; border-color:rgba(224,87,95,.32); background:rgba(224,87,95,.06)}
.ch.no:hover{border-color:var(--red); background:rgba(224,87,95,.12)}
.ch.yes{color:#f3d99a; border-color:rgba(227,179,65,.34); background:rgba(227,179,65,.07)}
.ch.yes:hover{border-color:var(--gold); background:rgba(227,179,65,.13)}
.choices.lock .ch{opacity:.4; pointer-events:none}

/* 反应回执 */
.reply{
  width:var(--cw); max-height:100%; overflow:auto; border-radius:18px;
  background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
  box-shadow:var(--shadow); padding:18px 18px 14px; opacity:0; transform:translateY(10px);
  transition:opacity .26s ease, transform .26s ease;
}
.reply.in{opacity:1; transform:none}
.reply.y{border-color:rgba(227,179,65,.36)}
.reply.n{border-color:rgba(224,87,95,.36)}
.rhead{display:flex; flex-direction:column; gap:5px; padding-bottom:10px; border-bottom:1px dashed var(--line)}
.rk{font-size:10px; letter-spacing:.24em; color:var(--dim2)}
.rhead b{font-size:15px; letter-spacing:.05em}
.reply.y .rhead b{color:var(--gold)}
.reply.n .rhead b{color:#ff9ba0}
.rline{margin:12px 0 0; font-size:14.5px; line-height:1.85; color:var(--text)}
.rwho{margin-top:10px; font-size:11.5px; color:var(--dim2); text-align:right}
.rnext{
  margin-top:14px; width:100%; appearance:none; cursor:pointer; font:inherit; font-size:13px;
  padding:10px; border-radius:10px; border:1px solid var(--line); background:transparent;
  color:var(--dim); letter-spacing:.08em;
}
.rnext:hover{border-color:var(--gold); color:var(--gold)}

/* ---------------------------------------------------------------- 飘字 */
#floats{position:fixed; inset:0; pointer-events:none; z-index:40}
.float{
  position:absolute; transform:translate(-50%,-50%); font-size:11.5px; font-weight:700;
  letter-spacing:.04em; padding:3px 8px; border-radius:999px; white-space:nowrap;
  background:rgba(11,9,16,.86); border:1px solid currentColor;
  animation:fl 1.4s cubic-bezier(.2,.8,.3,1) forwards;
}
.float.up{color:#7fdcb0}
.float.down{color:#ff9ba0}
@keyframes fl{
  0%{opacity:0; transform:translate(-50%,-40%) scale(.94)}
  16%{opacity:1; transform:translate(-50%,0) scale(1)}
  70%{opacity:1; transform:translate(-50%,40%) scale(1)}
  100%{opacity:0; transform:translate(-50%,110%) scale(.98)}
}

/* ---------------------------------------------------------------- 结局页 */
.endshell{max-width:640px; margin:0 auto; padding:min(4vh,32px) 4px 24px; text-align:center}
.endshell h1{
  margin:8px 0 0; font-size:clamp(30px,6.4vw,44px); letter-spacing:.16em; font-weight:800;
  color:var(--ec,var(--gold)); filter:drop-shadow(0 10px 26px rgba(0,0,0,.6));
}
.etag{margin:8px 0 0; font-size:11.5px; letter-spacing:.16em; color:var(--dim2)}
.etext{margin:22px auto 0; max-width:34em; text-align:left; font-size:14px; line-height:2; color:var(--dim)}
.etext p{margin:0 0 12px}
.etext .ecme{color:var(--text); border-left:2px solid var(--line); padding-left:12px; font-weight:500}
.ecred{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px auto 0; max-width:480px; font-size:12px; color:var(--dim2)}
.ecred.on{color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:8px 10px}
.ecred b{color:var(--gold); font-size:15px}
.estats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:22px auto 0; max-width:480px}
.estats div{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:8px 6px}
.estats span{display:block; font-size:10.5px; color:var(--dim2); letter-spacing:.1em}
.estats b{font-size:16px; font-variant-numeric:tabular-nums}
.erow{display:flex; gap:9px; justify-content:center; margin:22px 0 0; flex-wrap:wrap}
.elog{margin:20px auto 0; display:flex; flex-direction:column; gap:4px; max-width:420px;
  font-size:10.5px; color:var(--dim2); line-height:1.7; border-top:1px dashed var(--line); padding-top:12px}

/* ---------------------------------------------------------------- 弹窗 */
.modal{
  position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:18px;
  background:rgba(5,4,8,.72); backdrop-filter:blur(4px);
}
.modal.on{display:grid}
.modalbox{
  width:min(560px,100%); max-height:82dvh; overflow:auto; border-radius:16px;
  background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); padding:16px 16px 14px;
}
.mhead{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.mhead h3{margin:0; font-size:15px; letter-spacing:.1em}
.mhead small{color:var(--dim2); font-size:11px; font-weight:400; margin-left:6px}
.mhead .x{
  margin-left:auto; width:28px; height:28px; border-radius:8px; cursor:pointer; font:inherit;
  background:transparent; border:1px solid var(--line); color:var(--dim);
}
.mhead .x:hover{border-color:var(--red); color:#ff9ba0}
.rules{font-size:13px; line-height:1.95; color:var(--dim)}
.rules p{margin:0 0 10px}
.rules b{color:var(--text)}
.rules h4{margin:16px 0 4px; font-size:12.5px; color:var(--gold); letter-spacing:.1em}
.rules ul{margin:0; padding-left:18px}
.rules li{margin:3px 0}
.book{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.bk{border:1px solid var(--line); border-radius:11px; padding:9px 11px; background:var(--panel2)}
.bk b{display:block; font-size:13.5px; color:var(--ec); letter-spacing:.06em}
.bk span{display:block; margin-top:2px; font-size:10.5px; color:var(--dim2)}
.bk.lock{opacity:.45}
.bk.lock b{color:var(--dim2)}
.mfoot{margin:14px 0 0; font-size:10.5px; line-height:1.9; color:var(--dim2)}

/* 人物册：72 个人按界域分组，见过才亮 */
.mnote{margin:0 0 6px; font-size:10.5px; line-height:1.85; color:var(--dim2)}
.cg{margin:14px 0 7px; font-size:12px; letter-spacing:.12em; color:var(--rc); display:flex; align-items:baseline; gap:6px}
.cg small{font-size:10px; font-weight:400; color:var(--dim2); letter-spacing:.04em}
.clist{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.crow{
  display:flex; align-items:baseline; gap:5px; min-width:0; padding:5px 8px;
  border-radius:9px; background:var(--panel2); border:1px solid var(--line);
}
.crow b{font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crow .cs{font-size:11.5px; font-weight:700; flex:0 0 auto; line-height:1; color:var(--dim2)}
.crow .cs.f{color:#c9a0e8}
.crow .cs.m{color:#8fbce8}
.crow .ct{font-size:10px; color:var(--dim2); margin-left:auto; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.crow.unmet{opacity:.58}

@media (max-width:760px){
  .diffs{grid-template-columns:1fr}
  .mtr{padding:5px 6px; gap:4px}
  .mn{font-size:10px}
  .mv{font-size:11.5px}
  .mico svg{width:13px; height:13px}
  .say{font-size:15px; line-height:1.72}
  .ch{font-size:12.5px; padding:8px 6px 7px}
  .cfx i{font-size:9px; padding:0 4px}
  .estats{grid-template-columns:repeat(3,1fr)}
  .book{grid-template-columns:1fr}
  .clist{grid-template-columns:1fr}
}
@media (max-width:430px){
  .ttl span{display:none}
  .ddl .dk{letter-spacing:.06em}
}
@media (max-height:640px){
  .card{height:min(100%,470px)}
  .say{font-size:14px; line-height:1.66}
  .bubble{padding:12px 14px 12px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>

      <span>弥萨格 · 守密人的任期</span>
    </div>
    <span class="chip" id="dayChip">任期未开始</span>
    <button class="ico" id="charsBtn" type="button" aria-label="人物册" title="人物册">册</button>
    <button class="ico" id="soundBtn" type="button" aria-label="音效开关">♪</button>
    <button class="ico" id="helpBtn" type="button" aria-label="玩法说明">?</button>
  </header>

  <div class="ddl" id="ddl" aria-live="polite"></div>

  <section class="meters" id="meters" aria-label="四项资源"></section>

    <span>黑潮</span>
    <div class="tbar"><i id="tideFill"></i></div>

  <main id="stage">
    <section class="scr on" id="scr-title"></section>

    <section class="scr" id="scr-play">
      <div class="deckwrap">
        <span class="hint l" id="hintNo">不准</span>
        <span class="hint r" id="hintYes">准许</span>
        <div class="deck" id="deck"></div>
      </div>
      <div class="choices" id="choices">
        <button class="ch no" id="btnNo" type="button">
          <span class="chrow"><em>←</em><b class="cl">不准</b></span>
          <span class="cfx"></span>
        </button>
        <button class="ch yes" id="btnYes" type="button">
          <span class="chrow"><b class="cl">准许</b><em>→</em></span>
          <span class="cfx"></span>
        </button>
      </div>
    </section>

    <section class="scr" id="scr-end"></section>
  </main>

<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
