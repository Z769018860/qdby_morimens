<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个人中心 · 忘忘同人小游戏</title>
<meta name="description" content="忘忘同人小游戏个人中心：账号与头像、银芯、九个同人小游戏的进度总览、存档同步。">
<meta name="theme-color" content="#f6f7fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231f2430%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%224.5%22%2F%3E%0A%20%20%3Cline%20x1%3D%2237.5%22%20y1%3D%2236.5%22%20x2%3D%2249%22%20y2%3D%2248%22%20stroke%3D%22%23e8b04b%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2228%22%20cy%3D%2227%22%20r%3D%224%22%20fill%3D%22%23e8b04b%22%2F%3E%0A%3C%2Fsvg%3E%0A" type="image/svg+xml">
<style>
/* 配色调成和首页（忘忘看报）同一套：浅底、白卡、极淡光斑。
   这里不引 css/style.css —— 那份是战报侦探的深色皮肤，套到个人中心上会把整页拉回旧样子。 */
:root{
  --bg:#f6f7fb; --card:#fff; --panel2:#f3f4f6; --line:#e5e7eb;
  --text:#1f2937; --dim:#6b7280; --accent:#111827; --accent2:#334155;
  --gold:#c2410c; --green:#137a3c; --violet:#6d4bd8; --blue:#1f5fa8;
  --shadow:0 10px 25px rgba(17,24,39,.08);
  --shadow2:0 2px 8px rgba(17,24,39,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background-image:
    radial-gradient(760px 420px at 8% -8%, rgba(99,102,241,.055), transparent 62%),
    radial-gradient(680px 420px at 96% 2%, rgba(14,165,233,.05), transparent 60%),
    radial-gradient(700px 460px at 52% 104%, rgba(16,185,129,.04), transparent 62%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;line-height:1.3}
b,strong{font-weight:700}
.dim{color:var(--dim)}

/* ---------------------------------------------------------------- 顶栏 */
.pfh{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:9px clamp(12px,3vw,28px);
  background:rgba(246,247,251,.86); backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.pfh .brand{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.pfh .brand b{font-size:15px; letter-spacing:.01em; white-space:nowrap}
.pfh .brand small{font-size:9.5px; letter-spacing:.22em; color:#9aa3af; white-space:nowrap}

/* 左上角那三个数：注册用户 / 今日浏览 / 总浏览。
   放 brand 右边，窄屏自动换行成一行小字，不挤掉右侧按钮。 */
.sitestat{display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:999px; background:#fff; overflow:hidden}
.sitestat span{display:flex; align-items:baseline; gap:5px; padding:4px 11px; white-space:nowrap}
.sitestat span+span{border-left:1px solid var(--line)}
.sitestat b{font-size:13px; font-variant-numeric:tabular-nums}
.sitestat small{font-size:10.5px; color:var(--dim)}
.sitestat.off{display:none}

.pfh-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.pfh-right .ghost{font-size:12.5px; color:var(--dim); padding:6px 8px; border-radius:8px}
.pfh-right .ghost:hover{background:#fff; color:var(--text)}
.uchip{display:flex; align-items:center; gap:7px; padding:4px 11px 4px 4px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:12.5px; max-width:190px}
.uchip img{width:24px; height:24px; border-radius:50%; object-fit:cover; flex:0 0 auto}
.uchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ---------------------------------------------------------------- 版心 */
.wrap{max-width:1080px; margin:0 auto; padding:clamp(14px,2.4vw,26px) clamp(12px,3vw,28px) 56px}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 17px; box-shadow:var(--shadow2); margin-bottom:14px}
.card>h2{font-size:15px; margin-bottom:2px}
.card>.sub{font-size:12.5px; color:var(--dim); margin:2px 0 12px}
.pagehead{margin:4px 0 16px}
.pagehead h1{font-size:clamp(22px,3.4vw,30px); letter-spacing:-.01em}
.pagehead p{margin:6px 0 0; color:var(--dim); font-size:13px}

/* ---------------------------------------------------------------- 账号概览 */
.hero{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.hero .pfavatar{width:76px; height:76px; border-radius:50%; object-fit:cover; border:2px solid #fff; box-shadow:var(--shadow); flex:0 0 auto; background:var(--panel2)}
.hero .meta{min-width:180px; flex:1 1 200px}
.hero .meta h2{font-size:20px}
.hero .meta p{margin:3px 0 0; font-size:12.5px; color:var(--dim)}
.pfstats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; width:100%; margin-top:12px}
.statbox{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:9px 11px; display:flex; flex-direction:column; gap:1px; min-width:0}
.statbox small{font-size:10.5px; color:var(--dim)}
.statbox b{font-size:17px; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:4px}
.actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 16px; border-radius:10px; border:1px solid transparent; cursor:pointer;
  font:inherit; font-size:13px; font-weight:600; color:#fff;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 6px 16px -8px rgba(17,24,39,.5); transition:transform .12s ease, filter .15s ease;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55; cursor:default; filter:none}
.btn.ghost{background:#fff; color:var(--text); border-color:var(--line); box-shadow:none}
.btn.ghost:hover{border-color:#c7cbd3; filter:none}
.btn.sm{padding:6px 12px; font-size:12px; border-radius:9px}
.btn.danger{color:#b42318; border-color:#f0c8c4}
.link{background:none; border:0; padding:0; font:inherit; font-size:12.5px; color:var(--blue); cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.empty{margin:6px 0 0; padding:22px 12px; text-align:center; color:var(--dim); font-size:12.5px; border:1px dashed var(--line); border-radius:12px; background:#fafbfc}

/* 银芯图标（js/common.js 的 scNum 用的是这套类名） */
.sc-ico{width:15px; height:15px; vertical-align:-2px; object-fit:contain}
.sc-num{display:inline-flex; align-items:center; gap:4px}

/* ---------------------------------------------------------------- 游戏数据 */
.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:10px}
.gcard{border:1px solid var(--line); border-radius:14px; padding:12px 13px; background:#fff; display:flex; flex-direction:column; gap:9px; transition:border-color .15s ease, transform .15s ease, box-shadow .18s ease}
.gcard:hover{border-color:#cfd4dc; transform:translateY(-1px); box-shadow:var(--shadow2)}
.gcard .gh{display:flex; align-items:center; gap:7px; min-width:0}
.gcard .ic{width:24px; height:24px; border-radius:7px; display:grid; place-items:center; background:var(--panel2); font-size:13px; flex:0 0 auto}
.gcard .nm{font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gcard .items{display:flex; gap:12px; flex-wrap:wrap}
.gcard .items div{display:flex; flex-direction:column; line-height:1.25; min-width:44px}
.gcard .items b{font-size:14px; font-variant-numeric:tabular-nums}
.gcard .items small{font-size:10.5px; color:var(--dim)}
.gcard .extra{font-size:11.5px; color:var(--dim); min-height:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* 货币小图标（挂机那格的券 / 银芯）。图本身有留白，13px 才跟 11.5px 的字对得上 */
.gcard .extra .ico-inl{width:13px; height:13px; display:inline-block; vertical-align:-3px; object-fit:contain}
.gcard .go{font-size:12px; color:var(--blue); margin-top:auto}

/* ---------------------------------------------------------------- 资料编辑 */
.fld{display:flex; flex-direction:column; gap:4px; margin-bottom:10px}
.fld small{font-size:11.5px; color:var(--dim)}
input[type=text],input[type=password]{font:inherit; font-size:13px; padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--text); outline:none; max-width:340px}
input[type=text]:focus,input[type=password]:focus{border-color:#9aa3af; box-shadow:0 0 0 3px rgba(17,24,39,.06)}

/* ---------------------------------------------------------------- 离线存档导入 */
.savebox{margin-top:12px; padding:12px 13px; border:1px dashed #d3d7de; border-radius:12px; background:var(--panel2)}
.savebox[hidden]{display:none}
.savebox .savetip{font-size:12px; line-height:1.65; color:var(--dim); margin:0 0 10px}
.savebox .saverow{display:flex; gap:8px; flex-wrap:wrap}
.savebox .saverow input{flex:1 1 200px; max-width:380px}
.savebox .actions{margin-top:10px}
.savemsg{font-size:12px; line-height:1.6; margin:9px 0 0; color:var(--dim); min-height:1em}
.savemsg.ok{color:#137a3c}
.savemsg.bad{color:#b42318}
.pfeditrow{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
.pfeditrow .pfavatar.small{width:58px; height:58px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--panel2)}
.avpickhead{display:flex; align-items:baseline; gap:8px}
.avpickhead b{font-size:12.5px}
.avtabs{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
.avtab{font:inherit; font-size:11.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; color:var(--dim); cursor:pointer}
.avtab.on{background:var(--accent); border-color:var(--accent); color:#fff}
.avgv{display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:6px; max-height:230px; overflow:auto; padding:2px}
.avg{padding:0; border:2px solid transparent; border-radius:11px; background:var(--panel2); cursor:pointer; overflow:hidden; aspect-ratio:1}
.avg img{width:100%; height:100%; object-fit:cover; display:block}
.avg.on{border-color:var(--accent)}

/* ---------------------------------------------------------------- 管理员入口 */
.adminlink{border-color:#e7d5b3; background:linear-gradient(180deg,#fffdf7,#fff)}

/* ---------------------------------------------------------------- 骨架 / 提示 */
#boot{display:grid; place-items:center; gap:10px; padding:80px 0; color:var(--dim)}
#boot .ring{width:26px; height:26px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--accent); animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot.off{display:none}
.toast{position:fixed; left:50%; bottom:8%; transform:translateX(-50%); z-index:90; padding:9px 16px; border-radius:999px; background:#111827; color:#fff; font-size:13px; box-shadow:var(--shadow); opacity:0; animation:tin .2s ease forwards}
@keyframes tin{to{opacity:1}}

@media (max-width:720px){
  /* 窄屏：品牌和右侧按钮占第一行，三个数字单独占第二行（不然会折成三行，顶栏太占地方） */
  .pfh{gap:8px 10px; padding:8px 12px}
  .sitestat{order:3; flex:1 0 100%; justify-content:space-between; border-radius:12px}
  .sitestat span{flex:1 1 0; justify-content:center; padding:4px 6px}
  .sitestat b{font-size:12.5px}
  .sitestat small{font-size:10px}
  .pfh-right{margin-left:auto}
  .pfstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .pfavatar{width:60px; height:60px}
  .games{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<body>
<header class="pfh">
  <a class="brand" href="index.html"><b>忘忘同人小游戏</b><small>MORIMENS FAN WORKS</small></a>
  <div class="sitestat off" id="sitestat" title="注册用户 / 今日浏览 / 总浏览">
    <span><b id="st-users">—</b><small>注册用户</small></span>
    <span><b id="st-today">—</b><small>今日浏览</small></span>
    <span><b id="st-total">—</b><small>总浏览</small></span>
  </div>
  <div class="pfh-right" id="pfhRight">
    <a class="ghost" href="index.html">回首页</a>
  </div>
</header>
<main id="app" class="wrap">
  <div id="boot" role="status" aria-live="polite"><div class="ring"></div><p id="bootText">正在载入…</p><p id="bootHint"></p></div>
</main>
<script>
/* 首屏守护 + 启动数据预取（构建时注入，各页共用一份）
   1) 占位是纯 HTML，HTML 一到就能画，不等任何 JS；
   2) 模块或数据卡住时给出可点的界面，绝不留只有页脚的白屏；
   3) 启动数据拆两路并行：data/boot.json（索引/标签/关键词，约 110KB）与
      data/dict.json（图鉴字典，约 520KB，只有要用字典的页面才下）。
      拿到 boot.json 就能开拉题库分片，字典在后台并行走——原来挤成一个 918KB 的文件，
      分片必须等它下完才能开始，手机上白白多一个「1~2 秒」的轮次。 */
(function () {
  // ---------------------------------------------------------------- 兼容垫片
  // 手机上的内置浏览器（微信 / QQ / 各家浏览器）内核普遍比 Chrome 慢两三年，
  // 少一个 API 就是整页报错、什么都不显示。这里补两个最常用的。
  if (window.Element && !Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function () {
      while (this.firstChild) this.removeChild(this.firstChild);
      for (var i = 0; i < arguments.length; i++) {
        var n = arguments[i];
        if (n == null) continue;
        this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n);
      }
    };
  }
  if (!String.prototype.replaceAll) {
    String.prototype.replaceAll = function (find, rep) { return this.split(find).join(rep); };
  }
  // <dialog> 在 iOS 15.4 之前根本没有：没有 showModal 时退回「加 open 属性」，
  // 版式由 css/style.css 的 dialog.picker[open] 兜住，至少还能选、不会整页崩掉。
  (function () {
    var proto = window.HTMLDialogElement && HTMLDialogElement.prototype;
    if (!proto || proto.showModal) return;
    proto.showModal = function () { this.setAttribute('open', ''); };
    proto.close = function () { this.removeAttribute('open'); };
  })();

  var bootEl = document.getElementById('boot');
  var textEl = document.getElementById('bootText');
  var hintEl = document.getElementById('bootHint');
  var t0 = Date.now();
  var settled = false;

  function setHint(s) { if (hintEl) hintEl.textContent = s; }

  function retryBtn(label) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.onclick = function () { location.replace(location.pathname + '?r=' + Date.now()); };
    return btn;
  }

  // 慢一点就说句话，别让人以为死了
  var hintTimer = setTimeout(function () {
    if (!document.getElementById('boot')) return;
    setHint('网络较慢，正在继续载入（站点在新加坡节点，首次访问会慢一些）…');
  }, 7000);

  // 看门狗：20 秒还没渲染出内容，给一个明确的按钮。
  // 这时候如果主脚本压根没跑起来（语法太旧 / 被插件或代理拦了），提示要说清楚，
  // 否则用户只会反复点「重新载入」。
  var dog = setInterval(function () {
    if (!document.getElementById('boot')) { clearInterval(dog); clearTimeout(hintTimer); settled = true; return; }
    if (Date.now() - t0 < 20000) return;
    clearInterval(dog);
    if (settled) return;
    settled = true;
    bootEl.className = 'err';
    if (!window.__bootMain) {
      textEl.textContent = '脚本没能启动';
      setHint('浏览器可能太旧了：请用 Chrome / Edge 90 以上、或 iOS 15 以上的 Safari 打开；'
        + '360、QQ 浏览器请在地址栏切到「极速」模式。');
    } else {
      textEl.textContent = '载入超时';
      setHint('可能是到服务器的连接卡住了，点下面的按钮重试（会重新拉一次）。');
    }
    bootEl.appendChild(retryBtn('重新载入'));
  }, 1000);

  // 内核探测：以前靠「顶层 await 能不能解析」判断内核新旧。现在打包产物里已经没有
  // 顶层 await（Chrome 61+ / Safari 11+ 都能跑），这条路不需要了——真的跑不起来时，
  // 脚本的 onerror 和下面的看门狗会接手。

  function fail(msg) {
    if (settled || !document.getElementById('boot')) return;
    settled = true;
    clearInterval(dog);
    bootEl.className = 'err';
    textEl.textContent = '载入失败';
    setHint(msg || '');
    bootEl.appendChild(retryBtn('重试'));
  }
  window.__bootFailed = fail;

  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      fail('脚本加载失败：' + (t.src || t.href || ''));
    } else if (e && e.message && /import|module|MIME|Failed to fetch/i.test(e.message)) {
      fail(e.message);
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    fail(r && (r.message || String(r)));
  });

  // 带超时与一次重试的 JSON 拉取：实测边缘偶尔会挂起连接不返回
  function get(url, retried) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 10000);
    return fetch(url, { signal: ctl.signal }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.json();
    }).catch(function (err) {
      clearTimeout(timer);
      if (retried) throw err;
      return get(url + (url.indexOf('?') < 0 ? '?' : '&') + 'rt=' + Date.now(), true);
    });
  }

  //  /  由构建替换：要用启动数据的页面是真地址，其余是空串（一个字节都不下）
  var dataUrl = '';
  var data = dataUrl ? get(dataUrl) : null;
  if (data) data.catch(function () {});
  var dictUrl = '';
  var dict = dictUrl ? get(dictUrl) : null;
  if (dict) dict.catch(function () {});
  window.__boot = { data: data, dict: dict };
})();
</script>
<script nomodule>/* 老到不支持 ES module（多半是 360/QQ 浏览器的「兼容模式」= IE 内核） */
(function () {
  var el = document.getElementById('boot'); if (el) el.className = 'err';
  var t = document.getElementById('bootText'); if (t) t.textContent = '浏览器内核太旧';
  var h = document.getElementById('bootHint');
  if (h) h.textContent = '请在地址栏右侧把「兼容」切成「极速」（闪电图标），或改用 Chrome / Edge 打开。';
})();
</script>

<script>
/* 回访加速：静态资源走 Service Worker 缓存。平台的静态响应头是
   Cache-Control: max-age=0, must-revalidate，每个文件每次都要回源，
   而边缘一个来回就要 1~2 秒；SW 缓存能把这部分彻底省掉。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
